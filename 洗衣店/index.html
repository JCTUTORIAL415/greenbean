<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>洗衣店 POS 系統</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1117;--bg2:#1a1d27;--bg3:#222536;--border:#2e3347;--accent:#4f8ef7;--green:#2ecc71;--yellow:#f0c040;--red:#e74c3c;--orange:#e67e22;--purple:#a78de8;--text:#e8eaf0;--text2:#8b90a7;--text3:#5a5f75;--card:#1e2132;--radius:10px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--text);font-size:16px;min-height:100vh}
.topbar{background:var(--bg2);border-bottom:1px solid var(--border);height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:sticky;top:0;z-index:200}
.logo{font-size:19px;font-weight:700;color:var(--accent);letter-spacing:1px}
.topnav{display:flex;gap:3px}
.tnav{padding:6px 13px;border-radius:6px;border:none;background:transparent;color:var(--text2);cursor:pointer;font-family:inherit;font-size:15px;transition:.15s}
.tnav:hover{background:var(--bg3);color:var(--text)}
.tnav.active{background:var(--accent);color:#fff}
.datetime{font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--text2)}
.main{display:flex;height:calc(100vh - 52px)}
.content{flex:1;overflow-y:auto;padding:18px}
.sidebar{width:330px;background:var(--bg2);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.card-title{font-size:13px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--text3);margin-bottom:10px}
.btn{padding:8px 14px;border-radius:7px;border:none;cursor:pointer;font-family:inherit;font-size:15px;font-weight:500;display:inline-flex;align-items:center;gap:5px;transition:.15s}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:#3a7be0}
.btn-ghost{background:var(--bg3);color:var(--text);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--border)}
.btn-danger{background:var(--red);color:#fff}
.btn-danger:hover{background:#c0392b}
.btn-success{background:var(--green);color:#fff}
.btn-success:hover{background:#27ae60}
.btn-warn{background:var(--orange);color:#fff}
.btn-sm{padding:5px 10px;font-size:14px}
.btn-xs{padding:3px 8px;font-size:13px;border-radius:5px}
.btn-block{display:flex;width:100%;justify-content:center}
.btn:disabled{opacity:.5;cursor:not-allowed}
.fg{margin-bottom:11px}
.fl{display:block;font-size:14px;color:var(--text2);margin-bottom:4px}
.fi{width:100%;padding:7px 10px;background:var(--bg3);border:1px solid var(--border);border-radius:7px;color:var(--text);font-family:inherit;font-size:15px}
.fi:focus{outline:none;border-color:var(--accent)}
.fi::placeholder{color:var(--text3)}
.frow{display:flex;gap:10px;align-items:flex-end}
.frow .fg{flex:1;margin-bottom:0}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:13px;font-weight:600}
.b-blue{background:rgba(79,142,247,.15);color:var(--accent)}
.b-green{background:rgba(46,204,113,.15);color:var(--green)}
.b-yellow{background:rgba(240,192,64,.15);color:var(--yellow)}
.b-red{background:rgba(231,76,60,.15);color:var(--red)}
.b-purple{background:rgba(167,141,232,.15);color:var(--purple)}
.b-gray{background:var(--bg3);color:var(--text2)}
.b-orange{background:rgba(230,126,34,.15);color:var(--orange)}
.mode-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.mode-btn{padding:14px 8px;border-radius:var(--radius);border:2px solid var(--border);background:var(--bg3);cursor:pointer;text-align:center;transition:.15s;font-family:inherit}
.mode-btn:hover{border-color:var(--accent);background:rgba(79,142,247,.08)}
.mode-btn.active{border-color:var(--accent);background:rgba(79,142,247,.12)}
.mode-btn .micon{font-size:24px;margin-bottom:4px}
.mode-btn .mname{font-size:14px;font-weight:600;color:var(--text)}
.mode-btn .msub{font-size:12px;color:var(--text3);margin-top:2px}
.member-types{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.mtype-btn{padding:14px 8px;border-radius:var(--radius);border:2px solid var(--border);background:var(--bg3);cursor:pointer;text-align:center;transition:.15s;font-family:inherit}
.mtype-btn:hover{border-color:var(--accent);background:rgba(79,142,247,.1)}
.mtype-btn .mticon{font-size:26px}
.mtype-btn .mtname{font-size:15px;font-weight:600;margin-top:6px;color:var(--text)}
.mtype-btn .mtsub{font-size:13px;color:var(--text3);margin-top:3px}
.member-info-card{background:linear-gradient(135deg,rgba(79,142,247,.12),rgba(124,92,191,.08));border:1px solid rgba(79,142,247,.3);border-radius:var(--radius);padding:12px 14px;margin-bottom:12px}
.mi-name{font-size:18px;font-weight:700}
.mi-phone{font-size:14px;color:var(--text2);margin-top:2px}
.mi-row{display:flex;gap:20px;margin-top:10px}
.mi-stat-val{font-size:18px;font-weight:700;color:var(--accent);font-family:'JetBrains Mono',monospace}
.mi-stat-label{font-size:12px;color:var(--text3)}
.order-items{flex:1;overflow-y:auto;padding:12px}
.order-item{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;margin-bottom:8px;position:relative}
.oi-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.oi-name{font-weight:600;font-size:15px;padding-right:20px}
.oi-price{font-family:'JetBrains Mono',monospace;font-size:15px;color:var(--accent);font-weight:600}
.oi-sub{font-size:13px;color:var(--text2);line-height:1.6}
.oi-del{position:absolute;top:8px;right:8px;background:none;border:none;color:var(--red);cursor:pointer;font-size:18px;padding:2px 5px;border-radius:4px}
.oi-del:hover{color:#fff;background:var(--red)}
.cart-total{border-top:1px solid var(--border);padding:14px}
.total-row{display:flex;justify-content:space-between;margin-bottom:5px;font-size:15px}
.total-row.final{font-size:18px;font-weight:700;color:var(--green);border-top:1px solid var(--border);padding-top:8px;margin-top:4px}
.product-list{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;max-height:220px;overflow-y:auto;margin-bottom:4px}
.product-card{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:10px;cursor:pointer;transition:.15s}
.product-card:hover{border-color:var(--accent);background:rgba(79,142,247,.08)}
.pc-name{font-size:15px;font-weight:600}
.pc-price{font-size:14px;color:var(--accent);font-family:'JetBrains Mono',monospace;margin-top:2px}
.addon-list{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px}
.addon-chip{padding:5px 10px;border-radius:20px;border:1px solid var(--border);background:var(--bg3);cursor:pointer;font-size:14px;transition:.15s;user-select:none}
.addon-chip:hover{border-color:var(--accent);background:rgba(79,142,247,.15);color:var(--accent)}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:8px 10px;font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text3);border-bottom:1px solid var(--border)}
td{padding:9px 10px;font-size:15px;border-bottom:1px solid rgba(46,51,71,.5)}
tr:hover td{background:rgba(255,255,255,.02)}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px;text-align:center}
.stat-val{font-size:24px;font-weight:700;font-family:'JetBrains Mono',monospace}
.stat-label{font-size:13px;color:var(--text2);margin-top:3px}
.tabs{display:flex;gap:3px;border-bottom:1px solid var(--border);margin-bottom:14px}
.tab{padding:8px 14px;border:none;background:transparent;color:var(--text2);cursor:pointer;font-family:inherit;font-size:15px;border-bottom:2px solid transparent;margin-bottom:-1px;transition:.15s}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:12px;width:100%;max-width:480px;max-height:88vh;overflow-y:auto}
.modal-header{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-title{font-size:17px;font-weight:700}
.modal-close{background:none;border:none;color:var(--text2);cursor:pointer;font-size:20px;padding:2px 6px;border-radius:4px}
.modal-close:hover{color:var(--text)}
.modal-body{padding:18px}
.modal-footer{padding:14px 18px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}
.sep{border:none;border-top:1px solid var(--border);margin:12px 0}
.flex{display:flex}
.items-center{align-items:center}
.justify-between{justify-content:space-between}
.gap-8{gap:8px}
.gap-4{gap:4px}
.mt-8{margin-top:8px}
.mb-8{margin-bottom:8px}
.font-mono{font-family:'JetBrains Mono',monospace}
.text-accent{color:var(--accent)}
.text-green{color:var(--green)}
.text-red{color:var(--red)}
.text-yellow{color:var(--yellow)}
.text-sm{font-size:14px;color:var(--text2)}
.fw-bold{font-weight:700}
.hidden{display:none!important}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.qty-ctrl{display:flex;align-items:center;gap:6px;margin-top:8px}
.qty-ctrl span{min-width:24px;text-align:center;font-family:'JetBrains Mono',monospace;font-size:15px}
.drag-item{cursor:move}
/* PRINT STYLES */
@media print {
body *{visibility:hidden}
#printArea,#printArea *{visibility:visible}
#printArea{position:fixed;left:0;top:0;width:100%;background:#fff;color:#000;padding:12px;font-family:'Noto Sans TC',sans-serif;font-size:14px; display: block !important;}
.rshop{text-align:center;font-size:18px;font-weight:700;margin-bottom:8px}
.rphone{text-align:center;font-size:13px;color:#555;margin-bottom:8px}
.rhr{border:none;border-top:1px dashed #999;margin:8px 0}
.rrow{display:flex;justify-content:space-between;margin-bottom:4px;font-size:14px}
.rtitle{font-size:15px;font-weight:700;text-align:center;margin:8px 0}
.rnum{font-size:26px;font-weight:700;text-align:center;letter-spacing:2px;margin:8px 0;padding:4px 0}
.rnote{font-size:12px;color:#777;margin-top:12px;border-top:1px dashed #ccc;padding-top:8px}
.rdate{text-align:center;font-size:12px;color:#999;margin-top:8px}
.print-section{page-break-after:always}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="printArea" style="display:none"></div>
<script>
// ============================================================
// DATA STORE
// ============================================================
const Store = {
shopName: '清潔美洗衣坊',
shopPhone: '02-2345-6789',
shopNote: '取件時請攜帶本收據，逾期未取酌收保管費。如有問題請來電洽詢。',
dailyCounter: 5,
sCounter: 3,
pCounter: 2,
members: [
    {id:'M001',name:'陳小明',phone:'0912345678',level:'gold',points:120,discount:0.8,balance:500},
    {id:'M002',name:'林美玲',phone:'0933111222',level:'silver',points:45,discount:0.9,balance:0},
    {id:'M003',name:'王大華',phone:'0966777888',level:'special',points:0,discount:0.75,balance:1000},
],
products: [
    {id:'PRD01',name:'大衣',price:350,category:'professional',unit:'件',isBlanket:false},
    {id:'PRD02',name:'西裝外套',price:280,category:'professional',unit:'件',isBlanket:false},
    {id:'PRD03',name:'棉被（單人）',price:450,category:'professional',unit:'件',isBlanket:true},
    {id:'PRD04',name:'棉被（雙人）',price:600,category:'professional',unit:'件',isBlanket:true},
    {id:'PRD05',name:'羽絨服',price:320,category:'professional',unit:'件',isBlanket:false},
    {id:'PRD06',name:'西裝褲',price:180,category:'professional',unit:'件',isBlanket:false},
    {id:'PRD07',name:'裙子',price:160,category:'professional',unit:'件',isBlanket:false},
    {id:'PRD08',name:'上衣/T恤',price:150,category:'professional',unit:'件',isBlanket:false},
    {id:'PRD09',name:'現場洗',price:80,category:'walkin',unit:'籃',isBlanket:false},
    {id:'PRD10',name:'現場烘',price:60,category:'walkin',unit:'籃',isBlanket:false},
    {id:'PRD11',name:'純洗',price:80,category:'wash',unit:'籃',isBlanket:false},
    {id:'PRD12',name:'純烘',price:60,category:'dry',unit:'籃',isBlanket:false},
    {id:'PRD13',name:'純燙',price:100,category:'iron',unit:'件',isBlanket:false},
],
addons: [
    {id:'ADD01',name:'低溫烘多次',price:50},
    {id:'ADD02',name:'裝衣袋',price:20},
    {id:'ADD03',name:'去漬加工',price:80},
    {id:'ADD04',name:'補縫加工',price:60},
    {id:'ADD05',name:'特殊洗劑',price:40},
    {id:'ADD06',name:'急件加收',price:100},
    {id:'ADD07',name:'折包服務',price:30},
],
zones: ['A-1','A-2','A-3','B-1','B-2','B-3','C-1','C-2','C-3','D-1','D-2','D-3'],
orders: [
    {id:'ORD001',orderNum:'S0001',type:'store',status:'done',customerName:'陳小明',phone:'0912345678',items:[{name:'大衣',price:350,qty:1,addons:[]}],total:280,origTotal:350,discount:0.8,date:todayStr(),pickupDate:addDays(3),zone:'A-1',blanketCount:0,remark:'',doneDate:addDays(1)+' 08:00'},
    {id:'ORD002',orderNum:'P0001',type:'outsource',status:'returned',customerName:'林美玲',phone:'0933111222',items:[{name:'棉被（單人）',price:450,qty:1,addons:[]}],total:405,origTotal:450,discount:0.9,date:todayStr(),pickupDate:addDays(4),zone:'B-2',blanketCount:1,remark:'',returnDate:addDays(2)+' 09:00'},
    {id:'ORD003',orderNum:'6',type:'walkin',status:'collected',customerName:'王大華',phone:'0966777888',items:[{name:'現場洗',price:80,qty:2,addons:[]}],total:160,origTotal:160,discount:1,date:todayStr(),pickupDate:todayStr(),zone:'C-3',blanketCount:0,remark:'',collectedDate:addDays(0)+' 17:00'},
],
discountLevels:{gold:0.8,silver:0.9},
getNextDailyNum(){ return String(++this.dailyCounter) },
getNextS(){ return 'S'+String(++this.sCounter).padStart(4,'0') },
getNextP(){ return 'P'+String(++this.pCounter).padStart(4,'0') },
findMember(q){ q=(q||'').replace(/-/g,'').trim(); return this.members.find(m=>m.id===q||m.phone===q||m.phone.replace(/-/g,'')===q) },
addOrder(o){ this.orders.unshift(o) },
updateOrderStatus(id,s,extra){ const o=this.orders.find(x=>x.id===id); if(o){ o.status=s; if(extra) Object.assign(o,extra) } },
};
// ============================================================
// STATE
// ============================================================
let S = {
page:'pos',
customerType:null,
memberData:null,
memberSearch:'',
guestName:'',guestPhone:'',
specialDiscount:0.75,
guestDiscount:null,
currentMode:'walkin',
cartItems:[],
pickupDate:addDays(3),
zone:'A-1',
outsendDate:todayStr(),
returnDate:addDays(2),
remark:'',
filterDate:'',
filterStatus:'all',
filterType:'all',
filterCustomer:'',
orderSort:'newest',
settingsTab:'products',
statsPeriod:'daily',
modal:null,
modalData:{},
overrideDiscount:1,
};
function todayStr(){ return new Date().toISOString().slice(0,10) }
function addDays(n){ const d=new Date(); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10) }
function uid(){ return 'ORD'+Date.now() }
function getPeriodFilter(period) {
let now = new Date();
if (period === 'daily') return o => o.date === todayStr();
if (period === 'weekly') {
let start = new Date(now); start.setDate(start.getDate() - start.getDay()); start = start.toISOString().slice(0,10);
let end = new Date(now); end.setDate(end.getDate() + (6 - end.getDay())); end = end.toISOString().slice(0,10);
return o => o.date >= start && o.date <= end;
  }
if (period === 'monthly') {
let start = now.toISOString().slice(0,8)+'01';
let end = new Date(now.getFullYear(), now.getMonth()+1, 0).toISOString().slice(0,10);
return o => o.date >= start && o.date <= end;
  }
if (period === 'yearly') {
let start = now.getFullYear() + '-01-01';
let end = now.getFullYear() + '-12-31';
return o => o.date >= start && o.date <= end;
  }
return () => true;
}
function render(){ document.getElementById('app').innerHTML = buildApp(); schedClock(); }
function schedClock(){
const el=document.getElementById('clk');
if(!el) return;
const n=new Date();
el.textContent=n.toLocaleDateString('zh-TW',{year:'numeric',month:'2-digit',day:'2-digit'})+' '+n.toTimeString().slice(0,8);
setTimeout(schedClock,1000);
}
// ============================================================
// BUILD APP
// ============================================================
function buildApp(){
return `
  <div>
${buildTopbar()}
    <div class="main no-print">
${S.page==='pos'?buildPOSMain():''}
${S.page==='orders'?buildOrdersPage():''}
${S.page==='stats'?buildStatsPage():''}
${S.page==='settings'?buildSettingsPage():''}
    </div>
${S.modal?buildModal():''}
  </div>`;
}
// ============================================================
// TOPBAR
// ============================================================
function buildTopbar(){
const tabs=[{k:'pos',l:'📋 收單'},{k:'orders',l:'📦 訂單管理'},{k:'stats',l:'📊 統計報表'},{k:'settings',l:'⚙️ 設定'}];
return `<div class="topbar">
    <div class="flex items-center gap-8">
      <div class="logo">🫧 ${Store.shopName}</div>
      <nav class="topnav">
${tabs.map(t=>`<button class="tnav ${S.page===t.k?'active':''}" onclick="go('${t.k}')">${t.l}</button>`).join('')}
      </nav>
    </div>
    <div class="flex items-center gap-8">
      <span id="clk" class="datetime"></span>
      <button class="btn btn-ghost btn-sm" onclick="openModal('newMember')">👤 新增會員</button>
    </div>
  </div>`;
}
// ============================================================
// POS PAGE
// ============================================================
function buildPOSMain(){
return `
  <div class="content">
${buildCustomerSection()}
${S.customerType ? buildOrderSection() : ''}
  </div>
${S.customerType ? buildSidebar() : '<div class="sidebar" style="align-items:center;justify-content:center"><div class="text-sm" style="padding:40px;text-align:center;color:var(--text3)">請先選擇顧客身份</div></div>'}`;
}
function buildCustomerSection(){
if(!S.customerType){
return `<div class="card">
      <div class="card-title">步驟一：顧客身份</div>
      <div class="member-types">
        <button class="mtype-btn" onclick="setCT('member')"><div class="mticon">⭐</div><div class="mtname">會員</div><div class="mtsub">8折 / 9折</div></button>
        <button class="mtype-btn" onclick="setCT('guest')"><div class="mticon">👤</div><div class="mtname">非會員</div><div class="mtsub">原價</div></button>
        <button class="mtype-btn" onclick="setCT('special')"><div class="mticon">💎</div><div class="mtname">特殊客戶</div><div class="mtsub">特殊折扣</div></button>
      </div>
    </div>`;
  }
if(S.customerType==='member'&&!S.memberData){
return `<div class="card">
      <div class="card-title flex justify-between" style="display:flex;justify-content:space-between">
        <span>🔍 查詢會員</span>
        <button class="btn btn-ghost btn-xs" onclick="setCT(null)">← 返回</button>
      </div>
      <div class="frow mt-8">
        <div class="fg"><input class="fi" id="msInput" placeholder="手機號碼 或 會員編號" value="${S.memberSearch}" oninput="S.memberSearch=this.value" onkeydown="if(event.key==='Enter')searchMember()"></div>
        <button class="btn btn-primary" onclick="searchMember()">查詢</button>
      </div>
      <div id="msResult" class="mt-8"></div>
    </div>`;
  }
if(S.memberData){
const m=S.memberData;
const lvl={gold:'金卡 8折',silver:'銀卡 9折',special:`特殊 ${Math.round(m.discount*10)}折`}[m.level]||m.level;
return `<div class="member-info-card">
      <div class="flex justify-between items-center">
        <div>
          <div class="mi-name">${m.name} <span class="badge b-purple">${lvl}</span></div>
          <div class="mi-phone">📱 ${m.phone} &nbsp;·&nbsp; 編號：${m.id}</div>
        </div>
        <button class="btn btn-ghost btn-sm" onclick="resetCustomer()">更換顧客</button>
      </div>

function calculateTotals(items) {
const sub = items.reduce((s,i)=>s+(i.isAddon?0:i.price*i.qty),0);
const addT = items.reduce((s,i)=>s+(i.isAddon?i.price*i.qty: (i.addons||[]).reduce((a,b)=>a+b.price,0)),0);
const gross = sub + addT;
let disc = getDiscount() * S.overrideDiscount;
const discountable = items.reduce((s,i) => {
let ip = i.price * i.qty;
if (i.isAddon || i.mode === 'iron') ip = 0;
return s + ip;
  },0);
const nonDiscountable = gross - discountable;
const discounted = Math.round(discountable * disc);
const final = discounted + nonDiscountable;
const discSave = discountable - discounted;
return {sub, addT, gross, discountable, disc, final, discSave};
}

function modeLabel(m){return{walkin:'現場洗',store:'專業-店內',outsource:'專業-外包',wash:'純洗',dry:'純烘',iron:'純燙',addon:'加購'}[m]||m}

if(m==='switchType') return mWrap('切換訂單類型', `<div class="fg"><label class="fl" for="newType">新類型</label><select class="fi" id="newType">

      <option value="special" ${isSpecialSelected ? 'selected' : ''}>特殊折扣</option>
    </select></div>
    <div id="specialDiscountContainer">${specialDisc}</div>
    <div class="frow">
      <div class="fg"><label class="fl" for="mfPoints">點數</label><input type="number" class="fi" id="mfPoints" value="${d ? (d.points||0) : 0}"></div>
      <div class="fg"><label class="fl" for="mfBalance">儲值金</label><input type="number" class="fi" id="mfBalance" value="${d ? (d.balance||0) : 0}"></div>

// 切換特殊折扣欄位顯示
function toggleSpecialDiscount() {
  const levelSelect = document.getElementById('mfLevel');
  const container = document.getElementById('specialDiscountContainer');
 
  if (!levelSelect || !container) return;
 
  if (levelSelect.value === 'special') {
    // 顯示特殊折扣選單（使用預設值7.5折）
    container.innerHTML = `<div class="fg" id="specialDiscountField">
      <label class="fl" for="mfDiscount">特殊折扣</label>
      <select class="fi" id="mfDiscount">
        <option value="0.7">7折</option>
        <option value="0.75" selected>7.5折</option>
        <option value="0.8">8折</option>
        <option value="0.85">8.5折</option>
        <option value="0.9">9折</option>
        <option value="1">原價</option>
      </select>
    </div>`;
  } else {
    // 隱藏特殊折扣選單
    container.innerHTML = '';
  }
}

function getDiscount(){
if(S.memberData) return S.memberData.discount;
if(S.customerType==='special') return S.specialDiscount || 1;
if(S.customerType==='guest') return S.guestDiscount || 1;

function removeItem(idx){ S.cartItems.splice(idx,1); render() }
function chgQty(idx,d){ S.cartItems[idx].qty=Math.max(1,S.cartItems[idx].qty+d); render() }
function updateItemPrice(idx,v){ S.cartItems[idx].price = parseInt(v)||0; render() }
function clearCart(){ if(confirm('確定清除所有項目？')){ S.cartItems=[]; S.remark=''; render() } }
function checkout(){
if(S.cartItems.length===0) return;
const items=S.cartItems;
const groups = {walkin: [], store: [], outsource: []};
items.forEach(i => {
const t = typeFromMode(i.mode);
groups[t].push(i);
});
const createdOrders = [];
const customerName = S.memberData?.name || S.guestName || '非會員';
const phone = S.memberData?.phone || S.guestPhone || '';
const memberId = S.memberData?.id || null;
let disc = getDiscount() * S.overrideDiscount;
Object.keys(groups).forEach(type => {
const gitems = groups[type];
if (gitems.length === 0) return;
const {sub, addT, gross, discountable} = calculateTotals(gitems);
const nonDiscountable = gross - discountable;
const gfinal = Math.round(discountable * disc) + nonDiscountable;
const blanketCount = gitems.filter(i=>i.isBlanket).reduce((s,i)=>s+i.qty,0);
let orderNum;
if (type === 'walkin') orderNum = Store.getNextDailyNum();
else if (type === 'store') orderNum = Store.getNextS();
else if (type === 'outsource') orderNum = Store.getNextP();
const order = {
id: uid(),
orderNum,
type,
status: 'pending',
customerName,
phone,
memberId,
items: gitems.map(i=>({name:i.name,price:i.price,qty:i.qty,addons:i.addons||[]})),
total: gfinal,
origTotal: gross,
discount: disc,
date: todayStr(),
pickupDate: S.pickupDate,
zone: S.zone,
blanketCount,
remark: S.remark,
  };
if (type === 'outsource') {
order.outsendDate = S.outsendDate;
order.returnDate = S.returnDate;
  }
Store.addOrder(order);
createdOrders.push(order);
});
doPrintMultiple(createdOrders, customerName, phone);
S.cartItems=[]; S.remark='';
S.overrideDiscount=1;
render();
}
function doPrintMultiple(orders, customerName, phone) {
let printContent = '';
// 客戶存根聯
printContent += buildPrintSection('客戶存根聯', orders, true, customerName, phone);
// 店裡存根聯
orders.forEach(o => {
printContent += buildPrintSection(`店裡存根聯 - ${modeLabel(o.type)}`, [o], false, customerName, phone);
  });
// 外包存根聯
const outsourceOrder = orders.find(o => o.type === 'outsource');
if (outsourceOrder) {
printContent += buildPrintSection('外包存根聯', [outsourceOrder], false, customerName, phone);
  }
document.getElementById('printArea').innerHTML = printContent;
window.print();
}
function buildPrintSection(title, orders, isCustomer, customerName, phone) {
let itemRows = '';
let total = 0;
let origTotal = 0;
let discSave = 0;
let numSections = '';
let dates = '';
orders.forEach(o => {
o.items.forEach(i => {
const addStr = (i.addons||[]).length > 0 ? ` (加：${i.addons.map(a=>a.name).join('、')})` : '';
itemRows += `<div class="rrow"><span>${i.name}×${i.qty}${addStr}</span><span>$${i.price*i.qty}</span></div>`;
    });
total += o.total;
origTotal += o.origTotal;
discSave += o.origTotal - o.total;
if (isCustomer) {
numSections += `<div class="rrow"><span>${modeLabel(o.type)} 編號</span><span>${o.orderNum}</span></div>`;
dates += o.pickupDate ? `<div class="rrow"><span>${modeLabel(o.type)} 取件日</span><span>${o.pickupDate}</span></div>` : '';
    }
  });
const disc = orders[0]?.discount || 1;
const memberPts = S.memberData ? `<div class="rrow"><span>會員剩餘點數</span><span>${S.memberData.points}點</span></div>` : '';
const doneDateRow = orders.map(o => o.doneDate ? `<div class="rrow"><span>已洗好</span><span>${o.doneDate}</span></div>` : '').join('');
const returnedDateRow = orders.map(o => o.returnDate ? `<div class="rrow"><span>已送回</span><span>${o.returnDate}</span></div>` : '').join('');
const collectedDateRow = orders.map(o => o.collectedDate ? `<div class="rrow"><span>已取件</span><span>${o.collectedDate}</span></div>` : '').join('');
let numStr = orders.map(o => o.orderNum).join(' / ');
return `
    <div class="print-section">
      <div class="rshop">${Store.shopName}</div>
      <div class="rphone">${Store.shopPhone}</div>
      <hr class="rhr">
      <div class="rtitle">${title}</div>
      <hr class="rhr">
      <div class="rrow"><span>顧客</span><span>${customerName}</span></div>
${phone?`<div class="rrow"><span>手機</span><span>${phone}</span></div>`:''}
${memberPts}
      <hr class="rhr">
${itemRows}
      <hr class="rhr">
${origTotal!==total?`<div class="rrow"><span>折扣（${Math.round(disc*10)}折）</span><span style="color:#c00">-$${discSave}</span></div>`:''}
      <div class="rrow" style="font-weight:700;font-size:14px"><span>實收金額</span><span>$${total}</span></div>
      <hr class="rhr">
      <div class="rrow"><span>取件編號</span><span></span></div>
      <div class="rnum">${numStr}</div>
${numSections}
${dates}
${orders[0]?.zone?`<div class="rrow"><span>放置位置</span><span>${orders[0].zone}</span></div>`:''}
${doneDateRow}
${returnedDateRow}
${collectedDateRow}
${orders[0]?.remark?`<div class="rrow"><span>備註</span><span>${orders[0].remark}</span></div>`:''}
      <div class="rnote">${Store.shopNote}</div>
      <div class="rdate">日期：${todayStr()}</div>
    </div>`;
}
function reprintOrder(id){

}
function confirmUpdStat(id,s){
const date = document.getElementById('mdDate')?.value;
const time = document.getElementById('mdTime')?.value;
if(!date || !time) { alert('請選擇日期與時間'); return; }
let extra = {};
const dt = date + ' ' + time;
if(s==='done') extra.doneDate = dt;
if(s==='returned') extra.returnDate = dt;
if(s==='collected') extra.collectedDate = dt;
Store.updateOrderStatus(id,s,extra);
closeModal();
render();
}
function confirmSwitchType(id) {
const newType = document.getElementById('newType')?.value;
if(!newType) return;
let o = Store.orders.find(x=>x.id===id);
if(o && newType !== o.type) {
if(newType==='store') o.orderNum = Store.getNextS();
else if(newType==='outsource') o.orderNum = Store.getNextP();
else if(newType==='walkin') o.orderNum = Store.getNextDailyNum();
o.type = newType;
  }
closeModal();
render();
}
// Member CRUD
function saveMember(existId){
  const name=document.getElementById('mfName')?.value?.trim();
  const phone=document.getElementById('mfPhone')?.value?.trim();
  const level=document.getElementById('mfLevel')?.value;
  const points=parseInt(document.getElementById('mfPoints')?.value)||0;
  const balance=parseInt(document.getElementById('mfBalance')?.value)||0;
 
  // 根據等級設定折扣
  let discount;
  if (level === 'gold') {
    discount = 0.8; // 金卡8折
  } else if (level === 'silver') {
    discount = 0.9; // 銀卡9折
  } else {
    // 特殊折扣 - 從選單獲取值
    const discSelect = document.getElementById('mfDiscount');
    discount = discSelect ? parseFloat(discSelect.value) : 0.75;
  }
 
  if(!name || !phone){ alert('請填寫姓名與手機'); return; }
 
  if(existId){
    const m=Store.members.find(x=>x.id===existId);
    if(m){
      m.name=name;
      m.phone=phone;
      m.level=level;
      m.points=points;
      m.balance=balance;
      m.discount=discount;
    }
  } else {
    const id='M'+String(Store.members.length+1).padStart(3,'0');
    Store.members.push({id,name,phone,level,points,discount,balance});
  }
 
  closeModal();
  render();
}
function delMember(id){ if(confirm('確定刪除此會員？')){ Store.members=Store.members.filter(m=>m.id!==id); render() } }
// Product CRUD
function saveProduct(existId){
const name=document.getElementById('pfName')?.value?.trim();
const cat=document.getElementById('pfCat')?.value;
const unit=document.getElementById('pfUnit')?.value||'件';
const price=parseInt(document.getElementById('pfPrice')?.value)||0;
const isBlanket=document.getElementById('pfBlanket')?.value==='true';
if(!name){ alert('請填寫名稱'); return }
if(existId){
const p=Store.products.find(x=>x.id===existId);
if(p){ p.name=name;p.category=cat;p.unit=unit;p.price=price;p.isBlanket=isBlanket }
  } else {
Store.products.push({id:'PRD'+Date.now(),name,category:cat,unit,price,isBlanket});
  }
closeModal();
render();
}
function delProduct(id){ if(confirm('確定刪除此商品？')){ Store.products=Store.products.filter(p=>p.id!==id); render() } }
// Addon CRUD
function saveAddon(existId){
const name=document.getElementById('afName')?.value?.trim();
const price=parseInt(document.getElementById('afPrice')?.value)||0;
if(!name){ alert('請填寫名稱'); return }
if(existId){
const a=Store.addons.find(x=>x.id===existId);
if(a){ a.name=name;a.price=price }
  } else {
Store.addons.push({id:'ADD'+Date.now(),name,price});
  }
closeModal();
render();
}
function delAddon(id){ if(confirm('確定刪除此加購項目？')){ Store.addons=Store.addons.filter(a=>a.id!==id); render() } }
// Zone CRUD
function addZone(){ const v=document.getElementById('nzInput')?.value?.trim(); if(v&&!Store.zones.includes(v)){ Store.zones.push(v); render() } }
function delZone(i){ Store.zones.splice(i,1); render() }
function dragStart(ev,i){ ev.dataTransfer.setData('text/plain',i); }
function dragOver(ev){ ev.preventDefault(); }
function drop(ev,targetI){
const sourceI = ev.dataTransfer.getData('text/plain');
if(sourceI === '') return;
const temp = Store.zones[sourceI];
Store.zones.splice(sourceI,1);
Store.zones.splice(targetI,0,temp);
render();
}
// Shop settings
function saveShop(){
Store.shopName=document.getElementById('ssName')?.value||Store.shopName;
Store.shopPhone=document.getElementById('ssPhone')?.value||Store.shopPhone;
Store.shopNote=document.getElementById('ssNote')?.value||Store.shopNote;
alert('設定已儲存！'); render();
}
function updateZone(id,v){ const o=Store.orders.find(x=>x.id===id); if(o) o.zone=v; }
function delOrder(id){ if(confirm('確定刪除此訂單？')){ Store.orders=Store.orders.filter(x=>x.id!==id); render() } }
// Keyboard shortcut
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&S.modal) closeModal() });
// Start
render();
</script>
