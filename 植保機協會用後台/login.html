<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>後台登入</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
  <style>
    .bg-aviation {
      background: linear-gradient(135deg, #134e4a 0%, #064e3b 100%);
      background-image: url('https://via.placeholder.com/1920x1080'),
                      linear-gradient(135deg, #134e4a 0%, #064e3b 100%);
      background-blend-mode: overlay;
      background-size: cover;
    }
  </style>
</head>
<body class="bg-aviation min-h-screen flex items-center justify-center">
  <div class="bg-white p-8 rounded-xl shadow-lg max-w-md w-full">
    <h2 class="text-3xl font-bold text-center mb-6">蓋亞雲藥通組織登入</h2>
    <form>
      <div class="mb-4">
        <label class="block text-gray-700 mb-2" for="username">帳號</label>
        <input id="username" type="text" placeholder="請輸入帳號" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-green-500 focus:border-green-500">
      </div>
      <div class="mb-6">
        <label class="block text-gray-700 mb-2" for="password">密碼</label>
        <input id="password" type="password" placeholder="請輸入密碼" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-green-500 focus:border-green-500">
      </div>
      <button type="submit" class="w-full bg-green-600 text-white py-2 rounded-lg hover:bg-green-700 transition duration-150">登入</button>
    </form>
  </div>
</body>
</html>
