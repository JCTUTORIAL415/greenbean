<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>個人版 - 小亨堡QA</title>
    <meta name="description" content="個人版面：寶寶日常、轉發、我的小物（二手）。">

    <meta name="application-name" content="小亨堡QA">
    <meta name="apple-mobile-web-app-title" content="小亨堡QA">
    <meta name="theme-color" content="#5BBFAD">

    <link rel="icon" href="favicon.ico?v=3">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=3">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=3">
    <link rel="manifest" href="manifest.json?v=3">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <meta property="og:site_name" content="小亨堡QA">
    <meta property="og:title" content="個人版 - 小亨堡QA">
    <meta property="og:description" content="寶寶日常 / 轉發 / 我的小物。">
    <meta property="og:type" content="profile">
    <meta property="og:locale" content="zh_TW">
    <meta property="og:image" content="img/icon-512.png?v=3">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/platform.css">
</head>
<body>

<div class="page">
    <header class="top-header">
        <button class="th-back" onclick="goBackOrFeed()" aria-label="返回"><i class="fas fa-chevron-left"></i></button>
        <div class="th-logo">
            <span class="name" id="profileTitle">@me</span>
        </div>
        <div class="th-actions">
            <a href="messages.html" class="th-icon" aria-label="訊息"><i class="far fa-paper-plane"></i></a>
            <button class="th-icon" onclick="toast('設定即將推出')" aria-label="設定"><i class="fas fa-bars"></i></button>
        </div>
    </header>

    <main class="main-scroll">
        <section class="profile-info" id="profileInfo">
            <div class="empty-state"><div class="ic">⏳</div><p>載入中⋯</p></div>
        </section>

        <div class="profile-tabs" id="profileTabs">
            <div class="ptab active" data-tab="posts">📷 <span>寶寶日常</span></div>
            <div class="ptab" data-tab="reposts">🔁 <span>轉發</span></div>
            <div class="ptab" data-tab="products">🛍 <span>我的小物</span></div>
        </div>

        <div id="tabContent"></div>
    </main>

    <div id="navHolder"></div>
</div>

<div class="toast" id="toast"></div>

<script src="js/platform.js" defer></script>
<script src="js/profile.js" defer></script>
</body>
</html>
