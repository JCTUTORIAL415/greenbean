<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>小亨堡QA</title>
    <meta name="description" content="寶寶照護 QA 諮詢，幫媽咪初步判斷狀況。">

    <!-- Branding -->
    <meta name="application-name" content="小亨堡QA">
    <meta name="apple-mobile-web-app-title" content="小亨堡QA">
    <meta name="theme-color" content="#5BBFAD">

    <!-- Favicons / Touch icons（root + img 雙保險，加 ?v 破快取） -->
    <link rel="icon" href="favicon.ico?v=3">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=3">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png?v=3">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=3">
    <link rel="apple-touch-icon-precomposed" sizes="180x180" href="apple-touch-icon-precomposed.png?v=3">
    <link rel="shortcut icon" href="favicon.ico?v=3">
    <link rel="mask-icon" href="apple-touch-icon.png?v=3" color="#5BBFAD">

    <!-- PWA -->
    <link rel="manifest" href="manifest.json?v=3">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="mobile-web-app-capable" content="yes">

    <!-- Open Graph / Twitter -->
    <meta property="og:site_name" content="小亨堡QA">
    <meta property="og:title" content="小亨堡QA">
    <meta property="og:description" content="寶寶照護 QA 諮詢，幫媽咪初步判斷狀況。">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="zh_TW">
    <meta property="og:image" content="img/icon-512.png?v=3">
    <meta property="og:image:width" content="512">
    <meta property="og:image:height" content="512">
    <meta property="og:image:alt" content="小亨堡QA">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="小亨堡QA">
    <meta name="twitter:description" content="寶寶照護 QA 諮詢，幫媽咪初步判斷狀況。">
    <meta name="twitter:image" content="img/icon-512.png?v=3">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>

<div class="screen active" id="chatScreen">
    <header class="app-header">
        <div class="brand">
            <div class="brand-avatar"><img src="img/xiaohengbao.png" alt="小亨堡"></div>
            <div class="brand-text">
                <h1>小亨堡 · 寶寶 QA</h1>
                <p><span class="online-dot"></span>線上中 · 秒回你 💬</p>
            </div>
        </div>
        <div class="header-actions">
            <button class="hbtn sos" onclick="showSOS()" aria-label="緊急電話">
                <i class="fas fa-phone-volume"></i><span>SOS</span>
            </button>
            <button class="hbtn" onclick="resetChat()" aria-label="重新開始">
                <i class="fas fa-arrows-rotate"></i><span>重來</span>
            </button>
        </div>
    </header>

    <div class="chat-container" id="chatContainer"></div>

    <div class="input-bar">
        <input type="text" id="userInput" placeholder="描述寶寶狀況...（例如：發燒 38.5、吐奶、紅疹）" autocomplete="off">
        <button class="send-btn" id="sendBtn" aria-label="送出"><i class="fas fa-paper-plane"></i></button>
    </div>
</div>

<!-- SOS Overlay：緊急電話 / 兒童急診 -->
<div class="sos-overlay" id="sosOverlay">
    <div class="sos-sheet">
        <div class="modal-handle"><span></span></div>
        <div class="sos-header">
            <h3><i class="fas fa-triangle-exclamation"></i> 緊急狀況？</h3>
            <button class="close-btn" onclick="closeSOS()" aria-label="關閉"><i class="fas fa-times"></i></button>
        </div>
        <div class="sos-content" id="sosContent"></div>
    </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"><span id="toastMsg"></span></div>

<script src="js/app.js" defer></script>
</body>
</html>
