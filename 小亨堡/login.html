<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>登入 / 註冊 - 小亨堡QA</title>
    <meta name="description" content="登入小亨堡QA，使用更多媽咪專屬功能。">

    <meta name="application-name" content="小亨堡QA">
    <meta name="apple-mobile-web-app-title" content="小亨堡QA">
    <meta name="theme-color" content="#5BBFAD">

    <link rel="icon" href="favicon.ico?v=3">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=3">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png?v=3">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=3">
    <link rel="apple-touch-icon-precomposed" sizes="180x180" href="apple-touch-icon-precomposed.png?v=3">
    <link rel="shortcut icon" href="favicon.ico?v=3">

    <link rel="manifest" href="manifest.json?v=3">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="mobile-web-app-capable" content="yes">

    <meta property="og:site_name" content="小亨堡QA">
    <meta property="og:title" content="小亨堡QA">
    <meta property="og:description" content="寶寶照護 QA 諮詢，幫媽咪初步判斷狀況。">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="zh_TW">
    <meta property="og:image" content="img/icon-512.png?v=3">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/auth.css">
    <style>
        .brand-logo.with-img { background: linear-gradient(135deg, #E8F8F5, #EBF5FB); padding: 0; overflow: hidden; }
        .brand-logo.with-img img { width: 100%; height: 100%; object-fit: cover; object-position: center top; border-radius: inherit; }
    </style>
</head>
<body>

<div class="auth-wrap">
    <div class="brand">
        <div class="brand-logo with-img"><img src="img/xiaohengbao.png" alt="小亨堡"></div>
        <h1>小亨堡QA</h1>
        <p>媽咪的寶寶照護小幫手 🍼</p>
    </div>

    <div class="auth-card">
        <div class="tabs" id="tabs">
            <button class="tab active" data-panel="login">登入</button>
            <button class="tab" data-panel="register">註冊</button>
            <div class="tab-slider"></div>
        </div>

        <!-- 登入 -->
        <form class="form-panel active" id="loginPanel" novalidate>
            <div class="field">
                <label for="loginEmail">Email</label>
                <div class="input-wrap">
                    <input type="email" id="loginEmail" placeholder="your@email.com" autocomplete="email" required>
                    <i class="fas fa-envelope ic"></i>
                </div>
            </div>
            <div class="field">
                <label for="loginPwd">密碼</label>
                <div class="input-wrap">
                    <input type="password" id="loginPwd" placeholder="輸入您的密碼" autocomplete="current-password" required>
                    <i class="fas fa-lock ic"></i>
                    <button type="button" class="toggle-pwd" data-target="loginPwd" aria-label="顯示密碼">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>
            <div class="row">
                <label class="remember">
                    <input type="checkbox" id="rememberMe" checked>
                    <span>記住我</span>
                </label>
                <a href="#" class="forgot" onclick="forgotPwd(event)">忘記密碼？</a>
            </div>
            <button type="submit" class="submit-btn">
                <i class="fas fa-right-to-bracket"></i> 登入
            </button>
        </form>

        <!-- 註冊 -->
        <form class="form-panel" id="registerPanel" novalidate>
            <div class="field">
                <label for="regName">媽咪暱稱</label>
                <div class="input-wrap">
                    <input type="text" id="regName" placeholder="例如：小雅媽咪" autocomplete="name" required>
                    <i class="fas fa-user ic"></i>
                </div>
            </div>
            <div class="field">
                <label for="regEmail">Email</label>
                <div class="input-wrap">
                    <input type="email" id="regEmail" placeholder="your@email.com" autocomplete="email" required>
                    <i class="fas fa-envelope ic"></i>
                </div>
                <div class="hint" id="regEmailHint" style="display:none;"></div>
            </div>
            <div class="field">
                <label for="regPwd">密碼</label>
                <div class="input-wrap">
                    <input type="password" id="regPwd" placeholder="至少 8 碼，含英文與數字" autocomplete="new-password" required>
                    <i class="fas fa-lock ic"></i>
                    <button type="button" class="toggle-pwd" data-target="regPwd" aria-label="顯示密碼">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
                <div class="pwd-strength" id="pwdStrength">
                    <div class="pwd-bar"><span></span><span></span><span></span></div>
                    <div class="pwd-label" id="pwdLabel">密碼強度</div>
                </div>
            </div>
            <div class="field">
                <label for="regPwd2">再次輸入密碼</label>
                <div class="input-wrap">
                    <input type="password" id="regPwd2" placeholder="請再次輸入密碼" autocomplete="new-password" required>
                    <i class="fas fa-lock ic"></i>
                    <button type="button" class="toggle-pwd" data-target="regPwd2" aria-label="顯示密碼">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
                <div class="hint" id="regPwd2Hint" style="display:none;"></div>
            </div>
            <div class="row">
                <label class="remember">
                    <input type="checkbox" id="regRemember" checked>
                    <span>註冊後記住我</span>
                </label>
            </div>
            <button type="submit" class="submit-btn">
                <i class="fas fa-user-plus"></i> 建立帳號
            </button>
        </form>
    </div>

    <div class="skip-link">
        先不登入？<a href="index.html">直接進入首頁 →</a>
    </div>

    <div class="footer-note">
        繼續即代表同意 <a href="terms.html">服務條款</a> 與 <a href="privacy.html">隱私權政策</a><br>
        © 2026 小亨堡QA
    </div>
</div>

<div class="toast" id="toast"><i class="fas fa-check-circle"></i><span id="toastMsg"></span></div>

<script src="js/auth.js" defer></script>

</body>
</html>
