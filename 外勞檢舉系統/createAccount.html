<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>爆勞情報網系統後台管理</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link rel="stylesheet" href="createAccount.css">
</head>
<body>
    <div class="dashboard">
        <div class="sidebar">
            <div class="logo">
                <span class="material-symbols-rounded">admin_panel_settings</span>
                <h2>管理後台</h2>
            </div>
            <nav>
                <a href="backManage.html" class="nav-item active">
                    <span class="material-symbols-rounded">dashboard</span>
                    儀表板
                </a>
                <a href="createAccount.html" class="nav-item active">
                    <span class="material-symbols-rounded">person</span> <!-- 用戶圖示 -->
                    開通帳號
                </a>                
            </nav>
        </div>
        <div class="main-content">
            <h1 class="page-title">開通新帳號</h1>
            <form class="account-form">
                <div class="form-group">
                    <label for="username">使用者名稱</label>
                    <input type="text" id="username" name="username" required>
                </div>

                <div class="form-group">
                    <label for="password">密碼</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <div class="form-group">
                    <label for="role">角色權限</label>
                    <select id="role" name="role" required>
                        <option value="">請選擇角色</option>
                        <option value="admin">系統管理員</option>
                        <option value="user">消費者</option>
                    </select>
                </div>

                <button type="submit" class="submit-btn">建立帳號</button>
            </form>
        </div>
    </div> 
</body>
</html>
