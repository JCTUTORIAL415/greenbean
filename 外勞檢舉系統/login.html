<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>檢舉系統後台 - 登入</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background: #f5f7fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 2rem;
        }

        .login-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            padding: 2rem;
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .material-symbols-rounded {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 40;
            font-size: 2.5rem;
            background: linear-gradient(45deg, #4776E6, #8E54E9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .login-title {
            color: #333;
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .login-subtitle {
            color: #666;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #333;
            font-weight: 500;
        }

        .input-with-icon {
            position: relative;
        }

        .input-with-icon input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.5rem;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .input-with-icon input:focus {
            outline: none;
            border-color: #4776E6;
        }

        .input-icon {
            position: absolute;
            left: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            color: #666;
            font-size: 1.2rem !important;
        }

        .login-btn {
            width: 100%;
            padding: 0.75rem;
            background: linear-gradient(45deg, #4776E6, #8E54E9);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        .login-btn:hover {
            opacity: 0.9;
        }

        .login-footer {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.9rem;
            color: #666;
        }

        .login-footer a {
            color: #4776E6;
            text-decoration: none;
        }

        .error-message {
            color: #dc3545;
            font-size: 0.875rem;
            margin-top: 0.25rem;
            display: none;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .remember-me input[type="checkbox"] {
            width: 16px;
            height: 16px;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 1rem;
            }

            .login-card {
                padding: 1.5rem;
            }
        }

       
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">
                    <span class="material-symbols-rounded">admin_panel_settings</span>
                </div>
                <h1 class="login-title">檢舉系統後台</h1>
                <p class="login-subtitle">請登入以繼續</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username">帳號</label>
                    <div class="input-with-icon">
                        <span class="material-symbols-rounded input-icon">person</span>
                        <input type="text" id="username" name="username" required>
                    </div>
                    <div class="error-message" id="usernameError"></div>
                </div>

                <div class="form-group">
                    <label for="password">密碼</label>
                    <div class="input-with-icon">
                        <span class="material-symbols-rounded input-icon">lock</span>
                        <input type="password" id="password" name="password" required>
                    </div>
                    <div class="error-message" id="passwordError"></div>
                </div>

                <div class="remember-me">
                    <input type="checkbox" id="remember" name="remember">
                    <label for="remember">記住我</label>
                </div>

                <button type="submit" class="login-btn">登入</button>
            </form>

            <div class="login-footer">
                <a href="#">忘記密碼？</a>
            </div>
        </div>
    </div>


    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const usernameField = document.getElementById('username');
            const passwordField = document.getElementById('password');
            const rememberCheckbox = document.getElementById('remember');
    
            // 從 LocalStorage 加載數據
            if (localStorage.getItem('remember') === 'true') {
                usernameField.value = localStorage.getItem('username') || '';
                passwordField.value = localStorage.getItem('password') || '';
                rememberCheckbox.checked = true;
            }
    
            // 處理表單提交
            document.getElementById('loginForm').addEventListener('submit', (e) => {
                e.preventDefault();
    
                const username = usernameField.value;
                const password = passwordField.value;
                const remember = rememberCheckbox.checked;
    
                // 記住密碼
                if (remember) {
                    localStorage.setItem('username', username);
                    localStorage.setItem('password', password);
                    localStorage.setItem('remember', 'true');
                } else {
                    localStorage.removeItem('username');
                    localStorage.removeItem('password');
                    localStorage.setItem('remember', 'false');
                }
    
                // 這裡執行登入邏輯，例如調用後端 API
                console.log('表單提交', { username, password });
                alert('登入成功！');
            });
        });
    </script>
    
</body>
</html>
