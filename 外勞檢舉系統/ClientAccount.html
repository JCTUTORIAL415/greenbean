<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>爆勞情報網系統後台管理</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link rel="stylesheet" href="backManagement.css">
</head>
<body>
    <div class="dashboard">
        <div class="sidebar">
            <div class="logo">
                <span class="material-symbols-rounded">admin_panel_settings</span>
                <h2>管理後台</h2>
            </div>
            <nav>
                <a href="backManage.html" class="nav-item active">
                    <span class="material-symbols-rounded">dashboard</span>
                    儀表板
                </a>            
            </nav>
        </div>

        <div class="main-content">
            <div class="header">
                <h1>檢舉案件總覽</h1>
                <!-- 地區篩選器 -->
                <select id="regionSelector" onchange="filterByRegion()">
                    <option value="">選擇縣市</option>
                    <option value="台北">台北市</option>
                    <option value="基隆">基隆市</option>
                    <option value="新北">新北市</option>
                    <option value="桃園">桃園市</option>
                    <option value="台中">台中市</option>
                    <option value="台南">台南市</option>
                    <option value="高雄">高雄市</option>
                    <option value="新竹">新竹市</option>
                    <option value="嘉義">嘉義市</option>
                    <option value="台東">台東縣</option>
                    <option value="花蓮">花蓮縣</option>
                    <option value="宜蘭">宜蘭縣</option>
                    <option value="屏東">屏東縣</option>
                    <option value="南投">南投縣</option>
                    <option value="彰化">彰化縣</option>
                    <option value="雲林">雲林縣</option>
                    <option value="澎湖">澎湖縣</option>
                    <option value="金門">金門縣</option>
                    <option value="連江">連江縣</option>
                </select>
            </div>

            <form action="#" method="POST">
                <div class="table-container">
                    <table id="casesTable">
                        <thead>
                            <tr>
                                <th>案件編號</th>
                                <th>接獲時間</th>
                                <th>地點</th>
                                <th>人數</th>
                                <th>描述</th>
                                <th>照片</th>
                                <th>狀態</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>2025Aa</td>
                                <td>115/10/03</td>
                                <td>雲林縣</td>
                                <td>3</td>
                                <td>檢舉</td>
                                <td>檔案</td>
                                <td><span class="status status-new">待轉交</span></td>
                            </tr>
                        </tbody>
                    </table>
                   
                    
                </div>

                <div id="submit-button-container" style="display:none; text-align:right;">
                    <button type="button" class="btn btn-primary" onclick="showInputModal()">送出</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal -->
    <div class="input-modal" id="inputModal">
        <div class="input-modal-content">
            <span class="close" onclick="closeInputModal()">×</span>
            <h2>輸入帳號ID</h2>
            <input type="text" id="accountId" placeholder="請輸入帳號ID">
            <button id="formSubmit" onclick="submitAccountId()">提交</button>
        </div>
    </div>

    <script src="backManage.js"></script>

</body>
</html>
