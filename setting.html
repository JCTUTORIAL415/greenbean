<!DOCTYPE html>
<html lang="zh-TW">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>查看過去所有紀錄</title>
		<!-- <link rel="stylesheet" href="index.css">
		<link rel="stylesheet" href="index2.css"> -->
		<link rel="stylesheet" href="https://chrisplugin.pages.dev/css/chrisplugin.css">
		<script src="https://chrisplugin.pages.dev/js/chrisplugin.js"></script>
		<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
        <style>
            body {
                background-color: #004D8F;
                color: white;
                font-family: Arial, sans-serif;
                display: flex;
                justify-content: center;
                height: 100vh;
                margin: 0;
                width: 100%;
            }
        
            .setting-contain {
                text-align: center;
                width: 80%;
                margin-top: 100px;
                z-index: 0;
            }
        
            .setting-before h2 {
                height: 30px;
                width: 100%;
                background-color: white;
                border-radius: 10px;
                padding: 10px;
                color: black;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 10px;
            }
        
            .record {
                text-align: left;
                margin: 10px 0px;
            }
        
            .record-section {
                margin-top: 20px;
            }
        
            .navigationbar {
                background-color: rgba(255, 255, 255, 0.1);
                padding: 10px;
                margin-bottom: 20px;
                display: flex;
                justify-content: center;
                flex-wrap: wrap;
                height: initial;
                position: fixed;
                top: 0;
                width: 100%;
            }
        
            .button {
                background-color: #ffffff;
                color: rgb(0, 0, 0);
                border: none;
                border-radius: 5px;
                padding: 10px 20px;
                font-size: 12px;
                cursor: pointer;
                transition: background-color 0.3s ease;
                width: 95%;
                height: 37px;
                font-weight: 800;
            }
        
            /* 針對「過去飛行紀錄」按鈕的調整 */
            .setting-before .button {
                width: 100%; /* 保持填滿父容器 */
                height: 60px; /* 進一步增加高度 */
                font-size: 20px; /* 進一步增大字體 */
                padding: 20px 25px; /* 增加內邊距，讓按鈕更大 */
            }
        </style>
    </head>

    <body>
        <div class="navigationbar flexcenter">
            <input type="button" class="button light secondary" id="back" value="返回">

        </div>
        <div class="setting-contain">
            <div class="setting-before">
                <input type="button" class="button light secondary" onclick="href('record.html')" value="查看過去飛行紀錄🕒">
            </div>
        </div>

		<script src="initialize.js"></script>
        <script src="setting.js"></script>
    </body>
</html>
