<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>訂單查詢與簽收 - 拳拳超市 西屯店</title>
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>
<div class="kiosk-shell">
  <header class="kiosk-header">
    <span class="kiosk-store-name" id="store-name">拳拳超市 西屯店</span>
    <span class="kiosk-title">🛍️ 訂單查詢與簽收</span>
  </header>
  <main class="kiosk-main">

    <section class="screen active" data-screen="search">
      <div class="kiosk-card">
        <h1 class="kiosk-h1">請輸入手機末 4 碼</h1>
        <div class="flash flash-error kiosk-error" id="search-msg" hidden></div>
        <form id="lookup-form" class="kiosk-form">
          <div>
            <input type="tel" id="phone4" class="kiosk-input" readonly
                   inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="off"
                   placeholder="請用下方按鍵輸入" style="font-size:2rem;">
            <div class="kiosk-keypad" data-keypad-target="#phone4" data-keypad-maxlen="4">
              <button type="button" class="kiosk-key">1</button>
              <button type="button" class="kiosk-key">2</button>
              <button type="button" class="kiosk-key">3</button>
              <button type="button" class="kiosk-key">4</button>
              <button type="button" class="kiosk-key">5</button>
              <button type="button" class="kiosk-key">6</button>
              <button type="button" class="kiosk-key">7</button>
              <button type="button" class="kiosk-key">8</button>
              <button type="button" class="kiosk-key">9</button>
              <button type="button" class="kiosk-key kiosk-key-wide" data-keypad-clear>清除</button>
              <button type="button" class="kiosk-key">0</button>
              <button type="button" class="kiosk-key kiosk-key-wide" data-keypad-back>⌫ 倒退</button>
            </div>
          </div>
          <button type="submit" class="btn btn-primary kiosk-btn-lg">查詢我的訂單</button>
        </form>
      </div>
    </section>

    <section class="screen" data-screen="select">
      <div class="kiosk-card">
        <h1 class="kiosk-h1" id="select-heading"></h1>
        <p class="hint" style="text-align:center; margin-bottom:1rem;">請點選「您本人」的姓名，才會顯示您的項目</p>
        <div class="kiosk-order-list" id="select-list"></div>
        <button type="button" class="btn btn-ghost kiosk-btn-block" id="select-back">重新查詢</button>
      </div>
    </section>

    <section class="screen" data-screen="confirm">
      <div class="kiosk-card">
        <h1 class="kiosk-h1" id="confirm-heading"></h1>
        <div id="already-signed-box" hidden></div>
        <p class="hint" id="confirm-hint" style="text-align:center; margin-bottom:1rem;">請確認勾選的是您的訂單，不是您的請取消勾選</p>
        <form id="confirm-form">
          <div class="kiosk-order-list" id="order-list"></div>
          <div class="kiosk-order-amount" id="confirm-total" style="text-align:right;margin-bottom:1rem;"></div>
          <button type="submit" class="btn btn-primary kiosk-btn-lg">簽名領取已勾選的訂單</button>
        </form>
        <button type="button" class="btn btn-ghost kiosk-btn-block" id="confirm-back">重新查詢</button>
      </div>
    </section>

    <section class="screen" data-screen="sign">
      <div class="kiosk-card">
        <h1 class="kiosk-h1" id="sign-heading"></h1>
        <div class="kiosk-signature-wrap">
          <canvas id="signature-pad" class="kiosk-signature-pad" width="600" height="300"></canvas>
        </div>
        <div class="kiosk-sign-actions">
          <button type="button" id="sig-clear" class="btn btn-ghost">清除重簽</button>
        </div>
        <form id="sign-form">
          <button type="submit" class="btn btn-primary kiosk-btn-lg">確認簽名並完成領取</button>
        </form>
        <p class="hint" style="text-align:center; margin-top:0.75rem;">簽名送出後即完成領取，無法復原。</p>
        <button type="button" class="btn btn-ghost kiosk-btn-block" id="sign-back">上一步</button>
      </div>
    </section>

    <section class="screen" data-screen="done">
      <div class="kiosk-card kiosk-done">
        <div class="kiosk-done-icon">✅</div>
        <h1 class="kiosk-h1">領取完成</h1>
        <p class="kiosk-done-msg">已完成 <span id="done-count"></span> 筆訂單的領取確認，謝謝！</p>
        <button type="button" class="btn btn-primary kiosk-btn-lg" id="done-home">回首頁</button>
      </div>
    </section>

    <section class="screen" data-screen="admin">
      <div class="kiosk-card">
        <h1 class="kiosk-h1">店員後台</h1>
        <p class="hint" id="admin-summary" style="text-align:center;margin-bottom:1rem;"></p>
        <div class="table-wrap">
          <table class="table">
            <thead><tr><th>姓名</th><th>電話末4碼</th><th class="num">金額</th><th>狀態</th></tr></thead>
            <tbody id="admin-tbody"></tbody>
          </table>
        </div>
        <br>
        <button type="button" class="btn btn-primary kiosk-btn-block" id="export-csv">匯出 CSV（簽收狀態）</button>
        <button type="button" class="btn btn-ghost kiosk-btn-block" id="export-json">匯出 JSON 備份（含簽名）</button>
        <button type="button" class="btn btn-ghost kiosk-btn-block" id="admin-back">返回</button>
      </div>
    </section>

  </main>
  <div class="kiosk-footer-link"><a href="#" id="admin-link">店員後台</a></div>
</div>

<script>window.STORE_ADMIN_PIN = "1234";</script>
<script src="../assets/kiosk-keypad.js"></script>
<script src="../assets/signature-pad.js"></script>
<script src="../assets/app.js"></script>
</body>
</html>
