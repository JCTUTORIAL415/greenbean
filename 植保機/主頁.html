<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>主頁</title>
		<link rel="stylesheet" href="index.css">
		<link rel="stylesheet" href="index2.css">
		<link rel="stylesheet" href="https://ho0527.github.io/chrisplugin/css/chrisplugin.css">
        <script src="https://ho0527.github.io/chrisplugin/js/chrisplugin.js"></script>
	</head>
	<body>
		<div class="navbar">
			<div class="navbar-content">
				<img src="../material/icon/logo.png" class="logo">
				<div class="title">藥物回傳軟體</div>
			</div>
		</div>

		<div class="main-content">
			<div class="button-grid">
				<button class="grid-button" id="event">
					<img src="../material/icon/pesticide.png">
					<span>藥物回傳</span>
				</button>
				<button class="grid-button" id="customer">
					<img src="../material/icon/client.png">
					<span>客戶管理</span>
				</button>
				<button class="grid-button" id="profile">
					<img src="../material/icon/personal.png">
					<span>個人檔案</span>
				</button>
				<button class="grid-button" id="airspace">
					<img src="../material/icon/air.png">
					<span>空域查詢</span>
				</button>
				<button class="grid-button" id="setting">
					<img src="../material/icon/set.png">
					<span>設定/檢視上傳</span>
				</button>
				<button class="grid-button" id="signout">
					<img src="../material/icon/out.png">
					<span>登出</span>
				</button>
			</div>
		</div>

        <script src="initialize.js"></script>
        <script src="main.js"></script>
	</body>
</html>
