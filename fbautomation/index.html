<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智富系統 - 主控台</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --gold: #C9A84C;
            --gold-light: #F0C040;
            --gold-bright: #FFD700;
            --gold-dark: #8B6914;
            --gold-pale: #FFF8DC;
            --black: #0A0A0A;
            --black-border: #1E1E1E;
            --white: #FFFFFF;
            --gray: #888888;
            /* Bill gold tones */
            --bill-bg:     #1a1200;
            --bill-deep:   #100d00;
            --bill-mid:    #2d2200;
            --bill-border: #8B6914;
            --bill-line:   rgba(201,168,76,0.45);
            --bill-text:   #FFF8DC;
            --bill-muted:  rgba(201,168,76,0.6);
            --bill-dim:    rgba(139,105,20,0.7);
        }

        body {
            font-family: 'Microsoft JhengHei', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--black);
            color: var(--white);
            overflow-x: hidden;
            min-height: 100vh;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--black); }
        ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 3px; }

        /* ===== NAVBAR ===== */
        .navbar {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 1000;
            padding: 14px 5%;
            background: rgba(10,10,10,0.95);
            border-bottom: 1px solid var(--gold-dark);
            backdrop-filter: blur(20px);
            animation: slideDown 0.5s ease-out;
        }

        @keyframes slideDown {
            from { transform: translateY(-100%); opacity: 0; }
            to   { transform: translateY(0);    opacity: 1; }
        }

        .nav-inner {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex; align-items: center; gap: 12px; text-decoration: none;
        }

        .logo-icon {
            width: 44px; height: 44px;
            background: linear-gradient(135deg, var(--gold-dark), var(--gold-bright));
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.3rem; font-weight: 900; color: var(--black);
            box-shadow: 0 0 18px rgba(201,168,76,0.45);
        }

        .logo-texts { display: flex; flex-direction: column; }

        .logo-name {
            font-size: 1.6rem; font-weight: 900;
            background: linear-gradient(135deg, var(--gold), var(--gold-bright));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            letter-spacing: 2px; line-height: 1;
        }

        .logo-sub { font-size: 0.6rem; color: var(--gold); letter-spacing: 3px; margin-top: 3px; opacity: 0.75; }

        .nav-dot {
            display: flex; align-items: center; gap: 7px;
            font-size: 0.82rem; color: #4CAF50;
        }

        .nav-dot::before {
            content: ''; width: 7px; height: 7px;
            background: #4CAF50; border-radius: 50%;
            animation: blink 1.5s infinite;
        }

        @keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0.25; } }

        /* ===== PAGE ===== */
        .page {
            min-height: 100vh;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 110px 5% 70px;
            position: relative; overflow: hidden;
        }

        .bg-glow {
            position: absolute; inset: 0;
            background:
                radial-gradient(ellipse at 50% 38%, rgba(201,168,76,0.08) 0%, transparent 62%),
                radial-gradient(ellipse at 15% 75%, rgba(255,215,0,0.04) 0%, transparent 50%),
                radial-gradient(ellipse at 85% 15%, rgba(201,168,76,0.05) 0%, transparent 50%);
        }

        .bg-grid {
            position: absolute; inset: 0;
            background-image:
                linear-gradient(rgba(201,168,76,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(201,168,76,0.04) 1px, transparent 1px);
            background-size: 60px 60px;
        }

        .content {
            position: relative; z-index: 2;
            display: flex; flex-direction: column;
            align-items: center; width: 100%; max-width: 800px;
        }

        /* ===== CENTRAL VISUAL ===== */
        .visual { position: relative; width: 200px; height: 200px; margin-bottom: 38px; }

        .ring { position: absolute; border-radius: 50%; pointer-events: none; }

        .ring-a {
            inset: -22px;
            border: 1px solid rgba(201,168,76,0.2);
            animation: spin 14s linear infinite;
        }

        .ring-a::before {
            content: '';
            position: absolute; top: -4px; left: 50%;
            transform: translateX(-50%);
            width: 8px; height: 8px;
            background: var(--gold-bright); border-radius: 50%;
            box-shadow: 0 0 12px var(--gold-bright);
        }

        .ring-b {
            inset: -8px;
            border: 1px dashed rgba(201,168,76,0.22);
            animation: spin 9s linear infinite reverse;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .glow {
            position: absolute; inset: 0; border-radius: 50%;
            background: radial-gradient(circle, rgba(201,168,76,0.14) 0%, rgba(201,168,76,0.04) 55%, transparent 72%);
            animation: pulse 3s ease-in-out infinite;
        }

        @keyframes pulse { 0%,100% { transform:scale(1); opacity:1; } 50% { transform:scale(1.1); opacity:0.65; } }

        .brain-wrap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }

        .brain-wrap i {
            font-size: 6rem;
            background: linear-gradient(135deg, var(--gold-dark), var(--gold-bright));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 18px rgba(255,215,0,0.55));
            animation: brainGlow 3s ease-in-out infinite;
        }

        @keyframes brainGlow {
            0%,100% { filter: drop-shadow(0 0 18px rgba(255,215,0,0.55)); }
            50%      { filter: drop-shadow(0 0 36px rgba(255,215,0,0.85)); }
        }

        .coin {
            position: absolute; color: var(--gold-bright);
            filter: drop-shadow(0 0 7px rgba(255,215,0,0.65));
            animation: floatY 2.6s ease-in-out infinite;
        }

        .coin-n { top:4px; left:50%; transform:translateX(-50%); font-size:1.3rem; animation-delay:0s; }
        .coin-e { top:50%; right:-2px; transform:translateY(-50%); font-size:1.1rem; animation-delay:0.7s; }
        .coin-s { bottom:4px; left:50%; transform:translateX(-50%); font-size:1.2rem; animation-delay:1.4s; }
        .coin-w { top:50%; left:-2px; transform:translateY(-50%); font-size:1.1rem; animation-delay:2.1s; }

        @keyframes floatY { 0%,100% { margin-top:0; } 50% { margin-top:-7px; } }

        /* ===== TITLE ===== */
        .title { font-size:2.8rem; font-weight:900; letter-spacing:5px; text-align:center; margin-bottom:8px; }

        .title span {
            background: linear-gradient(135deg, var(--gold), var(--gold-bright));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .subtitle { font-size:0.9rem; color:var(--gray); letter-spacing:4px; text-align:center; margin-bottom:10px; }

        .divider {
            width:56px; height:2px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            margin: 0 auto 50px;
        }

        /* ===== GOLD BILL BUTTON ===== */
        .bill-btn {
            display: block;
            width: 100%;
            text-decoration: none;
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            animation: fadeUp 0.7s ease-out both;
            box-shadow:
                0 2px 0 #0d0b00,
                0 4px 0 #080700,
                0 6px 0 #050400,
                0 22px 65px rgba(0,0,0,0.7),
                0 0 0 1px rgba(139,105,20,0.5);
        }

        @keyframes fadeUp {
            from { opacity:0; transform:translateY(32px); }
            to   { opacity:1; transform:translateY(0); }
        }

        .bill-btn:hover {
            transform: translateY(-8px);
            box-shadow:
                0 2px 0 #0d0b00,
                0 4px 0 #080700,
                0 6px 0 #050400,
                0 34px 85px rgba(0,0,0,0.75),
                0 0 55px rgba(201,168,76,0.22),
                0 0 0 1px rgba(201,168,76,0.6);
        }

        .bill-btn:active { transform: translateY(-2px); }

        /* Outer shell — gold bill texture */
        .bill-outer {
            background: var(--bill-bg);
            background-image:
                /* Fine crosshatch lines */
                repeating-linear-gradient(0deg,   rgba(201,168,76,0.06) 0px, rgba(201,168,76,0.06) 1px, transparent 1px, transparent 5px),
                repeating-linear-gradient(90deg,  rgba(201,168,76,0.06) 0px, rgba(201,168,76,0.06) 1px, transparent 1px, transparent 5px),
                /* Diagonal micro pattern */
                repeating-linear-gradient(45deg,  rgba(0,0,0,0.12) 0px, rgba(0,0,0,0.12) 1px, transparent 1px, transparent 14px),
                repeating-linear-gradient(-45deg, rgba(0,0,0,0.12) 0px, rgba(0,0,0,0.12) 1px, transparent 1px, transparent 14px),
                /* Base gold gradient */
                linear-gradient(160deg, #0d0b00 0%, #1a1200 20%, #2d2200 50%, #1a1200 80%, #0d0b00 100%);
            border-radius: 10px;
            padding: 14px;
            position: relative;
        }

        /* Ornate outer border */
        .bill-outer::before {
            content: '';
            position: absolute; inset: 5px;
            border: 1px solid rgba(139,105,20,0.5);
            border-radius: 5px;
            pointer-events: none;
        }

        /* Shimmer on hover */
        .bill-outer::after {
            content: '';
            position: absolute; inset: 0; border-radius: 10px;
            background: linear-gradient(115deg, transparent 30%, rgba(255,215,0,0.07) 50%, transparent 70%);
            background-size: 250% 100%;
            background-position: -100% 0;
            transition: background-position 0.75s ease;
            pointer-events: none;
        }

        .bill-btn:hover .bill-outer::after { background-position: 200% 0; }

        /* Inner frame */
        .bill-inner {
            border: 2px solid rgba(139,105,20,0.6);
            border-radius: 4px;
            padding: 36px 44px;
            position: relative;
            display: flex;
            align-items: center;
            gap: 36px;
            box-shadow:
                inset 0 0 0 6px rgba(10,8,0,0.5),
                inset 0 0 50px rgba(0,0,0,0.3);
        }

        /* Corner denominations */
        .bill-corner {
            position: absolute;
            font-family: 'Georgia', 'Times New Roman', serif;
            font-weight: 700;
            color: rgba(201,168,76,0.7);
            line-height: 1;
            user-select: none;
        }

        .bill-corner.tl { top:14px; left:18px; font-size:2rem; }
        .bill-corner.tr { top:14px; right:18px; font-size:2rem; text-align:right; }
        .bill-corner.bl { bottom:14px; left:18px; font-size:1.05rem; letter-spacing:1px; }
        .bill-corner.br { bottom:14px; right:18px; font-size:1.05rem; text-align:right; letter-spacing:1px; }

        /* Seal circles */
        .bill-seal {
            width: 100px; height: 100px; min-width: 100px;
            border-radius: 50%;
            border: 2px solid rgba(139,105,20,0.65);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 4px;
            background: radial-gradient(circle, rgba(201,168,76,0.12) 0%, rgba(26,18,0,0.2) 70%, transparent 100%);
            position: relative; flex-shrink: 0;
        }

        /* Dashed inner ring */
        .bill-seal::before {
            content: ''; position: absolute; inset: 5px;
            border-radius: 50%;
            border: 1px dashed rgba(201,168,76,0.3);
        }

        /* Tick mark outer ring */
        .bill-seal::after {
            content: ''; position: absolute; inset: -6px;
            border-radius: 50%;
            border: 1px solid rgba(139,105,20,0.25);
            background: repeating-conic-gradient(
                rgba(201,168,76,0.3) 0deg 3deg,
                transparent 3deg 12deg
            );
            -webkit-mask: radial-gradient(transparent 80%, black 80%);
            mask: radial-gradient(transparent 80%, black 80%);
        }

        .bill-seal i {
            font-size: 2rem;
            background: linear-gradient(135deg, var(--gold-dark), var(--gold-bright));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 6px rgba(255,215,0,0.4));
            position: relative; z-index: 1;
        }

        .bill-seal-label {
            font-size: 0.48rem; letter-spacing: 1.5px;
            color: var(--bill-muted);
            text-transform: uppercase;
            font-family: 'Georgia', serif;
            position: relative; z-index: 1;
        }

        /* Center content */
        .bill-center { flex: 1; text-align: center; }

        .bill-series {
            font-size: 0.58rem; letter-spacing: 3px;
            color: rgba(201,168,76,0.5);
            margin-bottom: 10px;
            font-family: 'Georgia', 'Times New Roman', serif;
            text-transform: uppercase;
        }

        .bill-issuer {
            font-size: 0.65rem; letter-spacing: 2px;
            color: rgba(201,168,76,0.35);
            margin-bottom: 18px;
            font-family: 'Georgia', serif;
            text-transform: uppercase;
        }

        /* Main CTA — gold engraved */
        .bill-main-text {
            font-size: 2.4rem; font-weight: 900;
            color: var(--bill-text);
            letter-spacing: 6px;
            font-family: 'Georgia', 'Times New Roman', serif;
            margin-bottom: 14px;
            background: linear-gradient(180deg, #FFF8DC 0%, #FFD700 50%, #C9A84C 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 8px rgba(0,0,0,0.5));
        }

        /* Rule lines above/below main text */
        .bill-main-text::before,
        .bill-main-text::after {
            content: '';
            display: block; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(201,168,76,0.4), transparent);
            margin: 8px 10%;
            -webkit-text-fill-color: initial;
        }

        .bill-sub {
            font-size: 0.6rem; letter-spacing: 3px;
            color: rgba(201,168,76,0.35);
            font-family: 'Georgia', serif; text-transform: uppercase;
        }

        /* Serial number row */
        .bill-serial-row {
            display: flex; justify-content: space-between; align-items: center;
            margin-top: 20px; padding-top: 12px;
            border-top: 1px solid rgba(139,105,20,0.25);
        }

        .bill-serial {
            font-size: 0.62rem; letter-spacing: 3px;
            color: rgba(201,168,76,0.45);
            font-family: 'Courier New', 'Courier', monospace;
            font-weight: 700;
        }

        /* ===== FOOTER ===== */
        .footer {
            text-align: center; padding: 22px;
            font-size: 0.76rem; color: var(--gray);
            letter-spacing: 1px;
            border-top: 1px solid var(--black-border);
            position: relative; z-index: 2;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 640px) {
            .title { font-size: 2rem; letter-spacing: 3px; }
            .visual { width: 160px; height: 160px; }
            .brain-wrap i { font-size: 4.8rem; }
            .bill-inner { flex-direction: column; padding: 28px 20px; gap: 20px; }
            .bill-seal { width: 76px; height: 76px; min-width: 76px; }
            .bill-main-text { font-size: 1.8rem; letter-spacing: 3px; }
            .bill-corner.tr, .bill-corner.br { display: none; }
        }
    </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
    <div class="nav-inner">
        <a class="logo" href="#">
            <div class="logo-icon">智</div>
            <div class="logo-texts">
                <span class="logo-name">智富系統</span>
                <span class="logo-sub">ZHIFU AI SYSTEM</span>
            </div>
        </a>
        <div class="nav-dot">系統運行中</div>
    </div>
</nav>

<!-- MAIN PAGE -->

    <div class="bg-grid"></div>

    <div class="content">

        <!-- BRAIN + MONEY VISUAL -->
        <div class="visual">
            <div class="ring ring-a"></div>

            <span class="coin coin-n"><i class="fa-solid fa-coins"></i></span>
            <span class="coin coin-e"><i class="fa-solid fa-sack-dollar"></i></span>

        </div>

        <!-- TITLE -->
        <h1 class="title"><span>智富系統</span></h1>
        <p class="subtitle">AI 自動化主控台</p>
        <div class="divider"></div>

        <!-- GOLD BILL BUTTON -->
        <a class="bill-btn" href="cultivateAccount.html">

                    <div class="bill-seal">

                    </div>

                    <!-- Center -->
                    <div class="bill-center">

                            <span class="bill-serial">ZF8888 8888 A</span>

                        </div>
                    </div>

                    <!-- Right seal -->
                    <div class="bill-seal">
                        <i class="fa-solid fa-brain"></i>
                        <span class="bill-seal-label">AI SEAL</span>
                    </div>

                </div>
            </div>
        </a>

    </div>
</div>

<!-- FOOTER -->
<footer class="footer">
    &copy; 2025 智富系統 &nbsp;·&nbsp; AI 自動化驅動業績成長
</footer>

</body>
</html>
