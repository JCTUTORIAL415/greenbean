<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>蓋好賣 - 登入與註冊</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            overflow: hidden;
            background: #0a0a0a;
        }

        .background {
            position: fixed;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            overflow: hidden;
        }

        .animated-bg {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.6;
            animation: float 20s infinite ease-in-out;
        }

        .orb1 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, #667eea, transparent);
            top: -100px;
            left: -100px;
            animation-delay: 0s;
        }

        .orb2 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, #764ba2, transparent);
            bottom: -150px;
            right: -150px;
            animation-delay: 5s;
        }

        .orb3 {
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, #f093fb, transparent);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: 10s;
        }

        @keyframes float {
            0%, 100% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(100px, -100px) scale(1.1);
            }
            66% {
                transform: translate(-100px, 100px) scale(0.9);
            }
        }

        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            animation: particle-float 15s infinite;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        @keyframes particle-float {
            0% {
                transform: translateY(100vh) translateX(0) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) translateX(100px) scale(1);
                opacity: 0;
            }
        }

        .container {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            padding: 50px 45px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.3),
                        0 0 100px rgba(102, 126, 234, 0.2),
                        inset 0 0 60px rgba(255, 255, 255, 0.05);
            animation: card-entrance 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
        }

        @keyframes card-entrance {
            0% {
                opacity: 0;
                transform: scale(0.8) translateY(50px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .card-glow {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, transparent 70%);
            animation: glow-pulse 3s infinite ease-in-out;
            pointer-events: none;
        }

        @keyframes glow-pulse {
            0%, 100% {
                opacity: 0.5;
                transform: scale(1);
            }
            50% {
                opacity: 0.8;
                transform: scale(1.1);
            }
        }

        .logo-container {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
        }

        .logo {
            font-size: 4rem;
            margin-bottom: 10px;
            animation: logo-bounce 2s infinite ease-in-out;
            display: inline-block;
            filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.3));
        }

        @keyframes logo-bounce {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            50% {
                transform: translateY(-10px) rotate(5deg);
            }
        }

        .logo-text {
            font-size: 2.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #fff 0%, #f0f0f0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 2px;
            text-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            animation: text-glow 2s infinite alternate;
        }

        @keyframes text-glow {
            0% {
                filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.5));
            }
            100% {
                filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.8));
            }
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1rem;
            margin-top: 10px;
            font-weight: 500;
            letter-spacing: 1px;
        }

        .form-group {
            margin-bottom: 25px;
            position: relative;
        }

        .form-group label {
            display: block;
            color: rgba(255, 255, 255, 0.95);
            font-weight: 600;
            margin-bottom: 10px;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.7);
            transition: all 0.3s;
            z-index: 1;
            pointer-events: none;
        }

        .form-group input {
            width: 100%;
            padding: 16px 20px 16px 50px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 15px;
            font-size: 1rem;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            color: white;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 500;
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .form-group input:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.8);
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.2),
                        0 0 60px rgba(102, 126, 234, 0.3);
            transform: translateY(-2px);
        }

        .form-group input:focus + .input-icon {
            color: white;
            transform: translateY(-50%) scale(1.1);
        }

        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            font-size: 0.9rem;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(255, 255, 255, 0.9);
            cursor: pointer;
            user-select: none;
        }

        .remember-me input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #667eea;
        }

        .login-btn {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 15px;
            font-size: 1.1rem;
            font-weight: 700;
            color: white;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
            letter-spacing: 1px;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        .login-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }

        .login-btn:hover::before {
            left: 100%;
        }

        .login-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.6);
        }

        .login-btn:active {
            transform: translateY(-1px);
        }

        .signup-link {
            text-align: center;
            margin-top: 30px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.95rem;
        }

        .signup-link a {
            color: white;
            text-decoration: none;
            font-weight: 700;
            margin-left: 5px;
            transition: all 0.3s;
            cursor: pointer;
        }

        .signup-link a:hover {
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
        }

        .features {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }

        .feature-item {
            text-align: center;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            transition: all 0.3s;
        }

        .feature-item:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-5px);
        }

        .feature-icon {
            font-size: 2rem;
            margin-bottom: 8px;
            display: block;
        }

        .feature-text {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .login-card {
                padding: 40px 30px;
            }

            .logo {
                font-size: 3rem;
            }

            .logo-text {
                font-size: 2rem;
            }

            .features {
                grid-template-columns: 1fr;
                gap: 10px;
            }
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .loading-overlay.show {
            display: flex;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            z-index: 10000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-y: auto;
        }

        .modal.show {
            display: flex;
            animation: modal-fade-in 0.3s ease-out;
        }

        @keyframes modal-fade-in {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }

        .modal-content {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            padding: 40px 35px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.3),
                        0 0 100px rgba(102, 126, 234, 0.2),
                        inset 0 0 60px rgba(255, 255, 255, 0.05);
            position: relative;
            animation: modal-slide-up 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            margin: auto;
            max-height: 90vh;
            overflow-y: auto;
        }

        @keyframes modal-slide-up {
            0% {
                opacity: 0;
                transform: translateY(50px) scale(0.9);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 25px;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.8);
            font-size: 2rem;
            cursor: pointer;
            transition: all 0.3s;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            z-index: 10;
        }

        .modal-close:hover {
            color: white;
            background: rgba(255, 255, 255, 0.1);
            transform: scale(1.1);
        }

        .modal-title {
            text-align: center;
            font-size: 1.8rem;
            font-weight: 900;
            background: linear-gradient(135deg, #fff 0%, #f0f0f0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        .form-input {
            width: 100%;
            padding: 16px 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 15px;
            font-size: 1rem;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            color: white;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 500;
        }

        .form-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .form-input:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.8);
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.2),
                        0 0 60px rgba(102, 126, 234, 0.3);
            transform: translateY(-2px);
        }

        .form-select {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='white'%3e%3cpath d='M7 10l5 5 5-5z'/%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 15px center;
            background-size: 20px;
            padding-right: 50px;
        }

        .form-select option {
            background: #333;
            color: white;
        }

        .checkbox-group {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-top: 10px;
        }

        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #667eea;
            margin-top: 2px;
            flex-shrink: 0;
        }

        .checkbox-group label {
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.9rem;
            cursor: pointer;
            line-height: 1.5;
        }

        .checkbox-group a {
            color: white;
            text-decoration: none;
            font-weight: 600;
        }

        .checkbox-group a:hover {
            text-decoration: underline;
        }

        .btn {
            padding: 16px 20px;
            border: none;
            border-radius: 15px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            color: white;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .btn-primary::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }

        .btn-primary:hover::before {
            left: 100%;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.6);
        }

        .btn-primary:active {
            transform: translateY(-1px);
        }

        .success-message {
            background: rgba(76, 175, 80, 0.2);
            border: 1px solid rgba(76, 175, 80, 0.5);
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-weight: 600;
            margin-top: 20px;
            animation: fade-in 0.5s ease-out;
        }

        @keyframes fade-in {
            0% {
                opacity: 0;
                transform: translateY(10px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .error-message {
            background: rgba(244, 67, 54, 0.2);
            border: 1px solid rgba(244, 67, 54, 0.5);
            color: white;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            font-weight: 600;
            margin-top: 15px;
            font-size: 0.9rem;
            animation: shake 0.5s ease-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        small {
            display: block;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="background">
        <div class="animated-bg">
            <div class="orb orb1"></div>
            <div class="orb orb2"></div>
            <div class="orb orb3"></div>
        </div>
        <div class="particles" id="particles"></div>
    </div>

    <div class="container">
        <div class="login-card">
            <div class="card-glow"></div>
            
            <div class="logo-container">
                <div class="logo">🏆</div>
                <h1 class="logo-text">蓋好賣</h1>
                <p class="subtitle">幾杯飲料錢的智能行銷平台</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">帳號</label>
                    <div class="input-wrapper">
                        <input type="text" id="email" placeholder="輸入您的 Email 或電話" required>
                        <div class="input-icon">👤</div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">密碼</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" placeholder="輸入您的密碼" required>
                        <div class="input-icon">🔒</div>
                    </div>
                </div>

                <div class="remember-forgot">
                    <label class="remember-me">
                        <input type="checkbox" id="remember">
                        <span>記住我</span>
                    </label>
                </div>

                <button type="submit" class="login-btn">
                    立即登入
                </button>
            </form>

            <div class="signup-link">
                還沒有帳號？<a href="#" id="signupLink">立即註冊</a>
            </div>

            <div class="features">
                <div class="feature-item">
                    <span class="feature-icon">⚡</span>
                    <div class="feature-text">快速發文</div>
                </div>
                <div class="feature-item">
                    <span class="feature-icon">📊</span>
                    <div class="feature-text">數據分析</div>
                </div>
                <div class="feature-item">
                    <span class="feature-icon">🤖</span>
                    <div class="feature-text">AI 智能</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Registration Modal -->
    <div class="modal" id="registrationModal">
        <div class="modal-content">
            <button class="modal-close" id="modalClose">×</button>
            <h3 class="modal-title">📝 立即註冊試用</h3>
            <form id="trialForm">
                <div class="form-group">
                    <label for="regName">👤 姓名 *</label>
                    <input type="text" id="regName" name="name" required placeholder="請輸入您的姓名" class="form-input">
                </div>
                <div class="form-group">
                    <label for="regPhone">📱 手機號碼 *</label>
                    <input type="tel" id="regPhone" name="phone" required placeholder="請輸入手機號碼（例：0912345678）" pattern="[0-9]{10}" class="form-input">
                </div>
                <div class="form-group">
                    <label for="regEmail">📧 電子信箱 *</label>
                    <input type="email" id="regEmail" name="email" required placeholder="請輸入電子信箱" class="form-input">
                    <small style="color: rgba(255, 255, 255, 0.7); font-size: 0.8rem;">試用帳號密碼將寄送至此信箱</small>
                </div>
                <div class="form-group">
                    <label for="regAddress">🏠 地址</label>
                    <input type="text" id="regAddress" name="address" placeholder="請輸入地址（選填）" class="form-input">
                </div>
                <div class="form-group">
                    <label for="regIndustry">💼 產業別 *</label>
                    <select id="regIndustry" name="industry" required class="form-input form-select">
                        <option value="">請選擇您的產業</option>
                        <option value="房仲業">🏠 房仲業</option>
                        <option value="車仲業">🚗 車仲業</option>
                        <option value="貸款業">💰 貸款業</option>
                        <option value="遊戲私服">🎮 遊戲私服</option>
                        <option value="保險業">💼 保險業</option>
                        <option value="直銷業">🤝 直銷業</option>
                        <option value="電商">🛒 電商</option>
                        <option value="其他">📋 其他</option>
                    </select>
                </div>
                <div class="form-group">
                    <div class="checkbox-group">
                        <input type="checkbox" name="terms" required id="terms">
                        <label for="terms">我已閱讀並同意 <a href="#" onclick="event.preventDefault();">服務條款</a> 和 <a href="#" onclick="event.preventDefault();">隱私政策</a></label>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">🎁 立即免費試用 3 天</button>
                <div id="formMessage" style="margin-top: 25px; display: none;"></div>
            </form>
        </div>
    </div>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
    </div>

    <script>
        // Create floating particles
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = 50;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 15 + 's';
                particle.style.animationDuration = (Math.random() * 10 + 10) + 's';
                particlesContainer.appendChild(particle);
            }
        }

        createParticles();

        // Handle login
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            // Show loading
            document.getElementById('loadingOverlay').classList.add('show');
            
            // Simulate login process
            setTimeout(() => {
                document.getElementById('loadingOverlay').classList.remove('show');
                alert('登入成功！歡迎回來 ' + email);
                // Redirect to dashboard
                // window.location.href = 'dashboard.html';
            }, 2000);
        });

        // Modal functions
        function openModal() {
            document.getElementById('registrationModal').classList.add('show');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('registrationModal').classList.remove('show');
            document.body.style.overflow = '';
            // Clear any error messages
            const formMessage = document.getElementById('formMessage');
            formMessage.style.display = 'none';
            formMessage.innerHTML = '';
        }

        // Handle registration form submission
        document.getElementById('trialForm').addEventListener('submit', function(event) {
            event.preventDefault();
            
            // Get form values
            const name = document.getElementById('regName').value;
            const phone = document.getElementById('regPhone').value;
            const email = document.getElementById('regEmail').value;
            const address = document.getElementById('regAddress').value;
            const industry = document.getElementById('regIndustry').value;
            const termsChecked = document.getElementById('terms').checked;
            
            // Validate phone number format
            const phoneRegex = /^[0-9]{10}$/;
            if (!phoneRegex.test(phone)) {
                const formMessage = document.getElementById('formMessage');
                formMessage.innerHTML = `
                    <div class="error-message">
                        ❌ 請輸入正確的手機號碼格式（10 位數字）
                    </div>
                `;
                formMessage.style.display = 'block';
                return;
            }
            
            // Check if terms are accepted
            if (!termsChecked) {
                const formMessage = document.getElementById('formMessage');
                formMessage.innerHTML = `
                    <div class="error-message">
                        ❌ 請先閱讀並同意服務條款和隱私政策
                    </div>
                `;
                formMessage.style.display = 'block';
                return;
            }
            
            // Check if industry is selected
            if (!industry) {
                const formMessage = document.getElementById('formMessage');
                formMessage.innerHTML = `
                    <div class="error-message">
                        ❌ 請選擇您的產業別
                    </div>
                `;
                formMessage.style.display = 'block';
                return;
            }
            
            console.log('表單提交中...', { name, phone, email, address, industry });
            
            // Show loading
            document.getElementById('loadingOverlay').classList.add('show');
            
            // Simulate form submission
            setTimeout(() => {
                document.getElementById('loadingOverlay').classList.remove('show');
                
                // Show success message
                const formMessage = document.getElementById('formMessage');
                formMessage.innerHTML = `
                    <div class="success-message">
                        ✅ 註冊成功！我們已將在24小時內將試用帳號資訊寄送至 ${email}，請查收您的信箱。
                    </div>
                `;
                formMessage.style.display = 'block';
                
                // Reset form
                document.getElementById('trialForm').reset();
                
                // Close modal after 3 seconds
                setTimeout(() => {
                    closeModal();
                }, 3000);
            }, 2000);
        });

        // Add event listeners
        document.getElementById('signupLink').addEventListener('click', function(e) {
            e.preventDefault();
            openModal();
        });
        
        document.getElementById('modalClose').addEventListener('click', function(e) {
            e.preventDefault();
            closeModal();
        });

        // Close modal when clicking outside
        document.getElementById('registrationModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        // Escape key to close modal
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                const modal = document.getElementById('registrationModal');
                if (modal.classList.contains('show')) {
                    closeModal();
                }
            }
        });

        // Add input animation effects
        const inputs = document.querySelectorAll('input[type="text"], input[type="password"], input[type="email"], input[type="tel"]');
        inputs.forEach(input => {
            input.addEventListener('focus', function() {
                if (this.parentElement.classList && this.parentElement.classList.contains('input-wrapper')) {
                    this.parentElement.style.transform = 'scale(1.02)';
                }
            });
            
            input.addEventListener('blur', function() {
                if (this.parentElement.classList && this.parentElement.classList.contains('input-wrapper')) {
                    this.parentElement.style.transform = 'scale(1)';
                }
            });
        });

        // Form validation feedback
        const trialFormInputs = document.querySelectorAll('#trialForm input[required], #trialForm select[required]');
        trialFormInputs.forEach(input => {
            input.addEventListener('invalid', function(e) {
                e.preventDefault();
                this.style.borderColor = 'rgba(244, 67, 54, 0.8)';
                
                setTimeout(() => {
                    this.style.borderColor = '';
                }, 2000);
            });
            
            input.addEventListener('input', function() {
                if (this.validity.valid) {
                    this.style.borderColor = 'rgba(76, 175, 80, 0.8)';
                    setTimeout(() => {
                        this.style.borderColor = '';
                    }, 1000);
                }
            });
        });

        // Debug: Log when submit button is clicked
        document.querySelector('#trialForm .btn-primary').addEventListener('click', function(e) {
            console.log('提交按鈕被點擊了！');
        });
    </script>
</body>
</html>
