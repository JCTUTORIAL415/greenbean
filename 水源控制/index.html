<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>蓋亞智慧水控</title>
  <link rel="stylesheet" href="index.css">
        
        <!-- iOS 配置 -->
        <meta name="apple-mobile-web-app-title" content="爆勞情報網">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="black">
        <link rel="apple-touch-icon" sizes="57x57" href="images/icon-57.png">
        <link rel="apple-touch-icon" sizes="72x72" href="images/icon-72.png">
        <link rel="apple-touch-icon" sizes="114x114" href="images/icon-114.png">
        <link rel="apple-touch-icon" sizes="120x120" href="images/icon-120.png">
        <link rel="apple-touch-icon" sizes="144x144" href="images/icon-144.png">
        <link rel="apple-touch-icon" sizes="152x152" href="images/icon-152.png">
        <link rel="apple-touch-icon" sizes="180x180" href="images/icon-180.png">
        <link rel="apple-touch-icon" sizes="360x360" href="images/icon-360.png">
    
        <!-- 安卓 (PWA) 配置 -->
        <link rel="manifest" href="manifest.json">
        <meta name="theme-color" content="#ffffff">
    
        <!-- SEO 配置 -->
        <meta name="keywords" content="農業物聯網, 自動灌溉系統, 智能水資源管理, 田間感測器, 遠端監控, 智慧農業解決方案, 灌溉自動化, 土壤濕度感測器, 水資源優化, 農業環境監測, 農田智慧控制系統, 自動化水閥控制, 農業物聯網應用, 灌溉效率提升, 農田水管理技術, 環境數據分析, 農業自動化設備, 智慧灌溉技術, 農田水資源監控, 農業物聯網平台, 精準農業, 即時數據監控, 水流控制系統, 低功耗感測器, 雲端數據處理">
        <meta name="description" content="簡易操作，田間開關水好簡單">
        <meta name="author" content="蓋亞營運軟體有限公司">
        <meta name="robots" content="index, follow">
</head>
<body>
  <div class="overlay" id="overlay" onclick="toggleMenu(false)"></div>
  <div class="container">
    <header>
      <div class="logo">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2C8 2 4 9 4 13a8 8 0 0 0 16 0c0-4-4-11-8-11z"></path>
          <path d="M8 13a4 4 0 0 1 8 0"></path>
          <path d="M10 16a2 2 0 0 1 4 0"></path>
        </svg>
        <h1>蓋亞智慧水控</h1>
      </div>
      <span class="hamburger" onclick="toggleMenu()">☰</span>
      <div class="navigation">
        <a href="#" data-page="field-management" class="active">田區管理</a>
        <a href="#" data-page="irrigation-records">灌溉紀錄</a>
        <a href="#" data-page="schedule-management">排程管理</a>
        <a href="#" data-page="device-binding">新增田區</a>
      </div>
    </header>
    
    <div class="dashboard">
      <div class="sidebar">
        <div class="user-info" onclick="showUserEditModal()">
          <div class="user-avatar" id="userAvatar">農</div>
          <div>
            <div id="userName">老農</div>
            <div style="font-size: 0.8rem; color: #666;">管理員</div>
          </div>
        </div>
        <div class="menu">
          <a href="#" data-page="field-management" class="active">我的田區</a>
          <a href="#" data-page="irrigation-records">灌溉紀錄</a>
          <a href="#" data-page="schedule-management">排程管理</a>
          <a href="#" data-page="device-binding">新增田區</a>
          <button class="btn btn-danger" id="logoutBtn" onclick="logout()">登出</button>
        </div>
      </div>
      
      <div class="main-content">
        <!-- 田區管理 -->
        <div class="page active" id="field-management">
          <h2>我的田區</h2>
          <p id="fieldSummary">總共有 0 個田區，0 個正在灌溉中</p>
          <div class="search-container">
            <input type="text" class="search-input" id="fieldSearch" placeholder="搜尋田區名稱或設備 ID">
          </div>
          <div class="field-cards" id="fieldCards"></div>
          <div id="field-detail" style="display: none;">
            <div class="field-header">
              <a href="#" class="back-button" onclick="hideFieldDetail()">← 返回田區</a>
              <div class="control-buttons">
                <button class="btn btn-primary" onclick="showEditFieldForm()">編輯田區</button>
                <button class="btn btn-danger" onclick="deleteField()">刪除田區</button>
              </div>
            </div>
            <div class="field-detail">
              <div class="field-detail-image" id="fieldDetailImage">
                <div class="photo-upload" style="position: absolute; bottom: 8px; right: 8px;">
                  <div class="photo-preview" id="detailPhotoPreview" onclick="document.getElementById('detailFieldPhoto').click()">更換照片</div>
                  <input type="file" id="detailFieldPhoto" accept="image/*" style="display: none;">
                </div>
              </div>
              <div class="field-detail-info" id="fieldDetailInfo"></div>
            </div>
            <div class="control-panel">
              <div class="control-header">
                <h3>灌溉控制</h3>
                <div class="control-buttons">
                  <button class="btn" id="irrigateNowBtn" onclick="toggleIrrigation()">開始灌溉</button>
                  <button class="btn btn-primary" onclick="document.getElementById('scheduleModal').style.display='flex'">新增排程</button>
                </div>
              </div>
              <table class="schedule-table" id="scheduleTable">
                <thead>
                  <tr><th>時間</th><th>持續</th><th>重複</th><th>開關</th><th>操作</th></tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
          </div>
        </div>
        
        <!-- 新增田區 -->
        <div class="page" id="device-binding">
          <h2>新增田區</h2>
          <p>請填寫田區資訊並上傳照片</p>
          <form id="deviceBindForm" style="margin-top: 15px;">
            <div class="form-group">
              <label>田區名稱</label>
              <input type="text" class="form-control" id="bindFieldName" required placeholder="例如：東區 A1">
            </div>
            <div class="form-group">
              <label>設備 ID</label>
              <input type="text" class="form-control" id="bindDeviceId" required placeholder="例如：WP-001-A">
            </div>
            <div class="form-group">
              <label>面積</label>
              <div style="display: flex; align-items: center; gap: 8px;">
                <input type="number" class="form-control" id="bindArea" required placeholder="輸入數字" style="flex: 1;">
                <select class="area-select" id="bindAreaUnit">
                  <option value="分">分</option>
                  <option value="甲">甲</option>
                </select>
              </div>
            </div>
            <div class="form-group">
              <label>田區照片</label>
              <div class="photo-upload">
                <div class="photo-preview" id="photoPreview" onclick="document.getElementById('fieldPhoto').click()">點擊上傳或拍照</div>
                <input type="file" id="fieldPhoto" accept="image/*" style="display: none;">
              </div>
            </div>
            <div class="form-footer">
              <button type="submit" class="btn btn-primary">新增田區</button>
            </div>
          </form>
        </div>
        
        <!-- 灌溉紀錄 -->
        <div class="page" id="irrigation-records">
          <h2>灌溉紀錄</h2>
          <p>查看田區的灌溉歷史（最近 30 筆已完成紀錄）</p>
          <table class="record-table" id="recordTable">
            <thead>
              <tr><th>田區</th><th>開始時間</th><th>持續時間</th><th>狀態</th></tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
        
        <!-- 排程管理 -->
        <div class="page" id="schedule-management">
          <h2>排程管理</h2>
          <p>預設排程模板並套用到田區</p>
          <div class="control-buttons" style="margin-bottom: 15px;">
            <button class="btn btn-primary" onclick="document.getElementById('addTemplateModal').style.display='flex'">新增排程模板</button>
          </div>
          <table class="schedule-template-table" id="templateTable">
            <thead>
              <tr><th>名稱</th><th>開始時間</th><th>持續時間</th><th>重複</th><th>操作</th></tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>
    
    <!-- 新增排程模態框 -->
    <div class="modal" id="scheduleModal">
      <div class="modal-content">
        <div class="modal-header">
          <h2>設定灌溉時間</h2>
          <span class="close-button" onclick="document.getElementById('scheduleModal').style.display='none'">×</span>
        </div>
        <form id="scheduleForm">
          <div class="form-group">
            <label>開始時間</label>
            <input type="datetime-local" class="form-control" id="scheduleTime" required>
          </div>
          <div class="form-group">
            <label>持續時間</label>
            <div style="display: flex; align-items: center; gap: 8px;">
              <input type="number" class="form-control" id="scheduleDuration" required placeholder="輸入數字" style="flex: 1;">
              <select class="area-select" id="scheduleUnit">
                <option value="分鐘">分鐘</option>
                <option value="小時">小時</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label>重複</label>
            <select class="form-control" id="scheduleRepeat" onchange="toggleCustomRepeat(this, 'customRepeatDays')">
              <option value="一次性">一次性</option>
              <option value="每日">每日</option>
              <option value="每週">每週</option>
              <option value="custom">自訂間隔</option>
            </select>
            <div id="customRepeatDays" style="display: none; margin-top: 10px;">
              <label>每幾天一次</label>
              <input type="number" class="form-control" id="scheduleCustomDays" min="1" placeholder="輸入天數" style="width: 100%;">
            </div>
          </div>
          <div class="form-footer">
            <button type="button" class="btn btn-secondary" onclick="document.getElementById('scheduleModal').style.display='none'">取消</button>
            <button type="submit" class="btn btn-primary">確定</button>
          </div>
        </form>
      </div>
    </div>
    
    <!-- 新增排程模板模態框 -->
    <div class="modal" id="addTemplateModal">
      <div class="modal-content">
        <div class="modal-header">
          <h2>新增排程模板</h2>
          <span class="close-button" onclick="document.getElementById('addTemplateModal').style.display='none'">×</span>
        </div>
        <form id="templateForm">
          <div class="form-group">
            <label>模板名稱</label>
            <input type="text" class="form-control" id="templateName" name="templateName" required placeholder="例如：晨間短時灌溉">
          </div>
          <div class="form-group">
            <label>開始時間</label>
            <input type="datetime-local" class="form-control" id="templateTime" name="templateTime" required>
          </div>
          <div class="form-group">
            <label>持續時間</label>
            <div style="display: flex; align-items: center; gap: 8px;">
              <input type="number" class="form-control" id="templateDuration" name="templateDuration" required placeholder="輸入數字" style="flex: 1;">
              <select class="area-select" id="templateUnit" name="templateUnit">
                <option value="分鐘">分鐘</option>
                <option value="小時">小時</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label>重複</label>
            <select class="form-control" id="templateRepeat" name="templateRepeat" onchange="toggleCustomRepeat(this, 'customTemplateDays')">
              <option value="一次性">一次性</option>
              <option value="每日">每日</option>
              <option value="每週">每週</option>
              <option value="custom">自訂間隔</option>
            </select>
            <div id="customTemplateDays" style="display: none; margin-top: 10px;">
              <label>每幾天一次</label>
              <input type="number" class="form-control" id="templateCustomDays" name="templateCustomDays" min="1" placeholder="輸入天數" style="width: 100%;">
            </div>
          </div>
          <div class="form-footer">
            <button type="button" class="btn btn-secondary" onclick="document.getElementById('addTemplateModal').style.display='none'">取消</button>
            <button type="submit" class="btn btn-primary">新增</button>
          </div>
        </form>
      </div>
    </div>
    
    <!-- 套用排程模板模態框 -->
    <div class="modal" id="applyTemplateModal">
      <div class="modal-content">
        <div class="modal-header">
          <h2>選擇要套用的田區</h2>
          <span class="close-button" onclick="document.getElementById('applyTemplateModal').style.display='none'">×</span>
        </div>
        <form id="applyTemplateForm">
          <div class="checkbox-group" id="templateFieldCheckboxes"></div>
          <div class="form-footer">
            <button type="button" class="btn btn-secondary" onclick="document.getElementById('applyTemplateModal').style.display='none'">取消</button>
            <button type="submit" class="btn btn-primary">套用</button>
          </div>
        </form>
      </div>
    </div>
    
    <!-- 編輯用戶資訊模態框 -->
    <div class="modal" id="userEditModal">
      <div class="modal-content">
        <div class="modal-header">
          <h2>編輯用戶資訊</h2>
          <span class="close-button" onclick="document.getElementById('userEditModal').style.display='none'">×</span>
        </div>
        <form id="userEditForm">
          <div class="form-group">
            <label>名稱</label>
            <input type="text" class="form-control" id="editUserName" required placeholder="輸入新名稱">
          </div>
          <div class="form-footer">
            <button type="button" class="btn btn-secondary" onclick="document.getElementById('userEditModal').style.display='none'">取消</button>
            <button type="submit" class="btn btn-primary">儲存</button>
          </div>
        </form>
      </div>
    </div>

    <!-- 編輯田區模態框 -->
    <div class="modal" id="editFieldModal">
      <div class="modal-content">
        <div class="modal-header">
          <h2>編輯田區</h2>
          <span class="close-button" onclick="document.getElementById('editFieldModal').style.display='none'">×</span>
        </div>
        <form id="editFieldForm">
          <div class="form-group">
            <label>田區名稱</label>
            <input type="text" class="form-control" id="editFieldName" required placeholder="例如：東區 A1">
          </div>
          <div class="form-group">
            <label>設備 ID</label>
            <input type="text" class="form-control" id="editDeviceId" required placeholder="例如：WP-001-A">
          </div>
          <div class="form-group">
            <label>面積</label>
            <div style="display: flex; align-items: center; gap: 8px;">
              <input type="number" class="form-control" id="editAreaValue" required placeholder="輸入數字" style="flex: 1;">
              <select class="area-select" id="editAreaUnit">
                <option value="分">分</option>
                <option value="甲">甲</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label>田區照片</label>
            <div class="photo-upload">
              <div class="photo-preview" id="editPhotoPreview" onclick="document.getElementById('editFieldPhoto').click()">點擊上傳或拍照</div>
              <input type="file" id="editFieldPhoto" accept="image/*" style="display: none;">
            </div>
          </div>
          <div class="form-footer">
            <button type="button" class="btn btn-secondary" onclick="document.getElementById('editFieldModal').style.display='none'">取消</button>
            <button type="submit" class="btn btn-primary">儲存</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- 引入外部 config.js -->
  <script src="config.js"></script>
  <script src="index.js"></script>
</body>
</html>
