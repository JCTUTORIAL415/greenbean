<!-- mainfeist檔案內也有圖片路徑 -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自定义Web App</title>

    <!-- iOS 桌面图标名称 -->
    <meta name="apple-mobile-web-app-title" content="蓋亞植保藥物回傳">

    <!-- Safari (iOS) 配置 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="自定义名称">
    <!-- 各尺寸图标 -->
    <link rel="apple-touch-icon" sizes="57x57" href="icon-57.jpeg">
    <link rel="apple-touch-icon" sizes="72x72" href="icon-72.jpeg">
    <link rel="apple-touch-icon" sizes="114x114" href="icon-114.jpeg">
    <link rel="apple-touch-icon" sizes="120x120" href="icon-120.jpeg">
    <link rel="apple-touch-icon" sizes="144x144" href="icon-144.jpeg">
    <link rel="apple-touch-icon" sizes="152x152" href="icon-152.jpeg">
    <link rel="apple-touch-icon" sizes="180x180" href="icon-180.jpeg">
    <link rel="apple-touch-icon" sizes="180x180" href="icon-360.jpeg">

    <!-- 安卓 (PWA) 配置 -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">

</head>
<body>
    <h1>欢迎使用自定义Web App</h1>
    <p>请根据设备选择“添加到主屏幕”以体验伪Web App。</p>
</body>
</html>
