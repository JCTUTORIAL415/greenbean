    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script>

          // ← 先定義一個「預設地圖 Icon URL」
  const defaultIconUrl = 'img/transport.png';
  //            ^^^^^^^^^^^^^^^^^^^^^^^^^^^
  //            請改成你專案裡存在的那張 32×32 icon 圖檔路徑

        // Initialize map centered on Taiwan
        const map = L.map('map').setView([23.8, 121], 7);

        // Map layers
        const mapLayers = {
            streets: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
            }),
            satellite: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                attribution: '© Esri'
            }),
            terrain: L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenTopoMap'
            })
        };

        mapLayers.streets.addTo(map);

        // Map style switcher
        document.getElementById('map-style').addEventListener('change', function(e) {
            Object.values(mapLayers).forEach(layer => map.removeLayer(layer));
            mapLayers[e.target.value].addTo(map);
        });

        // 預設圖標選項 (由後端提供)
        const iconOptions = [
            { id: 'icon1', name: '衛星A', url: 'img/transport.png' },
            { id: 'icon2', name: '衛星B', url: 'img/tractor.png' },
            { id: 'icon3', name: '衛星C', url: 'img/transport.png' },
            { id: 'icon4', name: '衛星D', url: 'img/seeder.png' },
            { id: 'icon5', name: '衛星E', url: 'img/production.png' },
            { id: 'icon6', name: '衛星F', url: 'img/agriculture.png' },
            { id: 'icon7', name: '衛星G', url: 'img/electric-car.png' },
            { id: 'icon8', name: '衛星H', url: 'img/drone.png' },
            { id: 'icon9', name: '衛星I', url: 'img/transport-2.png' },
            { id: 'icon10', name: '衛星J', url: 'img/car.png' },
            { id: 'icon11', name: '衛星K', url: 'img/taxi.png' },
            { id: 'icon12', name: '衛星L', url: 'img/box-truck.png' },
            { id: 'icon13', name: '衛星M', url: 'img/delivery-truck.png' },
            { id: 'icon14', name: '衛星N', url: 'img/delivery.png' },
            { id: 'icon15', name: '衛星0', url: 'img/dump-truck.png' },
            { id: 'icon16', name: '衛星P', url: 'img/garbage-truck.png' },
            { id: 'icon17', name: '衛星Q', url: 'img/forklift.png' },
            { id: 'icon18', name: '衛星R', url: 'img/dog.png' },
            { id: 'icon19', name: '衛星S', url: 'img/cat.png' },
            { id: 'icon20', name: '衛星T', url: 'img/cow.png' },
            { id: 'icon21', name: '衛星U', url: 'img/pig.png' },
            { id: 'icon22', name: '衛星V', url: 'img/duck.png' },
            { id: 'icon23', name: '衛星W', url: 'img/pigeon.png' },
            { id: 'icon24', name: '衛星X', url: 'img/bird.png' }
        ];

        // 生成圖標選擇器
        const iconSelector = document.getElementById('iconSelector');
        iconOptions.forEach((icon, index) => {
            const iconOption = document.createElement('div');
            iconOption.className = 'icon-option';
            if (index === 0) iconOption.classList.add('selected');
            iconOption.dataset.iconId = icon.id;
            iconOption.dataset.iconUrl = icon.url;
            
            iconOption.innerHTML = `
                <div class="icon-preview" style="background-image: url(${icon.url})"></div>
            `;
            
            iconOption.addEventListener('click', function() {
                document.querySelectorAll('.icon-option').forEach(opt => opt.classList.remove('selected'));
                this.classList.add('selected');
            });
            
            iconSelector.appendChild(iconOption);
        });

        // 獲取選中的圖標URL
        function getSelectedIconUrl() {
            const selected = document.querySelector('.icon-option.selected');
            return selected ? selected.dataset.iconUrl : iconOptions[0].url;
        }

        // Function to generate road-based trajectory in Taiwan
        function generateRoadTrajectory() {
            const roadPaths = {
                'sat001': [ // Path from Taipei to Taoyuan
                    [25.0330, 121.5654], // Taipei
                    [25.0200, 121.4800],
                    [24.9900, 121.4200],
                    [24.9600, 121.3500], // Taoyuan
                ],
                'sat002': [ // Path from Kaohsiung to Pingtung
                    [22.6333, 120.2667], // Kaohsiung
                    [22.6000, 120.2900],
                    [22.5700, 120.3200],
                    [22.5400, 120.3500], // Pingtung
                ],
                'sat003': [ // Path from Taichung to Changhua
                    [24.1477, 120.6736], // Taichung
                    [24.1200, 120.6600],
                    [24.0900, 120.6450],
                    [24.0600, 120.6300], // Changhua
                ],
                'sat004': [ // Path from Hualien to Taitung
                    [23.9769, 121.6047], // Hualien
                    [23.9000, 121.5800],
                    [23.8200, 121.5500],
                    [23.7400, 121.5200], // Taitung
                ]
            };
            return roadPaths;
        }

        // Device data with road-based trajectories and cultivated area
        const devices = {
            'sat001': {
                name: '亞太6號',
                id: 'SAT-001',
                machineId: 'AGRI-001',
                position: [25.0330, 121.5654], // Taipei
                status: 'online',
                speed: '3.07 km/s',
                uptime: { days: 519, hours: 0, minutes: 32, seconds: 15 },
                expiry: '2025-12-31',
                trajectory: generateRoadTrajectory()['sat001'],
                iconUrl: iconOptions[0].url,
                cultivatedArea: '120.5 公頃'
            },
            'sat002': {
                name: '中星12號',
                id: 'SAT-002',
                machineId: 'AGRI-002',
                position: [22.6333, 120.2667], // Kaohsiung
                status: 'online',
                speed: '3.07 km/s',
                uptime: { days: 449, hours: 13, minutes: 45, seconds: 22 },
                expiry: '2024-10-15',
                trajectory: generateRoadTrajectory()['sat002'],
                iconUrl: iconOptions[1].url,
                cultivatedArea: '85.2 公頃'
            },
            'sat003': {
                name: '鑫諾3號',
                id: 'SAT-003',
                machineId: 'AGRI-003',
                position: [24.1477, 120.6736], // Taichung
                status: 'warning',
                speed: '3.07 km/s',
                uptime: { days: 355, hours: 22, minutes: 18, seconds: 7 },
                expiry: '2023-11-30',
                trajectory: generateRoadTrajectory()['sat003'],
                iconUrl: iconOptions[2].url,
                cultivatedArea: '65.8 公頃'
            },
            'sat004': {
                name: '亞太7號',
                id: 'SAT-004',
                machineId: 'AGRI-004',
                position: [23.9769, 121.6047], // Hualien
                status: 'offline',
                speed: '3.07 km/s',
                uptime: { days: 638, hours: 8, minutes: 42, seconds: 56 },
                expiry: '2023-06-30',
                trajectory: generateRoadTrajectory()['sat004'],
                iconUrl: iconOptions[3].url,
                cultivatedArea: '45.0 公頃'
            }
        };

        // Add markers to map
        const markers = {};
        Object.keys(devices).forEach(deviceId => {
            const device = devices[deviceId];
            const customIcon = L.icon({
                iconUrl: device.iconUrl,
                iconSize: [32, 32],
                iconAnchor: [16, 16],
                popupAnchor: [0, -16]
            });
            
            markers[deviceId] = L.marker(device.position, { 
                icon: customIcon,
                deviceId: deviceId
            }).addTo(map);
            
            // Add popup with position info and cultivated area
            markers[deviceId].bindPopup(`
                <b>${device.name} (${device.id})</b><br>
                農機識別碼: ${device.machineId}<br>
                狀態: ${device.status === 'online' ? '<span style="color:#2ecc71">正常運作</span>' : 
                      (device.status === 'warning' ? '<span style="color:#f39c12">部分功能異常</span>' : 
                      '<span style="color:#e74c3c">離線</span>')}<br>
                經緯度: 緯 ${device.position[0].toFixed(4)}°, 經 ${device.position[1].toFixed(4)}°<br>
                速度: ${device.speed}<br>
                總耕作面積: ${device.cultivatedArea}<br>
                到期日: ${device.expiry}
            `);

            // Add click event to marker to trigger device selection
            markers[deviceId].on('click', () => {
                const deviceItem = document.querySelector(`.device-item[data-device-id="${deviceId}"]`);
                if (deviceItem) {
                    deviceItem.click();
                }
            });
        });

        // Function to format uptime
        function formatUptime(uptime) {
            return `${uptime.days} 天 ${uptime.hours} 小時 ${uptime.minutes} 分 ${uptime.seconds} 秒`;
        }

        // Device selection
        document.querySelectorAll('.device-item').forEach(item => {
            item.addEventListener('click', function() {
                document.querySelectorAll('.device-item').forEach(i => i.classList.remove('active'));
                this.classList.add('active');

                const deviceId = this.getAttribute('data-device-id');
                const device = devices[deviceId];

                // Update details panel
                document.getElementById('detail-title').textContent = `${device.name} (${device.id})`;
                
                const statusElement = document.getElementById('detail-status');
                statusElement.textContent = device.status === 'online' ? '正常運作' : 
                                           (device.status === 'warning' ? '部分功能異常' : '離線');
                statusElement.className = 'detail-value ' + device.status;
                
                // Show position with 4 decimal places
                document.getElementById('detail-position').textContent = 
                    `緯度: ${device.position[0].toFixed(4)}°, 經度: ${device.position[1].toFixed(4)}°`;
                
                document.getElementById('detail-speed').textContent = device.speed;
                document.getElementById('detail-expiry').textContent = device.expiry;
                document.getElementById('detail-area').textContent = device.cultivatedArea;

                // Show details panel
                document.getElementById('deviceDetails').style.display = 'block';

                // Center map on device
                map.setView(device.position, 8);

                // Highlight the selected marker
                Object.values(markers).forEach(marker => {
                    if (marker.options.deviceId === deviceId) {
                        marker.setZIndexOffset(1000);
                    } else {
                        marker.setZIndexOffset(0);
                    }
                });

                // Show alert for offline device
                if (device.status === 'offline') {
                    alert(`警告: ${device.name} (${device.id}) 處於離線狀態\n最後已知位置: 緯度 ${device.position[0].toFixed(4)}°, 經度 ${device.position[1].toFixed(4)}°`);
                }

                // Close sidebar on mobile after selection
                if (window.innerWidth <= 992) {
                    document.querySelector('.sidebar').classList.remove('active');
                }
            });
        });

        // Trajectory animation variables
        let animationInterval = null;
        let currentTrajectory = null;
        let currentMarker = null;
        let trajectoryPolyline = null;

        // Function to animate trajectory
        function animateTrajectory(deviceId, trajectory, speed = 200) {
            // Clear any existing animation
            if (animationInterval) {
                clearInterval(animationInterval);
            }
            
            // Remove previous trajectory and marker if they exist
            if (trajectoryPolyline) {
                map.removeLayer(trajectoryPolyline);
            }
            if (currentMarker) {
                map.removeLayer(currentMarker);
            }
            
            // Initialize polyline with only the first point
            trajectoryPolyline = L.polyline([trajectory[0]], {
                color: '#ff5722',
                weight: 5,
                opacity: 0.9,
                dashArray: '5, 5'
            }).addTo(map);
            
            // Create a marker for the moving position
            const device = devices[deviceId];
            const customIcon = L.icon({
                iconUrl: device.iconUrl,
                iconSize: [32, 32],
                iconAnchor: [16, 16],
                popupAnchor: [0, -16]
            });
            
            currentMarker = L.marker(trajectory[0], {
                icon: customIcon,
                zIndexOffset: 1000
            }).addTo(map);
            
            // Set up animation
            let currentIndex = 0;
            currentTrajectory = trajectory;
            
            // Update timeline slider
            const timelineSlider = document.getElementById('trajectory-timeline');
            timelineSlider.max = trajectory.length - 1;
            timelineSlider.value = 0;
            
            // Animation function
            function animateStep() {
                if (currentIndex >= trajectory.length - 1) {
                    clearInterval(animationInterval);
                    return;
                }
                
                currentIndex++;
                currentMarker.setLatLng(trajectory[currentIndex]);
                trajectoryPolyline.addLatLng(trajectory[currentIndex]);
                timelineSlider.value = currentIndex;
            }
            
            // Start animation
            animationInterval = setInterval(animateStep, speed);
        }

                animateTrajectory(deviceId, devices[deviceId].trajectory, 200);
            }
        });

        document.getElementById('pause-trajectory').addEventListener('click', function() {
            if (animationInterval) {
                clearInterval(animationInterval);
                animationInterval = null;
            }
        });

        // Stop trajectory button
        document.getElementById('stop-trajectory').addEventListener('click', function() {
            if (animationInterval) {
                clearInterval(animationInterval);
                animationInterval = null;
            }
            
            if (trajectoryPolyline) {
                map.removeLayer(trajectoryPolyline);
                trajectoryPolyline = null;
            }
            
            if (currentMarker) {
                map.removeLayer(currentMarker);
                currentMarker = null;
            }
            
            document.getElementById('trajectory-timeline').value = 0;
        });

        // Timeline slider control
        document.getElementById('trajectory-timeline').addEventListener('input', function(e) {
            if (!currentTrajectory || !currentMarker) return;

<script>
    // 1. 拿到 detail panel 裡的「刪除設備」按鈕
    const deleteBtn = document.getElementById('delete-device-btn');
  
    deleteBtn.addEventListener('click', async () => {
      // a. 先確認哪一個 .device-item 正在被選中
      const activeItem = document.querySelector('.device-item.active');
      if (!activeItem) {
        alert('請先選擇要刪除的設備');

      }
      const deviceId = activeItem.getAttribute('data-device-id');
  
      // b. 二次確認
      if (!confirm(`確定要刪除設備 ${deviceId} 嗎？此操作無法復原！`)) {
        return;
      }
  
      try {
        // c. 用 fetch 呼叫後端刪除接口（這裡傳 JSON）
        const res = await fetch('php/delete_device.php', {
          method: 'POST',
          credentials: 'include',      // 一定要帶，才能讓 PHP 拿到 session
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ device_id: deviceId })
        });
        const data = await res.json();
  
        if (!data.success) {
          alert('刪除失敗：' + data.message);
          return;

        // d. 刪除成功，前端移除 marker & 列表項目 & 隱藏 detail panel
        if (markers[deviceId]) {
          map.removeLayer(markers[deviceId]);
          delete markers[deviceId];
        }
        activeItem.remove();
        document.getElementById('deviceDetails').style.display = 'none';
  
        // 如果有正在跑的軌跡動畫，也一起清理
        if (animationInterval) {

          map.removeLayer(trajectoryPolyline);

          currentMarker = null;

      } catch (err) {
        console.error(err);
        alert('無法連線至伺服器，請稍後再試');
      }
    });

  <script>
        /**
         * loadDevices()：
         *  1. 向後端 php/get_devices.php 發請求
         *  2. 拿回 JSON { success: true, devices: [ { device_name, machine_id, satellite_id, status, latest_lat, latest_lng, expiry_date, cultivated_area }, … ] }
         *  3. 把側邊欄 #deviceList 清空，再為每一筆資料「動態生成 .device-item」並 append
         *  4. 同時在地圖上為每一筆生成一個 marker，並把它存到 markers[satellite_id]
         */
         async function loadDevices() {
            const deviceListContainer = document.getElementById('deviceList');

            try {
                const res = await fetch('php/get_devices.php', {
                    method: 'GET',
                    credentials: 'include'
                });
                const data = await res.json();
                if (!data.success) {
                    alert('載入設備失敗：' + data.message);
                    return;
                }

                // 先把側邊欄裡目前所有項目刪掉
                deviceListContainer.innerHTML = '';

                // 移除 map 上的所有舊 markers
                Object.values(markers).forEach(m => {
                    try { map.removeLayer(m); } catch(e) {}
                });
                // 再把 markers 物件清空
                for (let key in markers) delete markers[key];

                // 如果後端回傳 device 陣列為空，就直接跳出
                if (!Array.isArray(data.devices) || data.devices.length === 0) {
                    return;
                }

                // 把每一筆設備，逐一放到側邊欄 + 加一個 marker 到地圖
                data.devices.forEach(device => {
                    const {
                        device_name,
                        machine_id,
                        satellite_id,
                        status,
                        latest_lat,
                        latest_lng,
                        expiry_date,
                        cultivated_area
                    } = device;

                    // 1) 建立一個新的 .device-item
                    const newItem = document.createElement('div');
                    newItem.classList.add('device-item');
                    // 狀態：online / warning / offline
                    newItem.classList.add(status === 'online' ? 'status-online' : (status === 'warning' ? 'warning' : 'offline'));
                    newItem.setAttribute('data-device-id', satellite_id);

                    // 內部 HTML 結構：與你的 CSS 對應
                    newItem.innerHTML = `
                        <span class="device-status ${status === 'online' ? 'status-online' : (status === 'warning' ? 'status-warning' : 'status-offline')}"></span>
                        <div class="device-info">
                            <div class="device-name">${device_name}</div>
                            <div class="device-id">${satellite_id}</div>
                        </div>
                    `;

                    // 2) 把 newItem 加到側邊欄
                    deviceListContainer.appendChild(newItem);

                    // 3) 建立地圖上的 Marker（若經緯度都是 null，可以給一個預設座標，或先不顯示到地圖）
                    let lat = Number(latest_lat);
                    let lng = Number(latest_lng);
                    if (isNaN(lat) || isNaN(lng)) {
                        // 如果沒有最新座標，預設放在整個台灣中心
                        lat = 23.8;
                        lng = 121;
                    }

                    // 用自訂 icon (32×32)，如果你想依狀態或某些欄位分別給 icon，可以改這裡
                    const customIcon = L.icon({
                        iconUrl: defaultIconUrl,
                        iconSize: [32, 32],
                        iconAnchor: [16, 16],
                        popupAnchor: [0, -16]
                    });

                    const marker = L.marker([lat, lng], {
                        icon: customIcon,
                        deviceId: satellite_id
                    }).addTo(map);

                    // 把這個 marker 存到 markers 物件，key = satellite_id
                    markers[satellite_id] = marker;

                    // 給這個 marker 綁一個 popup，內容跟你原本類似
                    marker.bindPopup(`
                        <b>${device_name} (${satellite_id})</b><br>
                        農機識別碼: ${machine_id}<br>
                        狀態: ${status === 'online' ? '<span style="color:#2ecc71">正常運作</span>' :
                            (status === 'warning' ? '<span style="color:#f39c12">部分功能異常</span>' :
                            '<span style="color:#e74c3c">離線</span>')}<br>
                        經緯度: 緯 ${lat.toFixed(4)}°, 經 ${lng.toFixed(4)}°<br>
                        到期日: ${expiry_date}<br>
                        總耕作面積: ${cultivated_area}
                    `);

                    // 4) 為 newItem 加上 click 事件，點下去就「高亮側邊欄那一欄」＋「把地圖定位到此 marker」，並顯示右側明細面板
                    newItem.addEventListener('click', function() {
                        // 移除其他 .device-item 的 active 樣式
                        document.querySelectorAll('.device-item').forEach(el => el.classList.remove('active'));
                        this.classList.add('active');

                        // 找到這個設備的詳細資料物件 (上面就已經在 device 變數裡)
                        document.getElementById('detail-title').textContent = `${device_name} (${satellite_id})`;

                        const statusEl = document.getElementById('detail-status');
                        statusEl.textContent = status === 'online' ? '正常運作' : (status === 'warning' ? '部分功能異常' : '離線');
                        statusEl.className = 'detail-value ' + status;

                        document.getElementById('detail-position').textContent = `緯度: ${lat.toFixed(4)}°, 經度: ${lng.toFixed(4)}°`;
                        // 如果你之前有把 detail-speed、detail-area、detail-expiry 都做在 HTML 裡，就一併設定：
                        document.getElementById('detail-speed').textContent = device.speed || '-- km/s';
                        document.getElementById('detail-expiry').textContent = expiry_date;
                        document.getElementById('detail-area').textContent = cultivated_area;

                        document.getElementById('deviceDetails').style.display = 'block';

                        // 地圖跳到 marker
                        map.setView([lat, lng], 8);
                        // 把該 marker 的圖層層級升高
                        marker.setZIndexOffset(1000);

                        // 如果是 mobile，關閉 sidebar
                        if (window.innerWidth <= 992) {
                            document.querySelector('.sidebar').classList.remove('active');
                        }
                    });

                    // 5) 同時給這個 marker 一個「點擊後觸發側邊欄點擊」的事件
                    marker.on('click', () => {
                        newItem.click();
                    });
                });

            } catch (err) {
                console.error(err);
                alert('載入設備發生錯誤，請稍後再試');
            }
        }

  </script>
