<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>蓋亞星蹤 - 農用入口</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <meta name="mobile-web-app-capable" content="yes">

    <!-- iOS 配置 -->
    <meta name="apple-mobile-web-app-title" content="蓋亞星蹤">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <link rel="apple-touch-icon" sizes="57x57" href="img/icon-57.png">
    <link rel="apple-touch-icon" sizes="72x72" href="img/icon-72.png">
    <link rel="apple-touch-icon" sizes="114x114" href="img/icon-114.png">
    <link rel="apple-touch-icon" sizes="120x120" href="img/icon-120.png">
    <link rel="apple-touch-icon" sizes="144x144" href="img/icon-144.png">
    <link rel="apple-touch-icon" sizes="152x152" href="img/icon-152.png">
    <link rel="apple-touch-icon" sizes="180x180" href="img/icon-180.png">
    <link rel="apple-touch-icon" sizes="360x360" href="img/icon-360.png">
    <!-- 安卓 (PWA) 配置 -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a2a6c">
    <!-- SEO 配置 -->
    <meta name="keywords" content="衛星定位, GPS 追蹤, GNSS, IoT 衛星物聯網, 即時位置, 物流車隊管理, 寵物追蹤器, 智慧農業, 無人機路徑監控, 資產追蹤, 冷鏈監控, 戶外安全定位, 智慧項圈, 車輛導航, 登山救援, 低功耗感測器, 雲端數據分析, 寵物智慧穿戴, 精準農業, 測位服務, 產業 4.0, 衛星追蹤平台">
    <meta name="description" content="一站式衛星定位平台 🚀 整合 GNSS 與 IoT 技術，提供物流車隊、農機、無人機、寵物與戶外人員的即時位置追蹤與數據分析，操作簡單、低功耗、高精度，讓你隨時掌握資產與毛孩動態，安全又省心！">
    <meta name="author" content="蓋亞營運軟體有限公司">
    <meta name="robots" content="index, follow">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-text-size-adjust: 100%;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', 'Microsoft JhengHei', Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
            background: #0a0f2b;
            color: #fff;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        #threeCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .gps-background {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 30rem;
            color: rgba(52, 152, 219, 0.1);
            animation: gpsPulse 10s ease-in-out infinite, gpsRotate 60s linear infinite;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes gpsPulse {
            0%, 100% { opacity: 0.1; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 0.15; transform: translate(-50%, -50%) scale(1.05); }
        }

        @keyframes gpsRotate {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        .form-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            width: 500px;
            max-width: 90%;
            perspective: 1000px;
        }

        .form-box {
            background: rgba(26, 42, 108, 0.85);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 0 50px rgba(52, 152, 219, 0.4);
            transition: transform 0.6s ease;
            transform-style: preserve-3d;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .form-box.login {
            transform: rotateY(0deg);
        }

        .form-box.register {
            transform: rotateY(180deg);
        }

        .form-box .form-content {
            display: none;
        }

        .form-box.login .login-form,
        .form-box.register .register-form {
            display: block;
        }

        .login-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
            animation: pulse 3s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .login-logo i {
            font-size: 2.5rem;
            color: #fdbb2d;
            margin-right: 15px;
            filter: drop-shadow(0 0 10px #fdbb2d);
        }

        .login-logo span {
            font-size: 2rem;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .form-group {
            position: relative;
            margin-bottom: 25px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.3s ease;
            -webkit-user-select: auto;
            user-select: auto;
        }

        .form-group input:focus {
            box-shadow: 0 0 15px rgba(52, 152, 219, 0.7);
            background: rgba(255, 255, 255, 0.2);
        }

        .form-group label {
            position: absolute;
            top: 50%;
            left: 15px;
            transform: translateY(-50%);
            font-size: 0.9rem;
            color: #b0c4de;
            pointer-events: none;
            transition: all 0.3s ease;
        }

        .form-group input:focus + label,
        .form-group input:not(:placeholder-shown) + label {
            top: -12px;
            left: 10px;
            font-size: 0.75rem;
            color: #fdbb2d;
            background: rgba(26, 42, 108, 0.8);
            padding: 0 5px;
        }

        .action-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(45deg, #3498db, #fdbb2d);
            color: #fff;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            transform-style: preserve-3d;
            perspective: 1000px;
            filter: drop-shadow(0 0 10px rgba(52, 152, 219, 0.5));
        }

        .action-btn:hover {
            transform: rotateY(10deg) scale(1.1);
            box-shadow: 0 0 30px rgba(52, 152, 219, 0.8);
        }

        .action-btn:active {
            transform: scale(0.95);
        }

        .action-btn i {
            margin-right: 8px;
        }

        .toggle-link {
            color: #fdbb2d;
            font-size: 0.9rem;
            cursor: pointer;
            margin-top: 15px;
            display: inline-block;
            transition: all 0.3s ease;
        }

        .toggle-link:hover {
            text-shadow: 0 0 10px #fdbb2d;
        }

        .error-message,
        .success-message {
            font-size: 0.85rem;
            margin-top: 15px;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s ease;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
        }

        .error-message {
            color: #e74c3c;
        }

        .success-message {
            color: #2ecc71;
        }

        .error-message.show,
        .success-message.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* 響應式設計 */
        @media (max-width: 768px) {
            .form-container {
                width: calc(100% - 40px);
            }

            .form-box {
                padding: 25px;
            }

            .gps-background {
                font-size: 20rem;
            }
        }

        @media (max-width: 576px) {
            .form-box {
                padding: 20px;
            }

            .login-logo span {
                font-size: 1.6rem;
            }

            .login-logo i {
                font-size: 2rem;
            }

            .form-group input,
            .action-btn {
                font-size: 0.85rem;
            }

            .gps-background {
                font-size: 15rem;
            }
        }
    </style>
</head>
<body>
    <i class="fas fa-satellite gps-background"></i>
    <canvas id="threeCanvas"></canvas>
    <div class="form-container">
        <div class="form-box login" id="formBox">
            <div class="login-form form-content">
                <div class="login-logo">
                    <i class="fas fa-satellite"></i>
                    <span>蓋亞星蹤-農用</span>
                </div>
                <form id="loginForm">
                    <div class="form-group">
                        <input type="text" id="loginUsername"  name="loginUsername" placeholder=" " required>
                        <label for="loginUsername">帳號</label>
                    </div>
                    <div class="form-group">
                        <input type="password" id="loginPassword" name="loginPassword" placeholder=" " required>
                        <label for="loginPassword">密碼</label>
                    </div>
                    <button type="submit" class="action-btn">
                        <i class="fas fa-sign-in-alt"></i> 登入
                    </button>
                    <div class="error-message" id="loginError">帳號或密碼錯誤，請重新嘗試！</div>
                    <div class="toggle-link" id="toRegister">還沒有帳號？立即註冊</div>
                </form>
            </div>
            <div class="register-form form-content">
                <div class="login-logo">
                    <i class="fas fa-user-plus"></i>
                    <span>註冊表單</span>
                </div>
                <form id="registerForm">
                    <div class="form-group">
                        <input type="text" id="registerUsername" name="registerUsername"  placeholder=" " required>
                        <label for="registerUsername">帳號</label>
                    </div>
                    <div class="form-group">
                        <input type="password" id="registerPassword"  name="registerPassword"   placeholder=" " required>
                        <label for="registerPassword">密碼</label>
                    </div>
                    <div class="form-group">
                        <input type="tel" id="registerPhone"  name="registerPhone"  placeholder=" " required pattern="[0-9]{10}">
                        <label for="registerPhone">電話</label>
                    </div>
                    <div class="form-group">
                        <input type="text" id="registerCompany"  name="registerCompany"  placeholder=" " required>
                        <label for="registerCompany">廠商名稱</label>
                    </div>
                    <button type="submit" class="action-btn">
                        <i class="fas fa-user-plus"></i> 註冊身份
                    </button>
                    <div class="success-message" id="registerSuccess">註冊成功！請使用新帳號登錄。</div>
                    <div class="error-message" id="registerError">註冊失敗，請檢查輸入！</div>
                    <div class="toggle-link" id="toLogin">已有帳號？返回登錄</div>
                </form>
            </div>
        </div>
    </div>

  
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script>
        // 初始化Three.js星雲背景
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('threeCanvas'), alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        camera.position.z = 50;

        const particleCount = window.innerWidth < 576 ? 1500 : 4000;
        const particlesGeometry = new THREE.BufferGeometry();
        const posArray = new Float32Array(particleCount * 3);

        for (let i = 0; i < particleCount * 3; i++) {
            posArray[i] = (Math.random() - 0.5) * 200;
        }

        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particlesMaterial = new THREE.PointsMaterial({
            size: 0.1,
            color: 0xffffff,
            transparent: true,
            opacity: 0.6,
            blending: THREE.AdditiveBlending
        });

        const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particlesMesh);

        let mouseX = 0, mouseY = 0;
        document.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth) * 2 - 1;
            mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
        });

        function animateThree() {
            requestAnimationFrame(animateThree);
            particlesMesh.rotation.y += 0.001;
            particlesMesh.rotation.x = mouseY * 0.1;
            particlesMesh.rotation.z = mouseX * 0.1;
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
        });

        animateThree();


        // 表單切換
        const formBox = document.getElementById('formBox');
        document.getElementById('toRegister').addEventListener('click', () => {
            formBox.classList.remove('login');
            formBox.classList.add('register');
        });

        document.getElementById('toLogin').addEventListener('click', () => {
            formBox.classList.remove('register');
            formBox.classList.add('login');
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const form = e.currentTarget;
  const errorEl = document.getElementById('loginError');
  const fd = new FormData(form);

  try {
    const res = await fetch('php/login.php', {
      method: 'POST',
      body: fd,
      credentials: 'include'     // 把 PHP session cookie 包回來
    });
    const data = await res.json();
    if (data.success) {
      // 把顯示名稱先存起來，index.php 一載入就能讀
      localStorage.setItem('company', data.company);
      // 音效跑完再跳頁
      setTimeout(() => window.location.href = 'index.html', 400);
    } else {
      errorEl.textContent = data.message;
      errorEl.classList.add('show');
      setTimeout(() => errorEl.classList.remove('show'), 3000);
    }
  } catch (err) {
    console.error(err);
    errorEl.textContent = '伺服器或網路異常';
    errorEl.classList.add('show');
    setTimeout(() => errorEl.classList.remove('show'), 3000);
  }
});



// 註冊處理：呼叫後端 register.php
document.getElementById('registerForm').addEventListener('submit', async e => {
  e.preventDefault();
  const form    = e.currentTarget;
  const errorEl = document.getElementById('registerError');
  const successEl = document.getElementById('registerSuccess');
  const fd      = new FormData(form);

  // 先清掉上一回的狀態
  errorEl.classList.remove('show');
  successEl.classList.remove('show');

  try {
    const res  = await fetch('php/register.php', {
      method: 'POST',
      body:   fd,
      credentials: 'include'
    });
    const data = await res.json();

    if (data.success) {
      successEl.textContent = data.message;
      successEl.classList.add('show');
      // 3 秒後自動跳回登入
      setTimeout(() => {
        successEl.classList.remove('show');
        formBox.classList.replace('register','login');
      }, 3000);

    } else {
      errorEl.textContent = data.message;
      errorEl.classList.add('show');
      setTimeout(() => errorEl.classList.remove('show'), 3000);
    }
  } catch (err) {
    console.error(err);
    errorEl.textContent = '網路或伺服器錯誤，請稍後重試';
    errorEl.classList.add('show');
    setTimeout(() => errorEl.classList.remove('show'), 3000);
  }
});


        // 頁面加載動畫
        window.addEventListener('load', () => {
            const formContainer = document.querySelector('.form-container');
            formContainer.style.opacity = '0';
            setTimeout(() => {
                formContainer.style.transition = 'opacity 1s ease';
                formContainer.style.opacity = '1';
            }, 500);
        });
    </script>
</body>
</html>
