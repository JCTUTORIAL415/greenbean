<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>師傅管理後台</title>
  <!-- 引入 Tailwind CSS -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet" />
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; display: flex; background: #f4f4f4; }
    .sidebar { width: 250px; height: 100vh; background-color: #34D399; color: white; position: fixed; left: 0; top: 0; display: flex; flex-direction: column; font-size: 24px; transition: transform 0.3s ease-in-out; z-index: 50; }
    .sidebar a { padding: 0.75rem 1.25rem; color: white; text-decoration: none; font-size: 16px; transition: background 0.3s; }
    .sidebar a:hover, .sidebar .active { background-color: #059669; }
    .sidebar-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 40; display: none; }
    .sidebar-overlay.show { display: block; }
    .main-content { margin-left: 260px; width: calc(100% - 260px); padding: 20px; display: flex; flex-wrap: wrap; gap: 20px; }
    .container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); flex: 1; min-width: 400px; }
    h1 { text-align: center; color: #2e7d32; font-size: 1.5rem; font-weight: 700; }
    .search-bar { margin-bottom: 15px; }
    .search-bar input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
    .input-group { margin-bottom: 15px; }
    .input-group label { font-weight: bold; display: block; margin-bottom: 5px; }
    .input-group input, .input-group select { width: 95%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; transition: border-color 0.3s; }
    .input-group input:focus, .input-group select:focus { border-color: #34D399; outline: none; }
    .btn { width: 100%; padding: 12px; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; color: white; cursor: pointer; transition: 0.3s; }
    .btn.submit { background: #34D399; box-shadow: 0 4px 6px rgba(52,211,153,0.3); }
    .btn.submit:hover { background: #059669; }
    .btn.cancel { background: #e53935; margin-top: 10px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 12px; border: 1px solid #ddd; text-align: center; }
    th { background: #a5d6a7; position: sticky; top: 0; }
    tbody tr:hover { background: #f1f8e9; }
    .delete-btn { background: #e53935; color: white; padding: 6px 12px; border: none; border-radius: 20px; cursor: pointer; transition: 0.3s; }
    .delete-btn:hover { background: #c62828; }
    .hidden { display: none; }
    @media (max-width: 768px) { .main-content { margin-left: 0; width: 100%; padding: 10px; flex-direction: column; } .sidebar { transform: translateX(-100%); } .sidebar.open { transform: translateX(0); } }
  </style>
</head>
<body>
  <button onclick="toggleSidebar()" class="sidebar-toggle w-12 fixed top-4 left-4 bg-green-500 text-white p-2 rounded lg:hidden z-1000">☰</button>
  <div class="sidebar" id="sidebar">
    <div class="text-center py-6 font-bold text-2xl">秧苗場管理</div>
    <a href="index.html">首頁</a>
    <a href="seedling.html">秧苗製成與管理</a>
    <a href="calender.html">插秧排程</a>
    <a href="Shipment.html">出貨單</a>
    <a href="TransplantingList.html">插秧單</a>
    <a href="harvest.html">割稻單</a>
    <a href="customer.html">客戶管理</a>
    <a href="workerManage.html" class="active">師傅管理</a>
    <a href="payment.html">收錢管理</a>
    <a href="profile.html">秧苗場個人檔案設定</a>
    <a href="#">登出</a>
  </div>
  <div id="sidebar-overlay" class="sidebar-overlay" onclick="toggleSidebar()"></div>

  <div class="main-content">
    <div class="container">
      <h1>新增師傅</h1>
      <form id="worker-form">
        <div class="input-group">
          <label for="name">名字：</label>
          <input type="text" id="name" required>
        </div>
        <div class="input-group">
          <label for="role">角色：</label>
          <select id="role" required>
            <option value="">請選擇角色</option>
            <option>插秧師傅</option>
            <option>割稻師傅</option>
            <option>載穀司機</option>
            <option>小工</option>
          </select>
        </div>
        <div class="input-group">
          <label for="account-type">帳號類型：</label>
          <select id="account-type">
            <option value="無">無</option>
            <option value="出貨單">出貨單</option>
            <option value="插秧單">插秧單</option>
            <option value="收割單">收割單</option>
          </select>
        </div>
        <div class="input-group hidden" id="account-group">
          <label for="account">帳號：</label>
          <input type="text" id="account">
        </div>
        <div class="input-group hidden" id="password-group">
          <label for="password">密碼：</label>
          <input type="password" id="password">
        </div>
        <div class="input-group">
          <label for="phone">電話：</label>
          <input type="text" id="phone" required>
        </div>
        <div class="input-group">
          <label for="address">住址：</label>
          <input type="text" id="address" required>
        </div>
        <button type="submit" class="btn submit">新增師傅</button>
      </form>
    </div>

    <div class="container">
      <h1>師傅資料</h1>
      <button class="btn cancel mb-4">清除本期紀錄</button>
      <div class="search-bar">
        <input type="text" id="search-input" placeholder="搜尋師傅...">
      </div>
      <div class="overflow-x-auto">
        <table id="worker-table">
          <thead>
            <tr>
              <th>帳號</th><th>密碼</th><th>名字</th><th>角色</th><th>帳號類型</th><th>電話</th><th>住址</th><th>操作</th>
            </tr>
          </thead>
          <tbody>
            <tr><td>worker01</td><td>worker01</td><td>張三</td><td>插秧師傅</td><td>插秧單</td><td>0912-345-678</td><td>台中市</td><td><button class="delete-btn" onclick="deleteRow(this)">刪除</button></td></tr>
            <tr><td>-</td><td>-</td><td>李四</td><td>割稻師傅</td><td>無</td><td>0987-654-321</td><td>台北市</td><td><button class="delete-btn" onclick="deleteRow(this)">刪除</button></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
      document.getElementById('sidebar-overlay').classList.toggle('show');
    }
    const accountTypeSelect = document.getElementById('account-type');
    accountTypeSelect.addEventListener('change', function() {
      document.getElementById('account-group').classList.toggle('hidden', this.value==='無');
      document.getElementById('password-group').classList.toggle('hidden', this.value==='無');
    });
    document.getElementById('worker-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const name = document.getElementById('name').value;
      const role = document.getElementById('role').value;
      const accountType = document.getElementById('account-type').value;
      const account = accountType==='無'?'-':document.getElementById('account').value;
      const password =accountType==='無'?'-':document.getElementById('password').value;
      const phone = document.getElementById('phone').value;
      const address = document.getElementById('address').value;
      const tbody = document.querySelector('#worker-table tbody');
      const row = tbody.insertRow();
      row.innerHTML = `<td>${account}</td><td>${password}</td><td>${name}</td><td>${role}</td><td>${accountType}</td><td>${phone}</td><td>${address}</td><td><button class="delete-btn" onclick="deleteRow(this)">刪除</button></td>`;
      alert(`師傅 ${name} 已新增`);
      this.reset();
      document.getElementById('account-group').classList.add('hidden');
      document.getElementById('password-group').classList.add('hidden');
    });
    function deleteRow(btn) {
      if (confirm('確定要刪除此師傅帳號？此操作不可復原！')) {
        btn.closest('tr').remove();
      }
    }
    document.getElementById('search-input').addEventListener('keyup', function() {
      const filter = this.value.toUpperCase();
      document.querySelectorAll('#worker-table tbody tr').forEach(tr => {
        tr.style.display = Array.from(tr.cells).slice(0,-1).some(td => td.textContent.toUpperCase().includes(filter)) ? '' : 'none';
      });
    });
  </script>
</body>
</html>
