<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工人管理後台</title>
    <style>
        /* 全局樣式 */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            background: #f4f4f4;
        }

        /* 側邊欄 */
        .sidebar {
            width: 250px;
            height: 100vh;
            background-color: #34D399;
            color: white;
            position: fixed;
            left: 0;
            top: 0;
            display: flex;
            flex-direction: column;
            /* padding-top: 20px; */
            font-size: 24px;
    
        }
        .sidebar a {
            padding: 12px 20px;
            color: white;
            text-decoration: none;
            font-size: 16px;
            transition: background 0.3s;
        }
        .sidebar a:hover,
        .sidebar .active {
            background-color: #059669;
        }

        #title-text{
            text-align: center;
            margin-bottom:22px;
            font-weight: bold;
            padding-top: 23px;
        }
        /* 主要內容區域 */
        .main-content {
            margin-left: 260px;
            width: calc(100% - 260px);
            padding: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        /* 卡片設計 */
        .container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            flex: 1;
            min-width: 400px;
        }

        h1, h2 {
            text-align: center;
            color: #2e7d32;
        }

        /* 表單 */
        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }

        .input-group input {
            width: 95%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            transition: border-color 0.3s;
        }
        .input-group input:focus {
            border-color: #34D399;
            outline: none;
        }

        /* 按鈕 */
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn.submit {
            background: #34D399;
            box-shadow: 0 4px 6px rgba(52, 211, 153, 0.3);
        }
        .btn.submit:hover {
            background: #059669;
        }
        .btn.cancel {
            background: #e53935;
            margin-top: 10px;
        }

        /* 表格 */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: center;
        }
        th {
            background: #a5d6a7;
            position: sticky;
            top: 0;
        }
        tbody tr:hover {
            background: #f1f8e9;
        }

        /* 刪除按鈕 */
        .delete-btn {
            background: #e53935;
            color: white;
            padding: 6px 12px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.3s;
        }
        .delete-btn:hover {
            background: #c62828;
        }

        /* 響應式設計 */
        @media (max-width: 768px) {
            .main-content {
                margin-left: 0;
                width: 100%;
                padding: 10px;
                flex-direction: column;
            }
            .sidebar {
                display: none;
            }
        }
    </style>
</head>
<body>

  <!-- 側邊欄 -->
<div class="sidebar">
    <div class="text-center py-6 font-bold text-2xl" id="title-text">秧苗場管理</div>
    <a href="calender.html">插秧排程</a>
    <a href="workerManage.html"  class="active">插秧工人管理</a>
    <a href="TransplantingList.html">插秧單</a>
    <a href="Shipment.html">出貨單</a>
    <a href="harvest.html">割稻管理</a>
    <a href="customer.html">客戶管理</a>
    <a href="profile.html" class="active">秧苗場個人檔案設定</a>
    <a href="#">登出</a>
</div>


    <!-- 主要內容 -->
    <div class="main-content">
        <div class="container">
            <h1>新增插秧工人</h1>
            <form id="worker-form">
                <div class="input-group">
                    <label for="account">帳號：</label>
                    <input type="text" id="account" required>
                </div>
                <div class="input-group">
                    <label for="password">密碼：</label>
                    <input type="password" id="password" required>
                </div>
                <div class="input-group">
                    <label for="name">名字：</label>
                    <input type="text" id="name" required>
                </div>
                <div class="input-group">
                    <label for="phone">電話：</label>
                    <input type="text" id="phone" required>
                </div>
                <div class="input-group">
                    <label for="address">住址：</label>
                    <input type="text" id="address" required>
                </div>
                <button type="submit" class="btn submit">新增工人</button>
            </form>
        </div>

        <div class="container">
            <h2>工人資料</h2>
            <table id="worker-table">
                <thead>
                    <tr>
                        <th>帳號</th>
                        <th>密碼</th>
                        <th>名字</th>
                        <th>電話</th>
                        <th>住址</th>
                        <th>刪除</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>worker01</td>
                        <td>worker01</td>
                        <td>張三</td>
                        <td>0912-345-678</td>
                        <td>台中市</td>
                        <td><button class="delete-btn" onclick="deleteRow(this)">刪除</button></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        document.getElementById('worker-form').addEventListener('submit', function(event) {
            event.preventDefault();
            const name = document.getElementById('name').value;
            alert(`${name} 已成功新增！`);
            document.getElementById('worker-form').reset();
        });

        function deleteRow(button) {
            button.parentElement.parentElement.remove();
        }
    </script>

</body>
</html>
