<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>插秧排程</title>
  <!-- Tailwind CSS -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet" />
  <!-- Hammer.js 用於觸控滑動 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>
  <style>
    /* === 側邊欄（統一樣式）=== */
    .sidebar {
      width: 250px;
      height: 100vh;
      background-color: #34D399;
      color: white;
      position: fixed;
      left: 0;
      top: 0;
      transition: transform 0.3s ease-in-out;
      z-index: 50;
    }
    .sidebar a {
      display: block;
      padding: 1rem 1.25rem;
      color: white;
      text-decoration: none;
      font-size: 1rem;
      transition: background-color 0.3s;
    }
    .sidebar a:hover {
      background-color: #059669;
    }
    .sidebar .active {
      background-color: #059669;
    }
    /* === 側邊欄遮罩 === */
    .sidebar-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 40;
      display: none;
    }
    .sidebar-overlay.show {
      display: block;
    }
    /* === 手機版設定 === */
    @media (max-width: 768px) {
      .sidebar {
        transform: translateX(-100%);
      }
      .sidebar.open {
        transform: translateX(0);
      }
    }
    
    /* ==========================================================================
       CSS RESET - 清除所有瀏覽器預設樣式
       ========================================================================== */
    select,
    input[type="date"] {
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
      background-color: #fff;
      border: 1px solid #ccc;
      padding: 10px;
      border-radius: 4px;
      font-family: inherit;
    }
    html, body, div, span, applet, object, iframe,
    h1, h2, h3, h4, h5, h6, p, blockquote, pre,
    a, abbr, acronym, address, big, cite, code,
    del, dfn, em, img, ins, kbd, q, s, samp,
    small, strike, strong, sub, sup, tt, var,
    b, u, i, center,
    dl, dt, dd, ol, ul, li,
    fieldset, form, label, legend,
    table, caption, tbody, tfoot, thead, tr, th, td,
    article, aside, canvas, details, embed, 
    figure, figcaption, footer, header, hgroup, 
    menu, nav, output, ruby, section, summary,
    time, mark, audio, video {
      margin: 0;
      padding: 0;
      border: 0;
      font-size: 100%;
      font: inherit;
      vertical-align: baseline;
    }
    article, aside, details, figcaption, figure, 
    footer, header, hgroup, menu, nav, section {
      display: block;
    }
    body {
      line-height: 1;
      -webkit-text-size-adjust: 100%;
      -ms-text-size-adjust: 100%;
    }
    ol, ul {
      list-style: none;
    }
    blockquote, q {
      quotes: none;
    }
    blockquote:before, blockquote:after,
    q:before, q:after {
      content: '';
      content: none;
    }
    table {
      border-collapse: collapse;
      border-spacing: 0;
    }
    
    /* === 其他基本樣式及頁面排版 === */
    button {
      height: 40px;
    }
    .calendar-day {
      min-height: 120px;
      transition: all 0.3s;
      padding: 0.5rem;
    }
    .calendar-day:hover {
      background-color: #f0f9ff;
    }
    .schedule-item {
      font-size: 0.75rem;
      padding: 0.25rem 0.5rem;
      margin: 0.125rem 0;
      border-radius: 0.25rem;
      background-color: #93c5fd;
      color: #1e40af;
    }
    .over-limit {
      background-color: #fca5a5;
      color: #991b1b;
      font-weight: bold;
    }
    .calendar-container {
      flex-grow: 1;
      padding: 1.25rem;
      background-color: #f9fafb;
      min-height: 100vh;
      margin-left: 250px;
      transition: margin-left 0.3s ease-in-out;
      width: calc(100% - 250px);
    }
    .desktop-calendar {
      background-color: #ffffff;
      border-radius: 0.5rem;
      box-shadow: 0 0.625rem 1.25rem rgba(0,0,0,0.1);
      overflow: hidden;
      margin-bottom: 1.25rem;
    }
    .daily-limit-desktop {
      margin-bottom: 1.5rem;
    }
    @media (max-width: 768px) {
      .calendar-container {
        margin-left: 0;
        width: 100%;
      }
      .desktop-calendar {
        display: none;
      }
      .mobile-date-picker {
        display: block;
        margin-bottom: 1.5rem;
      }
      #monthTitle {
        display: none;
      }
    }
    @media (min-width: 769px) {
      #mobileCardContainer {
        display: none;
      }
    }
    /* === 輸入組 === */
    .input-group {
      display: flex;
      flex-direction: column;
      margin-bottom: 1rem;
    }
    .input-group label {
      font-weight: bold;
      margin-bottom: 0.25rem;
      font-size: 1rem;
    }
    .input-group input,
    .input-group select,
    .input-group textarea {
      padding: 0.75rem;
      border: 1px solid #ccc;
      border-radius: 0.5rem;
      font-size: 1rem;
      transition: 0.3s;
    }
    /* === 手機大卡片 (Swipe) === */
    #mobileCardContainer {
      display: block;
      position: relative;
      min-height: 400px;
      overflow-y: visible;
    }
    #mobileCard {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      background: linear-gradient(135deg, #93c5fd, #c7d2fe);
      border-radius: 0.5rem;
      box-shadow: 0 10px 15px rgba(0,0,0,0.1);
      padding: 2.5rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow-y: auto;
      transition: transform 0.7s ease-in-out;
    }
    #mobileCard:hover {
      transform: scale(1.02);
    }
    @media (min-width: 769px) {
      #mobileCardContainer {
        display: none;
      }
    }
  </style>
</head>
<body class="bg-gray-50">
  <!-- 側邊欄與主要內容 -->
  <div class="flex">
    <!-- 手機側邊欄 Toggle 按鈕 -->
    <button onclick="toggleSidebar()" class="sidebar-toggle fixed top-4 left-4 bg-green-500 text-white p-2 rounded lg:hidden z-1000">☰</button>
    <!-- 側邊欄 -->
    <div class="sidebar" id="sidebar">
      <div class="text-center py-6 font-bold text-2xl">秧苗場管理</div>
      <a href="calender.html" class="active">插秧排程</a>
      <a href="workerManage.html">插秧工人管理</a>
      <a href="TransplantingList.html">插秧單</a>
      <a href="Shipment.html">出貨單</a>
      <a href="harvest.html">割稻管理</a>
      <a href="customer.html">客戶管理</a>
      <a href="profile.html">秧苗場個人檔案設定</a>
      <a href="#">登出</a>
    </div>
    <!-- 手機側邊欄 Toggle 按鈕 (重複) -->
    <button onclick="toggleSidebar()" class="sidebar-toggle w-12 fixed top-4 left-4 bg-green-500 text-white p-2 rounded lg:hidden z-50">☰</button>
    <!-- 側邊欄遮罩 -->
    <div id="sidebar-overlay" class="sidebar-overlay" onclick="toggleSidebar()"></div>
    <!-- 主要內容容器 -->
    <div class="calendar-container">
      <!-- 桌機版：月份選擇與每日上限輸入 -->
      <div class="flex justify-between items-center mb-6">
        <div class="flex items-center space-x-4">
          <button onclick="changeMonth(-1)" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600 hidden lg:block">◀ 上個月</button>
          <h2 id="monthTitle" class="text-2xl font-bold">2025年 2月</h2>
          <button onclick="changeMonth(1)" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600 hidden lg:block">下個月 ▶</button>
        </div>
        <div class="flex space-x-4">
          <button onclick="showAddSchedule()" class="bg-green-500 text-white px-6 py-2 rounded hover:bg-green-600" id="addSchedule">新增排程</button>
        </div>
      </div>
      <!-- 每日上限輸入 (桌機版) -->
      <div class="daily-limit-desktop mb-6 hidden lg:block">
        <label for="dailyLimit" class="block text-sm font-medium mb-1">每日排程上限 (甲):</label>
        <input type="number" id="dailyLimit" class="w-full p-2 border rounded" value="10" onchange="updateDailyLimit()" />
      </div>
      <!-- 桌機版日曆 -->
      <div class="bg-white rounded-lg shadow overflow-hidden desktop-calendar">
        <div class="grid grid-cols-7 bg-gray-100">
          <div class="py-2 text-center font-bold text-red-600">日</div>
          <div class="py-2 text-center font-bold">一</div>
          <div class="py-2 text-center font-bold">二</div>
          <div class="py-2 text-center font-bold">三</div>
          <div class="py-2 text-center font-bold">四</div>
          <div class="py-2 text-center font-bold">五</div>
          <div class="py-2 text-center font-bold text-red-600">六</div>
        </div>
        <div id="calendar" class="grid grid-cols-7 border-t">
          <!-- 日期格子由 JS 產生 -->
        </div>
      </div>
      <!-- 手機版：日期選擇與每日上限輸入 -->
      <div class="mobile-date-picker mb-6 lg:hidden">
        <label for="mobileDate" class="block text-sm font-medium mb-1">選擇日期:</label>
        <input type="date" id="mobileDate" class="w-full p-2 border rounded" onchange="onMobileDateChange()" />
      </div>
      <div class="mb-4 lg:hidden">
        <label for="mobileDailyLimit" class="block text-sm font-medium mb-1">每日排程上限 (甲):</label>
        <input type="number" id="mobileDailyLimit" class="w-full p-2 border rounded" value="10" onchange="updateDailyLimitMobile()" />
      </div>
      <!-- 手機版大卡片 -->
      <div id="mobileCardContainer" class="lg:hidden mt-6">
        <!-- 手機行程卡片由 JS 動態建立 -->
      </div>
    </div>
  </div>

  <!-- 新增排程 Modal -->
  <div id="addScheduleModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center">
    <div class="bg-white p-6 rounded-lg w-96">
      <h3 class="text-xl font-bold mb-4">新增插秧排程</h3>
      <form class="space-y-4">
        <div class="input-group">
          <label for="scheduleDate">日期</label>
          <input type="date" id="scheduleDate" class="w-full p-2 border rounded">
        </div>
        <div class="input-group">
          <label for="farmer_name">農民名稱</label>
          <select id="farmer_name" class="w-full p-2 border rounded">
            <option value="">請選擇農民</option>
            <option value="李農">李農</option>
            <option value="陳農">陳農</option>
            <option value="大農">大農</option>
          </select>
        </div>
        <div class="input-group">
          <label for="farm">選擇地塊</label>
          <select id="farm" class="w-full p-2 border rounded">
            <option value="">請選擇田地</option>
            <option value="地點A">地點A</option>
            <option value="地點B">地點B</option>
            <option value="未知">未知（需手動輸入）</option>
          </select>
        </div>
        <div class="input-group">
          <label for="notes">備註 (選填)</label>
          <textarea id="notes" class="w-full p-2 border rounded"></textarea>
        </div>
        <div class="flex space-x-4">
          <button type="button" onclick="hideAddSchedule()" class="bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600 w-1/2">取消</button>
          <button type="button" onclick="addSchedule()" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600 w-1/2">確定</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 每日排程 Modal -->
  <div id="dailyScheduleModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center">
    <div class="bg-white p-6 rounded-lg w-96">
      <h3 id="dailyScheduleTitle" class="text-xl font-bold mb-4"></h3>
      <div id="dailyScheduleContent" class="space-y-2"></div>
      <div class="flex space-x-2 mt-4">
        <button onclick="hideDailySchedule()" class="bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600 flex-1">關閉</button>
        <button onclick="printDailySchedule()" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600 flex-1">列印</button>
      </div>
    </div>
  </div>

  <script>
    // 側邊欄 Toggle 函式
    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebar-overlay');
      sidebar.classList.toggle('open');
      overlay.classList.toggle('show');
      const toggleButtons = document.querySelectorAll('.sidebar-toggle');
      if (sidebar.classList.contains('open')) {
        toggleButtons.forEach(btn => { btn.style.display = 'none'; });
      } else {
        toggleButtons.forEach(btn => { btn.style.display = 'block'; });
      }
    }
  </script>
  <!-- calender.js -->
  <script src="calender.js"></script>
</body>
</html>
