<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>側邊欄範例</title>
  <!-- Tailwind CSS -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet" />
  <style>
    /* === 側邊欄 === */
    .sidebar {
      width: 250px;
      height: 100vh;
      background-color: #34D399;
      color: white;
      position: fixed;
      left: 0;
      top: 0;
      transition: transform 0.3s ease-in-out;
      z-index: 50;
    }
    .sidebar a {
      display: block;
      padding: 1rem 1.25rem;
      color: white;
      text-decoration: none;
      font-size: 1rem;
      transition: background-color 0.3s;
    }
    .sidebar a:hover {
      background-color: #059669;
    }
    .sidebar .active {
      background-color: #059669;
    }
    /* === 側邊欄遮罩 === */
    .sidebar-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 40;
      display: none;
    }
    .sidebar-overlay.show {
      display: block;
    }
    /* === 手機版設定 === */
    @media (max-width: 768px) {
      .sidebar {
        transform: translateX(-100%);
      }
      .sidebar.open {
        transform: translateX(0);
      }
    }
  </style>
</head>
<body class="bg-gray-50">
  <!-- 手機側邊欄 Toggle 按鈕 -->
  <button onclick="toggleSidebar()" class="sidebar-toggle fixed top-4 left-4 bg-green-500 text-white p-2 rounded lg:hidden z-1000">☰</button>
  <!-- 側邊欄 -->
  <div class="sidebar" id="sidebar">
    <div class="text-center py-6 font-bold text-2xl">秧苗場管理</div>
    <a href="calender.html" class="active">插秧排程</a>
    <a href="workerManage.html">插秧工人管理</a>
    <a href="TransplantingList.html">插秧單</a>
    <a href="Shipment.html">出貨單</a>
    <a href="harvest.html">割稻管理</a>
    <a href="customer.html">客戶管理</a>
    <a href="#">登出</a>
  </div>
  <!-- 手機側邊欄 Toggle 按鈕 (重複) -->
  <button onclick="toggleSidebar()" class="sidebar-toggle w-12 fixed top-4 left-4 bg-green-500 text-white p-2 rounded lg:hidden z-50">☰</button>
  <!-- 側邊欄遮罩 -->
  <div id="sidebar-overlay" class="sidebar-overlay" onclick="toggleSidebar()"></div>

  <script>
    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebar-overlay');
      sidebar.classList.toggle('open');
      overlay.classList.toggle('show');
      const toggleButtons = document.querySelectorAll('.sidebar-toggle');
      if (sidebar.classList.contains('open')) {
        toggleButtons.forEach(btn => { btn.style.display = 'none'; });
      } else {
        toggleButtons.forEach(btn => { btn.style.display = 'block'; });
      }
    }
  </script>
</body>
</html>
