
<!DOCTYPE html>
<html lang="zh-TW">
<head>

<style>
body {

.receipt-container {

padding: 1rem;

background: #fff;

.receipt-row {
display: flex;
align-items: center;
margin-bottom: 0.5rem;

width: 70%;

.signature-img {
max-width: 100%;

margin: 0 auto;

transform: rotate(0deg);

#signature-modal {
background: rgba(0, 0, 0, 0.8);
display: none;
position: fixed;
top: 0; left: 0;
width: 100%; height: 100%;
justify-content: center;
align-items: center;
z-index: 2000;
    }
#signature-modal.active { display: flex; }
.signature-modal-content {
background: white;
width: 90%;
max-width: 600px;
height: 50vh;
padding: 20px;
border-radius: 10px;
display: flex;
flex-direction: column;

#signature-canvas {
width: 100%;
height: calc(50vh - 80px);
border: 1px solid #ccc;
background: #f9fafb;
touch-action: none;
    }
.edit-modal-content .record-item {
border: 1px solid #ddd;

margin-bottom: 12px;
border-radius: 5px;
    }
.btn-edit, .btn-delete {
background: #2196f3;
color: white;
border: none;
border-radius: 8px;
cursor: pointer;
transition: 0.3s;
box-sizing: border-box;
margin: 8px 0;
    }
.btn-delete { background: #f44336; }
.field-link {
color: #3b82f6;
text-decoration: none;
font-size: 12px;
    }
.field-link:hover {
text-decoration: underline;
    }
.field-no-link {
color: #f44336;
font-size: 12px;
    }
#farmer-suggestions {
z-index: 1000;
max-width: 100%;
font-size: 14px;
    }
#planting-field-checkboxes {
padding: 12px;
font-size: 14px;
line-height: 1.5;
    }
.flex.space-x-4 {
gap: 16px;
    }
.stats-container {
background: #f1f8e9;
padding: 20px;
border-radius: 10px;
margin: 20px auto;
max-width: 600px;
    }
.stats-container h2 {
font-size: 20px;
margin-bottom: 15px;
    }
.stats-container p {
font-size: 14px;
margin: 5px 0;
    }
.tab-content.active {
display: block;
    }
.tab-content {
display: none;
    }
.temp-records-container {
background: #f1f8e9;
padding: 20px;
border-radius: 10px;
margin-top: 20px;
    }
.temp-records-container h3 {
font-size: 18px;
margin-bottom: 10px;
    }
.accordion {
background-color: #eee;
color: #444;
cursor: pointer;
padding: 18px;
width: 100%;
border: none;
text-align: left;
outline: none;
font-size: 15px;
transition: 0.4s;
  }
.active-accordion, .accordion:hover {
background-color: #ccc;
  }
.panel {
padding: 0 18px;
display: none;
background-color: white;
overflow: hidden;
  }
@media print {
.receipt-container {
width: 80mm;
margin: 0;
padding: 1rem;
box-shadow: none;
font-size: 16px;
      }
body * {
visibility: hidden;
      }
#receipt-area, #receipt-area * {
visibility: visible;
      }
#receipt-area {
position: absolute;
left: 0;
top: 0;
width: 80mm;
      }
    }
@media (max-width: 768px) {
.container, .stats-container {
width: 95%;
margin: 16px auto;
      }
.signature-modal-content {
width: 90%;
height: 60vh;
padding: 20px;
      }
#signature-canvas {
width: 100%;
height: calc(60vh - 100px);
      }
    }
</style>
</head>
<body>
<div class="container">
<h1>收割師傅儀表板</h1>
<form id="planting-form" novalidate>
<div class="input-group">
<label for="planting-farmer">農民名稱</label>
<input type="text" id="planting-farmer" placeholder="輸入農民名稱搜尋..." />
<div id="farmer-suggestions" class="absolute bg-white w-full border rounded mt-1 max-h-40 overflow-y-auto hidden"></div>
</div>
<div class="flex space-x-4 mb-4">
<button type="button" class="btn submit flex-1" onclick="showTab('database-fields')">田地資料</button>
<button type="button" class="btn submit flex-1" onclick="showTab('add-field')">新增臨時田地</button>
</div>
<div id="database-fields" class="tab-content">
<div class="input-group">
<label>田地選擇 (可複選)</label>
<div id="planting-field-checkboxes" class="max-h-40 overflow-y-auto border p-2 rounded"></div>
<!-- <button type="button" id="update-location-btn" class="btn submit mt-2" onclick="getLocation('planting')">更新當前地標</button> -->
</div>
<div class="input-group">
<label for="planting-area">面積 (分)</label>
<input type="number" id="planting-area" step="0.01" />
</div>
<div class="input-group">
<label class="checkbox-label">
<input type="checkbox" id="planting-self-transport" checked />
          是否含載穀
</label>
</div>
<div class="input-group">
<label for="planting-remarks">備註</label>
<textarea id="planting-remarks" placeholder="輸入備註..."></textarea>
</div>
<div class="flex space-x-4">
<button type="button" class="btn submit" onclick="savePlantingField()">儲存田地</button>
<button type="submit" class="btn submit">提交所有記錄並開收據</button>
</div>
</div>
<div id="add-field" class="tab-content">
<div class="input-group">
<label for="new-field-name">田地名稱</label>
<input type="text" id="new-field-name" required placeholder="輸入田地名稱..." />
</div>
<div class="input-group">
<label for="new-field-area">面積 (分)</label>
<input type="number" id="new-field-area" step="0.01" required />
</div>
<div class="input-group">
<label for="new-field-remarks">備註</label>
<textarea id="new-field-remarks" placeholder="輸入備註..."></textarea>
</div>
<div class="input-group">
<label for="new-field-lat">經度</label>
<input type="number" id="new-field-lat" step="any" placeholder="輸入經度..." />
</div>
<div class="input-group">
<label for="new-field-lng">緯度</label>
<input type="number" id="new-field-lng" step="any" placeholder="輸入緯度..." />
</div>
<button type="button" class="btn submit" onclick="getLocation('new-field')">更新當前地標</button>
<div class="flex justify-end mt-4 space-x-4">
<button class="btn submit" onclick="saveNewField()">儲存</button>
<button class="btn cancel" onclick="showTab('database-fields')">取消</button>
</div>
</div>
</form>
<div class="temp-records-container">
<h3>已儲存田地資料 (最新在上)</h3>
<div id="temp-records-list"></div>
</div>
</div>
<div class="container record-container">
<h2>過去收割紀錄</h2>
<div class="flex flex-col sm:flex-row gap-4 mb-4">
<input type="text" id="search" placeholder="搜尋農民..." class="w-full p-2 border rounded" />
<select id="date-filter-mode" class="p-2 border rounded">
<option value="all">顯示全部</option>
<option value="today">顯示當天</option>
<option value="select">選擇一個日期</option>
</select>
<input type="date" id="date-filter-select" class="p-2 border rounded hidden" />
</div>
<div id="record-list"></div>
<button class="btn submit mt-4" onclick="generateReceipt()">生成選取收據</button>
</div>
<div class="stats-container">
<h2>統計資料</h2>
<div id="stats-area"></div>
</div>
<div id="receipt-modal" class="modal">
<div class="modal-content">
<div id="receipt-area"></div>
<div class="flex justify-end mt-4 space-x-4">
<label class="mr-2">列印份數:</label>
<input type="number" id="print-copies" min="1" value="1" class="w-16 p-1 border rounded" />
<button class="btn submit" onclick="downloadReceipt()">下載收據</button>
<button class="btn cancel" onclick="closeModal()">關閉</button>
</div>
</div>
</div>
<div id="signature-modal" class="modal">
<div class="signature-modal-content">
<canvas id="signature-canvas"></canvas>
<div class="mt-4 flex space-x-4 justify-center">
<button class="btn submit" onclick="saveSignature()">儲存</button>
<button class="btn cancel" onclick="clearSignature()">清除</button>
<button class="btn cancel" onclick="closeSignatureModal()">取消</button>
</div>
</div>
</div>
<div id="edit-modal" class="modal">
<div class="edit-modal-content">
<h2 id="edit-modal-title" class="text-center">編輯田地記錄</h2>
<div id="edit-records-list"></div>
<div class="flex justify-end mt-4">
<button class="btn cancel" onclick="closeEditModal()">關閉</button>
</div>
</div>
</div>
<script>
let records = [
      { type: "planting", date: "2025-03-28", farmer: "王大哥", phone: "0912345678", land: "田區A", area: 50, selfTransport: false, worker: "老李", remarks: "無特殊要求", hasReceipt: false },
      { type: "planting", date: "2025-03-29", farmer: "陳農", phone: "0987654321", land: "田地A", area: 30, selfTransport: true, worker: "小陳", remarks: "需快速完成", hasReceipt: false },
      { type: "planting", date: "2025-03-30", farmer: "林子怡", phone: "0927040169", land: "田地1", area: 40, selfTransport: false, worker: "阿明", remarks: "注意排水", hasReceipt: false },
      { type: "planting", date: "2025-04-01", farmer: "張小明", phone: "0976543210", land: "田地2", area: 60, selfTransport: true, worker: "老王", remarks: "無", hasReceipt: false }
];
let tempPlantingRecords = [];
let currentReceiptId = '';
let farmersData = {
"王大哥": {
phone: "0912345678",
fields: [
          { name: "田區A", area: 50, unit: "分", remarks: "靠近河邊", coords: { lat: 23.5, lng: 121.0 } },
          { name: "田區B", area: 40, unit: "分", remarks: "土壤肥沃", coords: { lat: 23.6, lng: 121.2 } },
          { name: "田區C", area: 60, unit: "分", remarks: "無", coords: { lat: 23.7, lng: 121.3 } },
          { name: "田區D", area: 70, unit: "分", remarks: "無", coords: { lat: 0, lng: 0 } } // 示例無地標田地
]
      },
"陳農": {
phone: "0987654321",
fields: [
          { name: "田地A", area: 30, unit: "分", remarks: "需灌溉", coords: { lat: 23.6, lng: 121.2 } },
          { name: "田地B", area: 50, unit: "分", remarks: "無", coords: { lat: 23.8, lng: 121.4 } }
]
      },
"林子怡": {
phone: "0927040169",
fields: [
          { name: "田地1", area: 40, unit: "分", remarks: "排水良好", coords: { lat: 23.8, lng: 121.4 } },
          { name: "田地2", area: 50, unit: "分", remarks: "無", coords: { lat: 24.0, lng: 121.6 } }
]
      },
"張小明": {
phone: "0976543210",
fields: [
          { name: "田地2", area: 60, unit: "分", remarks: "靠近公路", coords: { lat: 23.9, lng: 121.5 } },
          { name: "田地3", area: 45, unit: "分", remarks: "無", coords: { lat: 24.1, lng: 121.7 } }
]
      }
    };
function initializeFarmerAutocomplete() {
const input = document.getElementById('planting-farmer');
const suggestions = document.getElementById('farmer-suggestions');
input.addEventListener('input', () => {
const value = input.value.toLowerCase();
suggestions.innerHTML = '';
if (!value) {
suggestions.classList.add('hidden');
return;
        }
const matches = Object.keys(farmersData).filter(farmer =>
farmer.toLowerCase().includes(value) ||
farmersData[farmer].phone.includes(value)
        );
matches.forEach(farmer => {
const div = document.createElement('div');
div.className = 'p-2 hover:bg-gray-100 cursor-pointer';
div.textContent = `${farmer} (${farmersData[farmer].phone})`;
div.onclick = () => {
input.value = farmer;
showTab('database-fields');
suggestions.classList.add('hidden');
          };
suggestions.appendChild(div);
        });
suggestions.classList.toggle('hidden', !matches.length);
      });
document.addEventListener('click', e => {
if (!suggestions.contains(e.target) && e.target !== input) {
suggestions.classList.add('hidden');
        }
      });
    }
function showTab(tabId) {
document.querySelectorAll('.tab-content').forEach(tab => {
tab.classList.remove('active');
      });
document.getElementById(tabId).classList.add('active');
if (tabId === 'database-fields') {
const farmer = document.getElementById('planting-farmer').value;
loadFieldCheckboxes(farmer);
      } else if (tabId === 'add-field') {
const farmer = document.getElementById('planting-farmer').value;
if (!farmer || !farmersData[farmer]) {
alert('請先選擇一位農民');
showTab('database-fields');
return;
        }
const fieldNames = farmersData[farmer].fields.map(f => f.name);
let defaultName = '田地A';
if (fieldNames.includes('田地A') && !fieldNames.includes('田地B')) {
defaultName = '田地B';
        } else if (fieldNames.includes('田地A') && fieldNames.includes('田地B') && !fieldNames.includes('田地C')) {
defaultName = '田地C';
        }
document.getElementById('new-field-name').value = defaultName;
document.getElementById('new-field-area').value = '';
document.getElementById('new-field-remarks').value = '';
document.getElementById('new-field-lat').value = '';
document.getElementById('new-field-lng').value = '';
      }
    }
function loadFieldCheckboxes(farmer) {
const container = document.getElementById('planting-field-checkboxes');
container.innerHTML = '';
if (farmer && farmersData[farmer]) {
farmersData[farmer].fields.forEach(field => {
const div = document.createElement('div');
div.className = 'flex items-center mb-2';
const remarksText = field.remarks || '無';
const hasCoords = field.coords && field.coords.lat && field.coords.lng && field.coords.lat !== 0 && field.coords.lng !== 0;
let fieldNameDisplay;
if (hasCoords) {
const query = encodeURIComponent(`${field.coords.lat},${field.coords.lng}`);
fieldNameDisplay = `<a href="https://www.google.com/maps/search/?api=1&query=${query}&basemap=satellite" target="_blank" class="field-link text-blue-600">${field.name}</a>`;
} else {
fieldNameDisplay = `<span class="text-red-600 field-no-link">${field.name}</span>`;
}
div.innerHTML = `
            <input type="checkbox" value="${field.name}" class="mr-2" onchange="updateUI()">
            <label>${fieldNameDisplay}：${field.area}分 (${remarksText})</label>
          `;
container.appendChild(div);
        });
      }
updateUI();
    }
function updateUI() {
  const checked = document.querySelectorAll('#planting-field-checkboxes input:checked');
  const areaInput = document.getElementById('planting-area');
  const updateBtn = document.getElementById('update-location-btn');
  const farmer = document.getElementById('planting-farmer').value;
  let totalArea = 0;
  checked.forEach(cb => {
    const field = farmersData[farmer].fields.find(f => f.name === cb.value);
    if (field) {
      totalArea += field.area;
    }
  });
  areaInput.value = totalArea.toFixed(2);
  areaInput.readOnly = checked.length > 1;
  if (updateBtn) {
    updateBtn.disabled = checked.length !== 1;
  }
}
function getLocation(context) {
if (navigator.geolocation) {
navigator.geolocation.getCurrentPosition(position => {
let lat = position.coords.latitude;
let lng = position.coords.longitude;
if (context === 'planting') {
const farmer = document.getElementById('planting-farmer').value;
const checkedFields = document.querySelectorAll('#planting-field-checkboxes input:checked');
if (checkedFields.length === 0) {
alert('請先選擇至少一個田地');
return;
            }
if (checkedFields.length > 1) {
alert('只能更新單一田地的地標');
return;
            }
if (confirm('確定更新選中田地的經緯度？')) {
checkedFields.forEach(field => {
const fieldData = farmersData[farmer].fields.find(f => f.name === field.value);
if (fieldData) {
fieldData.coords = { lat, lng };
                }
              });
loadFieldCheckboxes(farmer);
alert('田地經緯度已更新');
            }
          } else if (context === 'new-field') {
document.getElementById('new-field-lat').value = lat;
document.getElementById('new-field-lng').value = lng;
alert('地標已更新');
          }
        }, () => alert("獲取地標失敗！"));
      } else {
alert("瀏覽器不支援地理定位！");
      }
    }
function saveNewField() {
const farmer = document.getElementById('planting-farmer').value;
const name = document.getElementById('new-field-name').value.trim();
const area = parseFloat(document.getElementById('new-field-area').value);
const remarks = document.getElementById('new-field-remarks').value;
const lat = parseFloat(document.getElementById('new-field-lat').value) || 0;
const lng = parseFloat(document.getElementById('new-field-lng').value) || 0;
if (!name) {
alert('請填寫田地名稱');
return;
      }
if (isNaN(area) || area <= 0) {
alert('請填寫有效的面積');
return;
      }
if (farmersData[farmer].fields.some(f => f.name === name)) {
alert('田地名稱已存在，請使用其他名稱');
return;
      }
if (!farmersData[farmer].fields) {
farmersData[farmer].fields = [];
      }
farmersData[farmer].fields.push({
name,
area,
unit: '分',
remarks: remarks || '無',
coords: { lat, lng }
      });

function savePlantingField() {
const farmer = document.getElementById('planting-farmer').value;
const checkedFields = Array.from(document.querySelectorAll('#planting-field-checkboxes input:checked'));
const area = parseFloat(document.getElementById('planting-area').value);
const selfTransport = document.getElementById('planting-self-transport').checked;
const remarks = document.getElementById('planting-remarks').value || '無';
if (!farmer || !farmersData[farmer]) {
alert('請選擇一位農民');
return;
      }
if (!checkedFields.length) {
alert('請至少選擇一個田地');
return;
      }
if (isNaN(area) || area <= 0) {
alert('請填寫有效的面積（大於0）');
return;
      }
for (const field of checkedFields) {
if (!farmersData[farmer].fields.find(f => f.name === field.value)) {
alert(`田地 "${field.value}" 不存在於農民 "${farmer}" 的資料中`);
return;
        }
      }
let changes = [];
const updateArea = checkedFields.length === 1;
if (updateArea) {
  const fieldData = farmersData[farmer].fields.find(f => f.name === checkedFields[0].value);
  const oldArea = fieldData.area;
  const newArea = area;
  if (oldArea !== newArea) {
    changes.push(`田地: ${fieldData.name}\n舊面積: ${oldArea}分 -> 新面積: ${newArea}分`);
  }
  if (changes.length > 0) {
    const confirmMessage = `確定更改田地資料？\n\n${changes.join('\n\n')}`;
    if (!confirm(confirmMessage)) {
      return;
    }
  }
  fieldData.area = area;
}
const savedFields = [];
checkedFields.forEach(field => {

    type: 'planting',
    date,
    farmer,
    phone,
    land: field.value,
    area: recordArea,
    selfTransport,
    worker,
    remarks
  };

  savedFields.push(field.value);
  console.log(`Saved record for field "${field.value}":`, record);
});
console.log('Current tempPlantingRecords:', tempPlantingRecords);

async function downloadReceipt() {
try {
const { jsPDF } = window.jspdf;
const areaElem = document.getElementById('receipt-area');
const copies = parseInt(document.getElementById('print-copies').value) || 1;
areaElem.style.height = 'auto';
areaElem.style.maxHeight = 'none';
areaElem.style.overflow = 'visible';
areaElem.style.width = '80mm';
const canvas = await html2canvas(areaElem, {
scale: window.devicePixelRatio || 2,
useCORS: true,
scrollX: 0,
scrollY: 0,
width: areaElem.offsetWidth,
height: areaElem.scrollHeight,
windowWidth: areaElem.offsetWidth,
windowHeight: areaElem.scrollHeight
        });
const imgData = canvas.toDataURL('image/png');
const pdf = new jsPDF('p', 'mm', [80, canvas.height * 80 / canvas.width]);
const pdfWidth = 80;
const pdfHeight = (canvas.height * pdfWidth) / canvas.width;
for (let i = 0; i < copies; i++) {
pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
if (i < copies - 1) pdf.addPage();
        }
pdf.save('planting_receipt.pdf');
// Mark selected records as hasReceipt: true
const checkboxes = document.querySelectorAll('#record-list input[data-index]:checked');
checkboxes.forEach(cb => {
const index = cb.dataset.index;
records[index].hasReceipt = true;
        });
renderRecords();
closeModal();
      } catch (error) {
console.error('PDF generation error:', error);
alert('生成收據PDF時發生錯誤，請檢查控制台並重試');
      }
    }

function saveSignature() {

const tempCanvas = document.createElement('canvas');
tempCanvas.width = canvas.height;
tempCanvas.height = canvas.width;
const tempCtx = tempCanvas.getContext('2d');
tempCtx.translate(0, canvas.width);
tempCtx.rotate(-Math.PI / 2);
tempCtx.drawImage(canvas, 0, 0);
const signatureData = tempCanvas.toDataURL('image/png');
const img = document.getElementById(`signature-${currentReceiptId}`);

img.style.display = 'block';

function clearSignature() {

const ctx = canvas.getContext('2d');

    }
function initializeSignatureCanvas() {
const canvas = document.getElementById('signature-canvas');
canvas.width = 560;
canvas.height = 300;
const ctx = canvas.getContext('2d');
ctx.lineWidth = 5;
ctx.strokeStyle = '#000';
ctx.lineCap = 'round';
ctx.clearRect(0, 0, canvas.width, canvas.height);
let isDrawing = false;
let lastX = 0;
let lastY = 0;
function getPosition(e) {
const rect = canvas.getBoundingClientRect();
const scaleX = canvas.width / rect.width;
const scaleY = canvas.height / rect.height;
if (e.type.includes('touch')) {
return {
x: (e.touches[0].clientX - rect.left) * scaleX,
y: (e.touches[0].clientY - rect.top) * scaleY
          };
        }
return {
x: (e.clientX - rect.left) * scaleX,
y: (e.clientY - rect.top) * scaleY
        };
      }
function startDrawing(e) {
e.preventDefault();
isDrawing = true;
const pos = getPosition(e);
lastX = pos.x;
lastY = pos.y;
ctx.beginPath();
ctx.moveTo(lastX, lastY);
      }
function draw(e) {
if (!isDrawing) return;
e.preventDefault();
const pos = getPosition(e);
ctx.lineTo(pos.x, pos.y);
ctx.stroke();
lastX = pos.x;
lastY = pos.y;
      }
function stopDrawing() {
isDrawing = false;
      }
canvas.removeEventListener('mousedown', startDrawing);
canvas.removeEventListener('mousemove', draw);
canvas.removeEventListener('mouseup', stopDrawing);
canvas.removeEventListener('touchstart', startDrawing);
canvas.removeEventListener('touchmove', draw);
canvas.removeEventListener('touchend', stopDrawing);
canvas.addEventListener('mousedown', startDrawing);
canvas.addEventListener('mousemove', draw);
canvas.addEventListener('mouseup', stopDrawing);
canvas.addEventListener('touchstart', startDrawing);
canvas.addEventListener('touchmove', draw);
canvas.addEventListener('touchend', stopDrawing);
    }
