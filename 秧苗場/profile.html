<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>秧苗場個人檔案設定 - 響應式表單</title>
  <!-- Tailwind CSS -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet" />
  <style>
    html, body, div, span, applet, object, iframe,
    h1, h2, h3, h4, h5, h6, p, blockquote, pre,
    a, abbr, acronym, address, big, cite, code,
    del, dfn, em, img, ins, kbd, q, s, samp,
    small, strike, strong, sub, sup, tt, var,
    b, u, i, center,
    dl, dt, dd, ol, ul, li,
    fieldset, form, label, legend,
    table, caption, tbody, tfoot, thead, tr, th, td,
    article, aside, canvas, details, embed, 
    figure, figcaption, footer, header, hgroup, 
    menu, nav, output, ruby, section, summary,
    time, mark, audio, video {
      margin: 0;
      padding: 0;
      border: 0;
      font-size: 100%;
      font: inherit;
      vertical-align: baseline;
    }
    article, aside, details, figcaption, figure, 
    footer, header, hgroup, menu, nav, section {
      display: block;
    }
    body {
      line-height: 1;
      -webkit-text-size-adjust: 100%;
      -ms-text-size-adjust: 100%;
    }
    ol, ul {
      list-style: none;
    }
    blockquote, q {
      quotes: none;
    }
    blockquote:before, blockquote:after,
    q:before, q:after {
      content: '';
      content: none;
    }
    table {
      border-collapse: collapse;
      border-spacing: 0;
    }
    .sidebar {
      width: 250px;
      height: 100vh;
      background-color: #34D399;
      color: white;
      position: fixed;
      left: 0;
      top: 0;
      transition: transform 0.3s ease-in-out;
      z-index: 50;
    }
    .sidebar a {
      display: block;
      padding: 1rem 1.25rem;
      color: white;
      text-decoration: none;
      font-size: 1rem;
      transition: background-color 0.3s;
    }
    .sidebar a:hover,
    .sidebar a.active {
      background-color: #059669;
    }
    .sidebar-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 40;
      display: none;
    }
    .sidebar-overlay.show {
      display: block;
    }
    button{
      height: 45px;
    }
    @media (max-width: 768px) {
      .sidebar {
        transform: translateX(-100%);
      }
      .sidebar.open {
        transform: translateX(0);
      }
      .sidebar-toggle{
        margin-top: 2px;
        width: 40px;
      }
    }
    .form-container {
      background-color: #ffffff;
      border-radius: 0.5rem;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      padding: 2rem;
    }
    .form-container h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
      color: #333;
    }
    .form-group {
      margin-bottom: 1.25rem;
    }
    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
      color: #4a5568;
    }
    .form-group input,
    .form-group select {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid #e2e8f0;
      border-radius: 0.375rem;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }
    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: #34D399;
      box-shadow: 0 0 0 3px rgba(52, 211, 153, 0.3);
    }
    .btn-delete {
      background-color: #e53e3e;
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 0.375rem;
      color: white;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    .btn-delete:hover {
      background-color: #c53030;
    }
    .btn-add {
      background-color: #4299e1;
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 0.375rem;
      color: white;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    .btn-add:hover {
      background-color: #3182ce;
    }
    .btn-view {
      background-color: #6b7280;
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 0.375rem;
      color: white;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    .btn-view:hover {
      background-color: #4b5563;
    }
    .btn {
      padding: 0.75rem 1.5rem;
      background-color: #34D399;
      color: white;
      border: none;
      border-radius: 0.375rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    .btn:hover {
      background-color: #059669;
    }
  </style>
</head>
<body class="bg-gray-100">
  <!-- 手機版側邊欄 Toggle 按鈕 -->
  <button onclick="toggleSidebar()" class="sidebar-toggle w-12 fixed top-4 left-4 bg-green-500 text-white p-2 rounded lg:hidden z-1000">☰</button>

  <!-- 側邊欄 -->
  <div class="sidebar" id="sidebar">
    <div class="text-center py-6 font-bold text-2xl">秧苗場管理</div>
    <nav>
      <a href="calender.html">插秧排程</a>
      <a href="workerManage.html">師傅管理</a>
      <a href="TransplantingList.html">插秧單</a>
      <a href="Shipment.html">出貨單</a>
      <a href="harvest.html">割稻管理</a>
      <a href="customer.html">客戶管理</a>
      <a href="profile.html" class="active">秧苗場個人檔案設定</a>
      <a href="payment.html">收錢管理</a>
      <a href="seedling.html">秧苗製成與管理</a>
      <a href="#">登出</a>
    </nav>
  </div>
  <!-- 側邊欄遮罩 (手機版) -->
  <div id="sidebar-overlay" class="sidebar-overlay" onclick="toggleSidebar()"></div>

  <!-- 主要內容 (右側) -->
  <div class="md:ml-64 p-4 sm:p-6 md:p-10">
    <div class="max-w-2xl mx-auto">
      <div class="form-container">
        <h1>秧苗場個人檔案設定</h1>
        <form id="profileForm">
          <!-- 苗場名字 -->
          <div class="form-group">
            <label for="nurseryName">苗場名字</label>
            <input type="text" id="nurseryName" name="nurseryName" placeholder="請輸入苗場名字" />
          </div>
          <!-- 秧苗價格 -->
          <div class="form-group">
            <label for="seedlingPrice">秧苗價格(顆)</label>
            <input type="number" id="seedlingPrice" name="seedlingPrice" placeholder="請輸入秧苗價格" />
          </div>
          <!-- 秧苗品種 -->
          <div class="form-group">
            <label for="seedlingTypes">秧苗品種</label>
            <select id="seedlingTypes" name="seedlingType" class="form-group mb-2">
              <option value="">請選擇品種</option>
              <option value="台農71號">台農71號</option>
            </select>
            <div class="flex gap-2">
              <button type="button" onclick="openModal()" class="btn-add">新增品種</button>
              <button type="button" onclick="removeSelectedSeedling()" class="btn-delete">刪除所選品種</button>
              <button type="button" onclick="viewAllSeedlings()" class="btn-view">查看全部品種</button>
            </div>
          </div>
          <!-- 收割每分的價格 -->
          <div class="form-group">
            <label for="harvestPrice">收割每分的價格</label>
            <input type="number" id="harvestPrice" name="harvestPrice" placeholder="請輸入收割每分的價格" />
          </div>
          <!-- 代運的價格 -->
          <div class="form-group">
            <label for="transportPrice">代運的價格</label>
            <input type="number" id="transportPrice" name="transportPrice" placeholder="請輸入代運的價格" />
          </div>
          <!-- 儲存設定 -->
          <div class="flex justify-end">
            <button type="submit" class="btn mt-6">儲存設定</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- 新增品種彈出表單 -->
  <div id="seedlingModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden flex items-center justify-center z-50">
    <div class="bg-white p-6 rounded-lg shadow-lg w-full max-w-md">
      <h2 class="text-xl font-bold mb-4">新增秧苗品種</h2>
      <form id="seedlingForm">
        <div class="form-group">
          <label for="newSeedlingType" class="block mb-2">品種名稱</label>
          <input type="text" id="newSeedlingType" name="newSeedlingType" class="w-full p-2 border rounded" placeholder="請輸入品種名稱" required>
        </div>
        <div class="flex justify-end mt-4">
          <button type="button" onclick="closeModal()" class="btn bg-gray-500 mr-2">取消</button>
          <button type="submit" class="btn">確認新增</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 查看全部品種彈出窗口 -->
  <div id="viewSeedlingModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden flex items-center justify-center z-50">
    <div class="bg-white p-6 rounded-lg shadow-lg w-full max-w-md">
      <h2 class="text-xl font-bold mb-4">所有秧苗品種</h2>
      <ul id="seedlingList" class="list-disc pl-5 mb-4"></ul>
      <div class="flex justify-end">
        <button type="button" onclick="closeViewModal()" class="btn">關閉</button>
      </div>
    </div>
  </div>

  <script>
    // 手機版側邊欄 toggle 功能
    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebar-overlay');
      sidebar.classList.toggle('open');
      overlay.classList.toggle('show');
      const toggleButtons = document.querySelectorAll('.sidebar-toggle');
      if (sidebar.classList.contains('open')) {
        toggleButtons.forEach(btn => { btn.style.display = 'none'; });
      } else {
        toggleButtons.forEach(btn => { btn.style.display = 'block'; });
      }
    }

    // 打開新增品種彈出表單
    function openModal() {
      const select = document.getElementById('seedlingTypes');
      if (select.options.length > 5) {
        alert('品種數量已達上限 (5 個)，請先刪除不需要的品種！');
        return;
      }
      document.getElementById('seedlingModal').classList.remove('hidden');
    }

    // 關閉新增品種彈出表單
    function closeModal() {
      document.getElementById('seedlingModal').classList.add('hidden');
      document.getElementById('seedlingForm').reset();
    }

    // 處理新增品種表單提交
    document.getElementById('seedlingForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const seedlingType = document.getElementById('newSeedlingType').value.trim();
      const select = document.getElementById('seedlingTypes');

      if (seedlingType && !Array.from(select.options).some(opt => opt.value === seedlingType)) {
        if (select.options.length <= 5) {
          const option = document.createElement('option');
          option.value = seedlingType;
          option.text = seedlingType;
          select.appendChild(option);
          closeModal();
        } else {
          alert('品種數量已達上限 (5 個)！');
        }
      } else if (!seedlingType) {
        alert('請輸入品種名稱！');
      } else {
        alert('此品種已存在！');
      }
    });

    // 刪除所選品種
    function removeSelectedSeedling() {
      const select = document.getElementById('seedlingTypes');
      const selectedOption = select.options[select.selectedIndex];
      if (selectedOption && selectedOption.value !== '' && confirm(`確定要刪除品種 "${selectedOption.text}" 嗎？`)) {
        select.remove(select.selectedIndex);
      } else if (!selectedOption || selectedOption.value === '') {
        alert('請先選擇要刪除的品種！');
      }
    }

    // 查看全部品種
    function viewAllSeedlings() {
      const select = document.getElementById('seedlingTypes');
      const seedlingList = document.getElementById('seedlingList');
      seedlingList.innerHTML = ''; // 清空列表
      const options = Array.from(select.options).filter(opt => opt.value !== '');
      
      if (options.length > 0) {
        options.forEach(option => {
          const li = document.createElement('li');
          li.textContent = option.text;
          seedlingList.appendChild(li);
        });
      } else {
        const li = document.createElement('li');
        li.textContent = '目前沒有品種';
        seedlingList.appendChild(li);
      }
      document.getElementById('viewSeedlingModal').classList.remove('hidden');
    }

    // 關閉查看全部品種窗口
    function closeViewModal() {
      document.getElementById('viewSeedlingModal').classList.add('hidden');
    }
  </script>
</body>
</html>
