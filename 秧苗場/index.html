<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>秧苗場管理系統</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            background-color: #4CAF50;
            color: white;
            width: 100%;
            text-align: center;
            padding: 15px 0;
            font-size: 20px;
            position: fixed;
            top: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .user-profile {
            margin-right: 20px;
            position: relative;
            display: flex;
            align-items: center;
            cursor: pointer;
        }
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #fff;
            margin-left: 10px;
            object-fit: cover;
        }
        .dropdown-menu {
            display: none;
            position: absolute;
            top: 50px;
            right: 0;
            background-color: #fff;
            border: 1px solid #4CAF50;
            border-radius: 5px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            padding: 5px 0;
        }
        .dropdown-menu button {
            display: block;
            width: 100%;
            padding: 5px 15px;
            background: none;
            border: none;
            color: #4CAF50;
            text-align: left;
            cursor: pointer;
        }
        .dropdown-menu button:hover {
            background-color: #f0f0f0;
        }
        .container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding: 120px 20px 20px;
            max-width: 400px;
        }
        .icon-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            transition: transform 0.3s;
            text-decoration: none;
            color: inherit;
        }
        .icon-box:hover {
            transform: scale(1.05);
        }
        .icon {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 45px;
            color: white;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            transition: box-shadow 0.3s;
        }
        .icon:hover {
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
        }
        .icon-box p {
            margin: 5px 0 0;
            font-size: 14px;
            color: #333;
        }
        #avatar-upload {
            display: none;
        }

        @media (min-width: 768px) {
            .header {
                font-size: 24px;
                padding: 20px 0;
            }
            .container {
                grid-template-columns: repeat(3, 1fr);
                gap: 30px;
                padding: 120px 20px 20px;
                max-width: 900px;
            }
            .icon {
                width: 120px;
                height: 120px;
                font-size: 60px;
            }
            .icon-box p {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <span style="margin-left: 20px;">秧苗場管理系統</span>
        <div class="user-profile">
            <span>歡迎，王先生!</span>
            <img class="avatar" src="" alt="頭像">
            <div class="dropdown-menu">
                <button onclick="document.getElementById('avatar-upload').click()">編輯頭像</button>
                <button onclick="logout()">登出</button>
            </div>
            <input type="file" id="avatar-upload" accept="image/*">
        </div>
    </div>
    <div class="container">
        <a href="seedling.html" class="icon-box">
            <div class="icon" style="background-color: #A5D6A7;">🌱</div>
            <p>秧苗製成管理</p>
        </a>
        <a href="calender.html" class="icon-box">
            <div class="icon" style="background-color: #FF9800;">📅</div>
            <p>插秧排成</p>
        </a>
        <a href="Shipment.html" class="icon-box">
            <div class="icon" style="background-color: #42A5F5;">🚚</div>
            <p>出貨單</p>
        </a>
        <a href="TransplantingList.html" class="icon-box">
            <div class="icon" style="background-color: #F06292;">📜</div>
            <p>插秧單</p>
        </a>
        <a href="harvest.html" class="icon-box">
            <div class="icon" style="background-color: #FFCA28;">🌾</div>
            <p>割稻單</p>
        </a>
        <a href="payment.html" class="icon-box">
            <div class="icon" style="background-color: #FFD700;">💰</div>
            <p>收錢管理</p>
        </a>
        <a href="customer.html" class="icon-box">
            <div class="icon" style="background-color: #AB47BC;">👥</div>
            <p>客戶管理</p>
        </a>
        <a href="workerManage.html" class="icon-box">
            <div class="icon" style="background-color: #4CAF50;">👨‍🌾</div>
            <p>師傅管理</p>
        </a>
        <a href="profile.html" class="icon-box">
            <div class="icon" style="background-color: #B0BEC5;">⚙️</div>
            <p>樣苗場個人檔案設定</p>
        </a>
    </div>

    <script>
        // 頭像上傳功能
        const avatarUpload = document.getElementById('avatar-upload');
        const avatarImg = document.querySelector('.avatar');

        avatarUpload.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    avatarImg.src = e.target.result;
                }
                reader.readAsDataURL(file);
            }
        });

        // 點擊用戶區域顯示/隱藏下拉選單
        const userProfile = document.querySelector('.user-profile');
        const dropdownMenu = document.querySelector('.dropdown-menu');

        userProfile.addEventListener('click', function() {
            dropdownMenu.style.display = dropdownMenu.style.display === 'block' ? 'none' : 'block';
        });

        // 點擊其他地方關閉下拉選單
        document.addEventListener('click', function(e) {
            if (!userProfile.contains(e.target)) {
                dropdownMenu.style.display = 'none';
            }
        });

        function logout() {
            alert('已登出');
            // window.location.href = 'login.html';
        }
    </script>
</body>
</html>
