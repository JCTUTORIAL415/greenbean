<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>插秧排程</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>
  <style>
    .sidebar {
      width: 250px;
      height: 100vh;
      background-color: #34D399;
      color: white;
      position: fixed;
      left: 0;
      top: 0;
      transition: transform 0.3s ease-in-out;
      z-index: 50;
      overflow-y: auto;
    }
    .sidebar a {
      display: block;
      padding: 1rem 1.25rem;
      color: white;
      text-decoration: none;
      font-size: 1rem;
      transition: background-color 0.3s;
    }
    .sidebar a:hover { background-color: #059669; }
    .sidebar .active { background-color: #059669; }
    .sidebar-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 40;
      display: none;
    }
    .sidebar-overlay.show { display: block; }
    @media (max-width: 768px) {
      .sidebar { transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); }
    }
    select, input[type="date"], input[type="text"] {
      -webkit-appearance: none; -moz-appearance: none; appearance: none;
      background-color: #fff; border: 1px solid #ccc; padding: 10px;
      border-radius: 4px; font-family: inherit;
    }
    html, body, div, span, applet, object, iframe,
    h1, h2, h3, h4, h5, h6, p, blockquote, pre,
    a, abbr, acronym, address, big, cite, code,
    del, dfn, em, img, ins, kbd, q, s, samp,
    small, strike, strong, sub, sup, tt, var,
    b, u, i, center,
    dl, dt, dd, ol, ul, li,
    fieldset, form, label, legend,
    table, caption, tbody, tfoot, thead, tr, th, td,
    article, aside, canvas, details, embed,
    figure, figcaption, footer, header, hgroup,
    menu, nav, output, river, section, summary,
    time, mark, audio, video {
      margin:0; padding:0; border:0; font-size:100%;
      font:inherit; vertical-align:baseline;
    }
    article, aside, details, figcaption, figure, footer, header, hgroup, menu, nav, section { display:block; }
    body { line-height:1; -webkit-text-size-adjust:100%; -ms-text-size-adjust:100%; }
    ol, ul { list-style:none; }
    table { border-collapse:collapse; border-spacing:0; }
    button { height:40px; }
    .calendar-day { min-height:120px; transition:all 0.3s; padding:0.5rem; }
    .calendar-day:hover { background-color:#f0f9ff; }
    .schedule-item { font-size:0.75rem; padding:0.25rem 0.5rem; margin:0.125rem 0; border-radius:0.25rem; background-color:#93c5fd; color:#1e40af; }
    .schedule-item-farm { font-size: 0.65rem; padding: 0.2rem 0.4rem; margin: 0.1rem 0; border-radius: 0.2rem; background-color: #bfdbfe; color: #1e40af; }
    .over-limit { background-color:#fca5a5; color:white; }
    .calendar-container {
      flex-grow:1; padding:1.25rem; background-color:#f9fafb;
      min-height:100vh; margin-left:250px; transition:margin-left 0.3s ease-in-out;
      width:calc(100% - 250px); box-sizing:border-box;
    }
    #desktopCalendar {
      background-color:#ffffff; border-radius:0.5rem;
      box-shadow:0 0.625rem 1.25rem rgba(0,0,0,0.1); overflow:hidden;
      margin-bottom:1.25rem;
    }
    .daily-limit-desktop { margin-bottom:1.5rem; }
    @media (max-width: 768px) {
      .calendar-container { margin-left:0; width:100%; }
      #desktopCalendar { display:none; }
      #mobileCardContainer { display:block; }
      .mobile-month-view #desktopCalendar { display:block; }
      .mobile-month-view #mobileCardContainer { display:none; }
      .mobile-header {
        display:flex; justify-content:center; align-items:center; gap:1rem;
        margin-bottom:1rem; overflow-x:auto; white-space:nowrap; padding:0.5rem 0;
      }
      .mobile-header h2 { font-size:clamp(1.25rem,4vw,1.5rem); font-weight:bold; flex-shrink:0; }
      .mobile-header button { font-size:clamp(0.75rem,2.5vw,1rem); padding:0.5rem 1rem; flex-shrink:0; min-width:100px; }
      .mobile-button-group { display:flex; flex-direction:column; gap:0.5rem; margin-bottom:1rem; }
      .mobile-button-group button { width:100%; text-align:center; }
      .mobile-month-buttons { display:none; flex-direction:column; gap:0.5rem; margin-top:1rem; }
      .mobile-month-view .mobile-month-buttons { display:flex; }
      .mobile-month-view .calendar-day { min-height: 60px; }
    }
    .input-group { display:flex; flex-direction:column; margin-bottom:1rem; }
    .input-group label { font-weight:bold; margin-bottom:0.25rem; font-size:1rem; }
    .input-group input, .input-group textarea {
      padding:0.75rem; border:1px solid #ccc; border-radius:0.5rem; font-size:1rem; transition:0.3s;
    }
    #farmer_suggestions { max-height:200px; overflow-y:auto; z-index:100; }
    #mobileCardContainer { display:none; }
    @media (max-width: 768px) { #mobileCardContainer { display:block; position:relative; min-height:400px; overflow-y:visible; } }
    #mobileCard {
      position:absolute; top:0; left:0; width:100%;
      background:linear-gradient(135deg, #93c5fd, #c7d2fe); border-radius:0.5rem;
      box-shadow:0 10px 15px rgba(0,0,0,0.1); padding:2.5rem; display:flex;
      flex-direction:column; justify-content:center; align-items:center;
      overflow-y:auto; transition:transform 0.4s ease-in-out;
    }
    #mobileCard:hover { transform:scale(1.02); }
    .action-buttons button { font-size: 0.6rem; padding: 0.1rem 0.3rem; margin-left: 0.2rem; }
  </style>
</head>
<body class="bg-gray-50">
  <div class="flex min-h-screen">

      <div class="flex justify-between items-center mb-6 lg:flex hidden">

          <div class="py-2 text-center font-bold">三</div>
          <div class="py-2 text-center font-bold">四</div>

        <div id="calendar" class="grid grid-cols-7 border-t"></div>
      </div>
      <div class="mobile-date-picker mb-6 lg:hidden">

  <div id="editScheduleModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center">

  <div id="calendarActionModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
    <div class="bg-white p-6 rounded-lg w-80">
      <h3 id="calendarActionTitle" class="text-xl font-bold mb-4">選擇操作</h3>
      <div class="flex flex-col space-y-2">
        <button onclick="viewDailySchedule()" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">查看排程</button>
        <button onclick="addNewSchedule()" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">新增排程</button>
        <button onclick="hideCalendarActionModal()" class="bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600">取消</button>
      </div>

  <script>
    /********************
     * 全域變數與查詢表
     ********************/
    const areaLookup = {
      "李農": { "田地A": 50, "田地B": 60, "未知": 40 },
      "陳農": { "田地A": 70, "田地B": 80, "未知": 60 },
      "大農": { "田地A": 90, "田地B": 100, "未知": 80 }
    };
    const farmCoordinates = {
      "田地A": { lat: 23.6978, lng: 120.9605 },
      "田地B": { lat: 23.7178, lng: 120.9805 },
      "未知": { lat: 23.6978, lng: 120.9605 }
    };
    const customers = [
      { name: "李農", phone: "0912345678", farms: ["田地A", "田地B"] },
      { name: "陳農", phone: "0923456789", farms: ["田地A", "田地B"] },
      { name: "大農", phone: "0934567890", farms: ["田地A", "田地B"] }
    ];
    const schedules = [
      { date: '2025-02-05', farmer: '李農', farm: '田地A', area: 50, notes: '備註1', phone: '0912345678' },
      { date: '2025-02-05', farmer: '李農', farm: '田地B', area: 60, notes: '備註2', phone: '0912345678' },
      { date: '2025-02-10', farmer: '陳農', farm: '田地A', area: 70, notes: '備註3', phone: '0923456789' },
      { date: '2025-02-15', farmer: '大農', farm: '田地A', area: 90, notes: '備註4', phone: '0934567890' }
    ];

    const today = new Date();
    let currentMonth = new Date(today.getFullYear(), today.getMonth());
    let mobileCurrentDate = new Date();
    let dailyLimit = 100;
    let isMobileMonthView = false;
    const solarMonthNames = ["一月", "二月", "三月", "四月", "五月", "六月", "七月", "八月", "九月", "十月", "十一月", "十二月"];
    let isSliding = false;
    let selectedFarms = [];
    let customFarms = [];
    let lastSelectedFarm = null;
    let lastCustomFarmLetter = null;
    let selectedDateStr = '';

    /********************
     * 輔助函式
     ********************/
    function formatDate(date) {
      const yyyy = date.getFullYear();
      const mm = String(date.getMonth() + 1).padStart(2, '0');
      const dd = String(date.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

    function toROCYear(year) {
      return year - 1911;
    }

    function getNextFarmLetter(currentLetter) {
      if (!currentLetter) return 'A';
      const charCode = currentLetter.charCodeAt(0);
      const nextCharCode = charCode + 1;
      if (nextCharCode > 'Z'.charCodeAt(0)) return 'A';
      return String.fromCharCode(nextCharCode);
    }

    /********************
     * 側邊欄功能
     ********************/
    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebar-overlay');
      sidebar.classList.toggle('open');
      overlay.classList.toggle('show');
      const toggleButtons = document.querySelectorAll('.sidebar-toggle');
      if (sidebar.classList.contains('open')) {
        toggleButtons.forEach(btn => { btn.style.display = 'none'; });
      } else {
        toggleButtons.forEach(btn => { btn.style.display = 'block'; });
      }
    }

    /********************
     * 日曆切換功能
     ********************/
    function changeMonth(offset) {
      currentMonth.setMonth(currentMonth.getMonth() + offset);
      renderCalendar();
      if (window.innerWidth < 768) {
        document.getElementById('monthTitleMobile').textContent = document.getElementById('monthTitle').textContent;
      }
    }

    function renderCalendar() {
      const calendar = document.getElementById('calendar');
      const monthTitle = document.getElementById('monthTitle');
      calendar.innerHTML = '';

      const year = currentMonth.getFullYear();
      const month = currentMonth.getMonth();
      monthTitle.textContent = `民國${toROCYear(year)}年 ${solarMonthNames[month]}`;
      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);
      const daysInMonth = lastDay.getDate();
      const firstDayOfWeek = firstDay.getDay();

      for (let i = 0; i < firstDayOfWeek; i++) {
        const emptyCell = document.createElement('div');
        emptyCell.classList.add('calendar-day', 'border-b', 'border-r', 'p-2', 'bg-gray-50');
        calendar.appendChild(emptyCell);
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const dayCell = document.createElement('div');
        dayCell.classList.add('calendar-day', 'border-b', 'border-r', 'p-2');
        dayCell.innerHTML = `<div class="text-center font-medium">${day}</div>`;
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const scheduledItems = schedules.filter(s => s.date === dateStr);
        const farmers = {};
        scheduledItems.forEach(s => {
          if (!farmers[s.farmer]) farmers[s.farmer] = { farms: [], area: 0, phone: s.phone };
          farmers[s.farmer].farms.push({ farm: s.farm, area: s.area, notes: s.notes });
          farmers[s.farmer].area += s.area;
        });
        let totalArea = 0;

        const isMobileView = window.innerWidth < 768 && isMobileMonthView;

        if (!isMobileView) {
          Object.entries(farmers).forEach(([farmer, data], index) => {
            if (index < 4) {
              const div = document.createElement('div');
              div.classList.add('schedule-item');
              div.innerHTML = `${farmer} (${data.phone})<br>小計面積: ${data.area} 分`;
              data.farms.forEach(f => {
                const coords = farmCoordinates[f.farm] || farmCoordinates["未知"];
                const googleMapsLink = `https://www.google.com/maps/search/?api=1&query=${coords.lat},${coords.lng}&query_place_id=${encodeURIComponent(`${farmer}-${f.farm}`)}`;
                const farmDiv = document.createElement('div');
                farmDiv.classList.add('schedule-item-farm');
                farmDiv.innerHTML = `${f.farm}: ${f.area} 分 - ${f.notes || '無備註'} <a href="${googleMapsLink}" target="_blank" class="text-blue-500 hover:underline">查看地圖與導航</a>`;
                div.appendChild(farmDiv);
              });
              dayCell.appendChild(div);
            }
            totalArea += data.area;
          });

          if (totalArea > 0) {
            const totalDiv = document.createElement('div');
            totalDiv.classList.add('schedule-item', 'font-bold');
            totalDiv.innerHTML = `總面積: ${totalArea} 分`;
            dayCell.appendChild(totalDiv);
          }
        } else {
          totalArea = scheduledItems.reduce((sum, s) => sum + s.area, 0);
        }

        if (totalArea >= dailyLimit) {
          dayCell.classList.add('over-limit');
        }

        if (window.innerWidth >= 768 && !isMobileMonthView) {
          dayCell.addEventListener('click', () => showCalendarActionModal(dateStr));
        } else {
          dayCell.addEventListener('click', () => showDailySchedule(dateStr));
        }

        calendar.appendChild(dayCell);
      }

      if (window.innerWidth < 768) {
        document.getElementById('monthTitleMobile').textContent = monthTitle.textContent;
      }
    }

    function createMobileCardElement(date) {
      const dateStr = formatDate(date);
      const card = document.createElement('div');
      card.id = 'mobileCard';
      card.className = "min-h-[300px] bg-gradient-to-r from-blue-200 to-blue-400 rounded-2xl p-6 flex flex-col justify-center items-center";
      card.style.position = "absolute"; card.style.top = "0"; card.style.left = "0"; card.style.width = "100%";
      card.style.transition = "transform 0.4s ease-in-out";
      let html = `<h2 class="text-3xl font-bold mb-4">${dateStr}</h2>`;
      const daySchedules = schedules.filter(s => s.date === formatDate(date));
      const farmers = {};
      daySchedules.forEach(s => {
        if (!farmers[s.farmer]) farmers[s.farmer] = { farms: [], area: 0, phone: s.phone };
        farmers[s.farmer].farms.push({ farm: s.farm, area: s.area, notes: s.notes, index: schedules.indexOf(s) });
        farmers[s.farmer].area += s.area;
      });
      let totalArea = 0;
      if (Object.keys(farmers).length === 0) {
        html += `<p class="text-xl text-gray-700">當日無排程</p>`;
      } else {
        Object.entries(farmers).forEach(([farmer, data]) => {
          html += `<div class="bg-white rounded-lg p-4 mb-4 w-full shadow">
                    <p class="text-2xl font-semibold">${farmer} (${data.phone})</p>
                    <p class="text-lg">小計面積: ${data.area} 分</p>`;
          data.farms.forEach(f => {
            const coords = farmCoordinates[f.farm] || farmCoordinates["未知"];
            const googleMapsLink = `https://www.google.com/maps/search/?api=1&query=${coords.lat},${coords.lng}&query_place_id=${encodeURIComponent(`${farmer}-${f.farm}`)}`;
            html += `<p class="mt-2 text-lg">${f.farm}: ${f.area} 分 - 備註: ${f.notes || '無備註'}
                     <a href="${googleMapsLink}" target="_blank" class="text-blue-500 hover:underline">查看地圖與導航</a>
                     <button onclick="editSchedule(${f.index})" class="bg-yellow-500 text-white px-2 py-1 rounded hover:bg-yellow-600 ml-2">編輯</button>
                     <button onclick="deleteSchedule(${f.index})" class="bg-red-500 text-white px-2 py-1 rounded hover:bg-red-600 ml-2">刪除</button></p>`;
          });
          html += `</div>`;
          totalArea += data.area;
        });
        html += `<p class="text-xl font-bold">總面積: ${totalArea} 分</p>`;
      }
      if (totalArea >= dailyLimit) {
        html += `<div class="bg-red-100 text-red-700 rounded p-2 mt-2">當日排程已達上限 (最多 ${dailyLimit} 分)</div>`;
      }
      card.innerHTML = html;

    function renderMobileCard(date) {
      const container = document.getElementById('mobileCardContainer');
      container.innerHTML = "";
      const card = createMobileCardElement(date);
      card.style.transform = "translateX(0)";
      container.appendChild(card);
      document.getElementById('mobileDate').value = formatDate(date);
    }

    function slideMobileCard(direction) {
      if (isSliding) return;
      isSliding = true;
      const container = document.getElementById('mobileCardContainer');
      const currentCard = document.getElementById('mobileCard');
      const newDate = new Date(mobileCurrentDate);
      if (direction === 'left') { newDate.setDate(newDate.getDate() + 1); }
      else { newDate.setDate(newDate.getDate() - 1); }
      const newCard = createMobileCardElement(newDate);
      newCard.style.transform = (direction === 'left') ? "translateX(150%)" : "translateX(-150%)";
      container.appendChild(newCard);
      newCard.offsetWidth;
      currentCard.style.transform = (direction === 'left') ? "translateX(-150%)" : "translateX(150%)";
      newCard.style.transform = "translateX(0)";
      newCard.addEventListener('transitionend', function handler(e) {
        if (e.propertyName !== "transform") return;
        newCard.removeEventListener('transitionend', handler);
        container.removeChild(currentCard);
        mobileCurrentDate = newDate;
        isSliding = false;
      });
    }

    function onMobileDateChange() {
      const newDate = new Date(document.getElementById('mobileDate').value);
      if (!isNaN(newDate)) {
        mobileCurrentDate = newDate;

    }

      const farmer = document.getElementById('farmer_name').value;
      if (!farmer) { alert('請先選擇或輸入農民名稱'); return; }
      const farmContainer = document.getElementById('farm_checkboxes');

    function confirmFarms() {
      selectedFarms = Array.from(document.querySelectorAll('input[name="farm"]:checked')).map(cb => cb.value);
      if (selectedFarms.length > 0) {
        lastSelectedFarm = selectedFarms[selectedFarms.length - 1];
      }
      const selectedFarmsDiv = document.getElementById('selectedFarms');
      let displayText = selectedFarms.length > 0 ? `已選擇田地：${selectedFarms.join(', ')}` : '';

        displayText += (displayText ? ' | ' : '') + `臨時田地：${customFarms.map(f => `${f.farm} (${f.area}分)`).join(', ')}`;

    function addCustomFarm() {
      const farmNameInput = document.getElementById('custom_farm').value;
      const area = parseFloat(document.getElementById('custom_area').value);
      const notes = document.getElementById('custom_notes').value;

      if (!farmNameInput || !area) {
        alert('請輸入臨時田地名稱和面積');
        return;
      }

      customFarms.push({ farm: farmNameInput, area, notes });

      const match = farmNameInput.match(/^田地([A-Z])$/);
      if (match) {
        lastCustomFarmLetter = match[1];
      } else {
        lastCustomFarmLetter = null;
      }

      document.getElementById('custom_farm').value = '';
      document.getElementById('custom_area').value = '';
      document.getElementById('custom_notes').value = '';

      const nextLetter = getNextFarmLetter(lastCustomFarmLetter);
      document.getElementById('custom_farm').value = `田地${nextLetter}`;

      const selectedFarmsDiv = document.getElementById('selectedFarms');
      let displayText = selectedFarms.length > 0 ? `已選擇田地：${selectedFarms.join(', ')}` : '';
      if (customFarms.length > 0) {
        displayText += (displayText ? ' | ' : '') + `臨時田地：${customFarms.map(f => `${f.farm} (${f.area}分)`).join(', ')}`;
      }
      selectedFarmsDiv.innerHTML = displayText || '未選擇田地';
    }

    function addSchedule() {
      const date = document.getElementById('scheduleDate').value;
      const farmer = document.getElementById('farmer_name').value;
      const phone = document.getElementById('farmer_phone').value;

      if (!date || !farmer || (!phone && !customers.find(c => c.name === farmer))) {
        alert('請填寫日期、農民名稱和電話');
        return;
      }

      if (selectedFarms.length === 0 && customFarms.length === 0) {
        alert('請至少選擇或新增一個田地');
        return;
      }

      let totalArea = 0;
      selectedFarms.forEach(farm => { totalArea += areaLookup[farmer]?.[farm] || 0; });
      customFarms.forEach(farm => { totalArea += farm.area; });

      const daySchedules = schedules.filter(s => s.date === date);
      const dayTotalArea = daySchedules.reduce((sum, s) => sum + s.area, 0);
      if (dayTotalArea + totalArea > dailyLimit) {
        if (!confirm(`當日排程將超過上限 (最多 ${dailyLimit} 分)，目前已排 ${dayTotalArea} 分，此排程將新增 ${totalArea} 分，是否繼續？`)) {
          return;
        }
      }

      if (!customers.find(c => c.name === farmer)) {
        customers.push({ name: farmer, phone, farms: [] });
      }

      selectedFarms.forEach(farm => {
        schedules.push({ date, farmer, farm, area: areaLookup[farmer]?.[farm] || 0, notes: '', phone });
      });

      customFarms.forEach(f => {
        schedules.push({ date, farmer, farm: f.farm, area: f.area, notes: f.notes, phone });
        if (!areaLookup[farmer]) areaLookup[farmer] = {};
        areaLookup[farmer][f.farm] = f.area;
        const farmerData = customers.find(c => c.name === farmer);
        if (farmerData && !farmerData.farms.includes(f.farm)) farmerData.farms.push(f.farm);
      });

      renderCalendar();
      if (window.innerWidth < 768 && !isMobileMonthView) { renderMobileCard(mobileCurrentDate); }
      hideAddSchedule();
    }

      dailyLimit = parseFloat(document.getElementById('dailyLimit').value);

    function generateDailyCalendarCells(dateStr) {
      const date = new Date(dateStr);
      const year = date.getFullYear();
      const month = date.getMonth();
      const day = date.getDate();
      const firstDayOfWeek = new Date(year, month, day).getDay();
      let cells = '';

      for (let i = 0; i < 7; i++) {
        if (i === firstDayOfWeek) {
          const scheduledItems = schedules.filter(s => s.date === dateStr);
          const farmers = {};
          scheduledItems.forEach(s => {
            if (!farmers[s.farmer]) farmers[s.farmer] = { farms: [], area: 0, phone: s.phone };
            farmers[s.farmer].farms.push({ farm: s.farm, area: s.area, notes: s.notes });
            farmers[s.farmer].area += s.area;
          });
          let totalArea = 0;
          let cellContent = `<div style="text-align: center; font-weight: medium;">${day}</div>`;

          Object.entries(farmers).forEach(([farmer, data], index) => {
            if (index < 4) {
              cellContent += `<div style="font-size: 0.75rem; padding: 0.25rem 0.5rem; margin: 0.125rem 0; border-radius: 0.25rem; background-color: #93c5fd; color: #1e40af;">
                ${farmer} (${data.phone})<br>小計面積: ${data.area} 分`;
              data.farms.forEach(f => {
                cellContent += `<div style="font-size: 0.65rem; padding: 0.2rem 0.4rem; margin: 0.1rem 0; border-radius: 0.2rem; background-color: #bfdbfe; color: #1e40af;">
                  ${f.farm}: ${f.area} 分 - ${f.notes || '無備註'}
                </div>`;
              });
              cellContent += `</div>`;
            }
            totalArea += data.area;
          });

          if (totalArea > 0) {
            cellContent += `<div style="font-size: 0.75rem; padding: 0.25rem 0.5rem; margin: 0.125rem 0; border-radius: 0.25rem; background-color: #93c5fd; color: #1e40af; font-weight: bold;">
              總面積: ${totalArea} 分
            </div>`;
          }

          cells += `<div style="min-height: 120px; padding: 0.5rem; border-bottom: 1px solid #e5e7eb; border-right: 1px solid #e5e7eb; ${totalArea >= dailyLimit ? 'background-color: #fca5a5; color: white;' : ''}">
            ${cellContent}
          </div>`;
        } else {
          cells += `<div style="min-height: 120px; padding: 0.5rem; border-bottom: 1px solid #e5e7eb; border-right: 1px solid #e5e7eb; background-color: #f9fafb;"></div>`;
        }
      }
      return cells;
    }

        if (totalArea > 0) {
          cellContent += `<div style="font-size: 0.75rem; padding: 0.25rem 0.5rem; margin: 0.125rem 0; border-radius: 0.25rem; background-color: #93c5fd; color: #1e40af; font-weight: bold;">
            總面積: ${totalArea} 分
          </div>`;
        }

        calendarHtml += `<div style="min-height: 120px; padding: 0.5rem; border-bottom: 1px solid #e5e7eb; border-right: 1px solid #e5e7eb; ${totalArea >= dailyLimit ? 'background-color: #fca5a5; color: white;' : ''}">
          ${cellContent}
        </div>`;
      }

      calendarHtml += `</div></div>`;

      if (!schedules.some(s => s.date.startsWith(`${year}-${String(month + 1).padStart(2, '0')}`))) {
        alert("本月無排程，無法列印！");
        return;
      }

      document.body.innerHTML = calendarHtml;
      window.print();
      location.reload();
    }

    function editSchedule(index) {
      const schedule = schedules[index];
      document.getElementById('editScheduleDate').value = schedule.date;
      document.getElementById('editFarmerName').value = schedule.farmer;
      document.getElementById('editFarmerPhone').value = schedule.phone;
      document.getElementById('editFarm').value = schedule.farm;
      document.getElementById('editArea').value = schedule.area;
      document.getElementById('editNotes').value = schedule.notes || '';
      document.getElementById('editScheduleIndex').value = index;
      document.getElementById('editScheduleModal').classList.remove('hidden');
      document.getElementById('dailyScheduleModal').classList.add('hidden');
    }

    function hideEditSchedule() {
      document.getElementById('editScheduleModal').classList.add('hidden');
    }

    function saveEditedSchedule() {
      const index = parseInt(document.getElementById('editScheduleIndex').value);
      const date = document.getElementById('editScheduleDate').value;
      const farm = document.getElementById('editFarm').value;
      const area = parseFloat(document.getElementById('editArea').value);
      const notes = document.getElementById('editNotes').value;

      if (!date || !farm || !area) {
        alert('請填寫所有必填欄位');
        return;
      }

      const schedule = schedules[index];
      const oldDate = schedule.date;
      schedule.date = date;
      schedule.farm = farm;
      schedule.area = area;
      schedule.notes = notes;

      const farmer = schedule.farmer;
      if (!areaLookup[farmer]) areaLookup[farmer] = {};
      areaLookup[farmer][farm] = area;

      renderCalendar();
      if (window.innerWidth < 768 && !isMobileMonthView) {
        renderMobileCard(mobileCurrentDate);
      }
      hideEditSchedule();
    }

    function deleteSchedule(index) {
      if (confirm('確定要刪除此排程嗎？')) {
        schedules.splice(index, 1);
        renderCalendar();
        if (window.innerWidth < 768 && !isMobileMonthView) {
          renderMobileCard(mobileCurrentDate);
        }
        document.getElementById('dailyScheduleModal').classList.add('hidden');
      }
    }

    /********************
     * 初始化
     ********************/
    function initializeCalendar() {
      renderCalendar();
      if (window.innerWidth < 768) { renderMobileCard(mobileCurrentDate); }
    }

    initializeCalendar();
  </script>
</body>
</html>
