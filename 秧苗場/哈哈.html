<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>客戶管理</title>
  <style>
    /* 全局樣式 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: Arial, sans-serif;
      display: flex;
    }
    /* 側邊欄 */
    .sidebar {
      width: 250px;
      height: 100vh;
      background-color: #34d399;
      color: white;
      position: fixed;
      left: 0;
      top: 0;
      display: flex;
      flex-direction: column;
      font-size: 16px;
    }
    .sidebar a {
      padding: 12px 20px;
      color: white;
      text-decoration: none;
      transition: background 0.3s;
    }
    .sidebar a:hover,
    .sidebar .active {
      background-color: #059669;
    }
    #title-text {
      text-align: center;
      margin-bottom: 22px;
      font-weight: bold;
      padding-top: 23px;
    }
    /* 內容區域 */
    .content {
      margin-left: 250px;
      padding: 20px;
      width: 100%;
    }
    h1 {
      font-size: 28px;
      margin-bottom: 20px;
      color: #2f4f4f;
    }
    h2 {
      font-size: 22px;
      margin-bottom: 15px;
      color: #2f4f4f;
    }
    /* 表格樣式 */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
    }
    th, td {
      padding: 10px 15px;
      border: 1px solid #ddd;
      text-align: left;
    }
    th {
      background-color: #34d399;
      color: white;
    }
    /* 按鈕樣式 */
    .action-button {
      background-color: #3b82f6;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      margin-right: 8px;
      margin-top: 4px;
    }
    .action-button.edit {
      background-color: #fbbf24;
    }
    .action-button.delete {
      background-color: #ef4444;
    }
    .action-button.add-field {
      background-color: #8b5cf6;
    }
    .action-button.view-field {
      background-color: #10b981;
    }
    .action-button:hover {
      opacity: 0.85;
    }
    /* Modal 共用樣式 */
    .modal {
      display: none; 
      position: fixed; 
      z-index: 100; 
      left: 0;
      top: 0;
      width: 100%; 
      height: 100%; 
      overflow: auto; 
      background-color: rgba(0,0,0,0.5);
    }
    .modal-content {
      background-color: #fff;
      margin: 10% auto;
      padding: 20px;
      border-radius: 8px;
      width: 90%;
      max-width: 400px;
      position: relative;
    }
    .modal-content input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 8px;
      border: 1px solid #ddd;
      font-size: 16px;
    }
    .modal-content button {
      width: 100%;
      padding: 12px;
      background-color: #34d399;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 8px;
    }
    .modal-content button:hover {
      background-color: #059669;
    }
    .close {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <!-- 側邊欄 -->
  <div class="sidebar">
    <div id="title-text">秧苗場管理</div>
    <a href="calender.html">插秧排程</a>
    <a href="workerManage.html">插秧工人管理</a>
    <a href="TransplantingList.html">插秧單</a>
    <a href="Shipment.html">出貨單</a>
    <a href="harvest.html">割稻管理</a>
    <a href="customer.html" class="active">客戶管理</a>
    <a href="#">登出</a>
  </div>

  <!-- 內容區域 -->
  <div class="content">
    <h1>客戶管理</h1>
    <!-- 用彈跳式表單新增客戶 -->
    <button class="action-button" style="margin-bottom:20px;" onclick="openCustomerModal()">新增客戶</button>
    <h2>客戶列表</h2>
    <table id="customerTable">
      <thead>
        <tr>
          <th>姓名</th>
          <th>電話</th>
          <th>地址</th>
          <th>田區數</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody>
        <!-- 客戶資料動態載入 -->
      </tbody>
    </table>
  </div>

  <!-- 客戶彈跳式表單 -->
  <div id="customerModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeCustomerModal()">&times;</span>
      <h2 id="customerModalTitle">新增客戶</h2>
      <input type="text" id="customerName" placeholder="客戶姓名" />
      <input type="text" id="customerPhone" placeholder="電話" />
      <input type="text" id="customerAddress" placeholder="地址" />
      <button id="customerModalSubmit" onclick="submitCustomer()">新增客戶</button>
    </div>
  </div>

  <!-- 田區彈跳式表單 -->
  <div id="fieldModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeFieldModal()">&times;</span>
      <h2>新增田區</h2>
      <input type="text" id="fieldName" placeholder="田區名稱" />
      <input type="text" id="fieldLocation" placeholder="地點" />
      <input type="text" id="fieldArea" placeholder="面積" />
      <button onclick="addField()">新增田區</button>
    </div>
  </div>

  <!-- 查看田區彈跳式表單 -->
  <div id="viewFieldsModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeViewFieldsModal()">&times;</span>
      <h2>田區資料</h2>
      <div id="fieldsContainer">
        <!-- 田區資料表格 -->
      </div>
    </div>
  </div>

  <script>
    let customers = [];
    let editingIndex = null;               // 客戶編輯時用
    let currentCustomerIndexForField = null; // 新增田區時記錄哪個客戶

    /* 客戶 Modal 操作 */
    function openCustomerModal() {
      document.getElementById("customerModal").style.display = "block";
    }
    function closeCustomerModal() {
      document.getElementById("customerModal").style.display = "none";
      clearCustomerForm();
      editingIndex = null;
      document.getElementById("customerModalTitle").textContent = "新增客戶";
      document.getElementById("customerModalSubmit").textContent = "新增客戶";
    }
    function clearCustomerForm() {
      document.getElementById("customerName").value = "";
      document.getElementById("customerPhone").value = "";
      document.getElementById("customerAddress").value = "";
    }
    function submitCustomer() {
      const name = document.getElementById("customerName").value.trim();
      const phone = document.getElementById("customerPhone").value.trim();
      const address = document.getElementById("customerAddress").value.trim();
      if (!name || !phone || !address) {
        alert("欄位不能漏喔～");
        return;
      }
      if (editingIndex === null) {
        // 新增客戶（預設無田區）
        const newCustomer = { name, phone, address, fields: [] };
        customers.push(newCustomer);
      } else {
        // 更新客戶
        customers[editingIndex].name = name;
        customers[editingIndex].phone = phone;
        customers[editingIndex].address = address;
      }
      renderCustomerTable();
      closeCustomerModal();
    }
    function editCustomer(index) {
      const customer = customers[index];
      editingIndex = index;
      document.getElementById("customerName").value = customer.name;
      document.getElementById("customerPhone").value = customer.phone;
      document.getElementById("customerAddress").value = customer.address;
      document.getElementById("customerModalTitle").textContent = "編輯客戶";
      document.getElementById("customerModalSubmit").textContent = "更新客戶";
      openCustomerModal();
    }
    function confirmDelete(index) {
      if (confirm("確定要刪除該客戶嗎？此操作無法恢復喔！")) {
        customers.splice(index, 1);
        renderCustomerTable();
      }
    }

    /* 田區 Modal 操作 */
    function openFieldModal(index) {
      currentCustomerIndexForField = index;
      document.getElementById("fieldModal").style.display = "block";
    }
    function closeFieldModal() {
      document.getElementById("fieldModal").style.display = "none";
      clearFieldForm();
    }
    function clearFieldForm() {
      document.getElementById("fieldName").value = "";
      document.getElementById("fieldLocation").value = "";
      document.getElementById("fieldArea").value = "";
    }
    function addField() {
      const fieldName = document.getElementById("fieldName").value.trim();
      const fieldLocation = document.getElementById("fieldLocation").value.trim();
      const fieldArea = document.getElementById("fieldArea").value.trim();
      if (!fieldName || !fieldLocation || !fieldArea) {
        alert("田區的每個欄位都要填～");
        return;
      }
      const newField = { fieldName, fieldLocation, fieldArea };
      if (currentCustomerIndexForField !== null) {
        customers[currentCustomerIndexForField].fields.push(newField);
        alert("田區新增成功！");
        renderCustomerTable();
      }
      closeFieldModal();
    }

    /* 查看田區 Modal 操作 */
    function openViewFieldsModal(index) {
      const customer = customers[index];
      let html = "<table style='width:100%; border-collapse: collapse;'>";
      html += "<thead><tr><th>田區名稱</th><th>地點</th><th>面積</th></tr></thead><tbody>";
      if (customer.fields.length > 0) {
        customer.fields.forEach(field => {
          html += `<tr>
                    <td>${field.fieldName}</td>
                    <td>${field.fieldLocation}</td>
                    <td>${field.fieldArea}</td>
                  </tr>`;
        });
      } else {
        html += `<tr><td colspan="3">目前沒有田區資料</td></tr>`;
      }
      html += "</tbody></table>";
      document.getElementById("fieldsContainer").innerHTML = html;
      document.getElementById("viewFieldsModal").style.display = "block";
    }
    function closeViewFieldsModal() {
      document.getElementById("viewFieldsModal").style.display = "none";
    }

    /* 渲染客戶列表 */
    function renderCustomerTable() {
      const tbody = document.getElementById("customerTable").getElementsByTagName("tbody")[0];
      tbody.innerHTML = "";
      customers.forEach((customer, index) => {
        const row = tbody.insertRow();
        row.innerHTML = `
          <td>${customer.name}</td>
          <td>${customer.phone}</td>
          <td>${customer.address}</td>
          <td>${customer.fields.length}</td>
          <td>
            <button class="action-button edit" onclick="editCustomer(${index})">編輯</button>
            <button class="action-button delete" onclick="confirmDelete(${index})">刪除</button>
            <button class="action-button add-field" onclick="openFieldModal(${index})">新增田區</button>
            <button class="action-button view-field" onclick="openViewFieldsModal(${index})">查看田區</button>
          </td>
        `;
      });
    }
  </script>
</body>
</html>
