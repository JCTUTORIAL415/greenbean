<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理者登入 - 秧苗場管理系統</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(to right, #d4fc79, #96e6a1);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-size: cover;
        }
        .container {
            width: 100%;
            max-width: 460px;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
            animation: fadeIn 1s ease-in-out;
            box-sizing: border-box;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        h1 {
            color: #2e7d32;
            font-size: 26px;
            margin-bottom: 25px;
        }
        .input-field {
            width: 95%;
            padding: 12px;
            margin: 12px 0;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        .input-field:focus {
            outline: none;
            border-color: #4caf50;
            box-shadow: 0 0 5px rgba(76, 175, 80, 0.5);
        }
        .btn {
            display: block;
            width: 95%;
            padding: 12px;
            margin: 12px 0;
            text-decoration: none;
            color: white;
            background: linear-gradient(135deg, #4caf50, #2e7d32);
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s, box-shadow 0.2s;
            border: none;
            cursor: pointer;
        }
        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.25);
        }
        .error-message {
            color: #d32f2f;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>管理者登入</h1>
        <input type="text" class="input-field" placeholder="帳號" required>
        <input type="password" class="input-field" placeholder="密碼" required>
        <button class="btn" onclick="login()">登入</button>
        <p class="error-message" id="error-message">帳號或密碼錯誤</p>
    </div>
    <script>
        function login() {
            const username = document.querySelector('input[type="text"]').value;
            const password = document.querySelector('input[type="password"]').value;
            const errorMessage = document.getElementById('error-message');

            // 簡單的模擬登入驗證
            if (username === "admin" && password === "password123") {
                alert("登入成功！");
                // 可在此處添加跳轉到管理者儀表板的邏輯
            } else {
                errorMessage.style.display = "block";
            }
        }
    </script>
</body>
</html>
