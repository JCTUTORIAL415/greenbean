<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>秧苗製成與出貨記錄</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow-x: hidden;
    }
    .container {
      display: flex;
      width: 100%;
      min-height: 100vh;
    }
    .sidebar {
      width: 250px;
      height: 100vh;
      background-color: #34D399;
      color: white;
      position: fixed;
      left: 0;
      top: 0;
      transition: transform 0.3s ease-in-out;
      z-index: 50;
      overflow-y: auto;
    }
    @media (max-width: 1023px) {
      .sidebar {
        transform: translateX(-100%);
      }
      .sidebar.open {
        transform: translateX(0);
      }
    }
    @media (min-width: 1024px) {
      .sidebar {
        transform: none;
      }
      .main-content {
        margin-left: 250px;
        max-width: calc(100vw - 250px);
        width: 100%;
        box-sizing: border-box;
        position: absolute;
        top: 0;
        bottom: 0;
        right: 0;
      }
    }
    @media (max-width: 768px) {
      .toggle-buttons {
        margin-left: 40px;
      }
    }
    .sidebar a {
      display: block;
      padding: 1rem 1.25rem;
      color: white;
      text-decoration: none;
      font-size: 1rem;
    }
    .sidebar a:hover,
    .sidebar .active {
      background-color: #059669;
    }
    .sidebar-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 40;
      display: none;
    }
    .sidebar-overlay.show {
      display: block;
    }
    .main-content {
      flex: 1;
      width: 100%;
      background-color: #f9fafb;
      transition: all 0.3s ease-in-out;
      box-sizing: border-box;
    }
    .calendar-container,
    .table-container {
      width: 100%;
      padding: 1rem;
    }
    .calendar-container.hidden,
    .table-container.hidden {
      display: none;
    }
    #shipmentCalendar, #shipmentCalendarGrid {
      width: 100%;
    }
    .shipment-calendar-day {
      min-height: 150px;
      padding: 0.5rem;
      box-sizing: border-box;
      cursor: pointer;
      position: relative;
    }
    .shipment-calendar-day div.date {
      text-align: center;
      font-weight: 500;
      font-size: 1.25rem;
    }
    .shipment-calendar-day .details {
      font-size: 0.9rem;
      margin-top: 0.5rem;
      text-align: left;
    }
    @media (max-width: 1023px) {
      .shipment-calendar-day .details {
        display: none;
      }
      .shipment-calendar-day {
        min-height: 60px;
      }
      .shipment-calendar-day div.date {
        font-size: 1rem;
      }
    }
    .seedling-table-container {
      overflow-x: auto;
      width: 100%;
    }
    .seedling-table {
      width: 100%;
      min-width: 800px;
      border-collapse: collapse;
    }
    .seedling-table th,
    .seedling-table td {
      border: 1px solid #ccc;
      padding: 0.75rem;
      text-align: center;
    }
    .seedling-table th {
      background-color: #34D399;
      color: white;
    }
    .seedling-table td input,
    .seedling-table td textarea {
      width: 100%;
      padding: 0.25rem;
      border: 1px solid #ddd;
      border-radius: 0.25rem;
      box-sizing: border-box;
    }
    .seedling-table td textarea {
      min-height: 60px;
      resize: vertical;
    }
    .action-buttons {
      display: flex;
      gap: 0.5rem;
      justify-content: center;
      align-items: center;
    }
    .toggle-buttons {
      display: flex;
      gap: 1rem;
      padding: 1rem;
      align-items: center;
    }
    @media (max-width: 1023px) {
      .mobile-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.5rem 1rem;
      }
      .mobile-header h2 {
        font-size: clamp(1.25rem, 4vw, 1.5rem);
        margin: 0;
      }
    }
    #addSeedlingRecordModal .modal-content {
      max-height: 80vh;
      overflow-y: auto;
      width: 100%;
      max-width: 500px;
    }
    .filter-container {
      display: flex;
      gap: 1rem;
      padding: 1rem;
      align-items: center;
    }
    @media print {
      .sidebar, .sidebar-toggle, .toggle-buttons, .filter-container button, .action-buttons, #addSeedlingRecordModal, #shipmentModal, .seedling-table-container, .calendar-container:not(.print-calendar) {
        display: none !important;
      }
      .main-content {
        margin-left: 0;
        width: 100%;
      }
      .table-container {
        display: block !important;
      }
      #printTableContainer.print-active {
        display: block !important;
      }
      #printTableContainer:not(.print-active) {
        display: none !important;
      }
      #printTable {
        width: 100%;
        border-collapse: collapse;
        font-size: 11pt;
        margin: 0 auto;
      }
      #printTable th,
      #printTable td {
        border: 1px solid #000;
        padding: 8px;
        text-align: left;
      }
      #printTable th {
        background-color: #e0e0e0;
        font-weight: bold;
      }
      #printTable td {
        vertical-align: top;
      }
      #printHeader {
        text-align: center;
        font-size: 14pt;
        margin: 15px 0;
      }
      .print-calendar.print-active {
        display: block !important;
      }
      .print-calendar:not(.print-active) {
        display: none !important;
      }
      #printCalendar {
        width: 100%;
        border-collapse: collapse;
        font-size: 11pt;
        margin: 0 auto;
      }
      #printCalendar th,
      #printCalendar td {
        border: 1px solid #000;
        padding: 8px;
        text-align: center;
        min-height: 80px;
        vertical-align: top;
      }
      #printCalendar th {
        background-color: #e0e0e0;
        font-weight: bold;
      }
      #printCalendar td {
        min-height: 80px;
      }
      #printCalendarHeader {
        text-align: center;
        font-size: 14pt;
        margin: 15px 0;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <button onclick="toggleSidebar()" class="sidebar-toggle fixed top-4 left-4 bg-green-500 text-white p-2 rounded lg:hidden z-50">☰</button>
    <div class="sidebar" id="sidebar">
      <div class="text-center py-6 font-bold text-2xl">秧苗場管理</div>
      <a href="index.html">首頁</a>
      <a href="seedling.html" class="active">秧苗製成與管理</a>
      <a href="calender.html">插秧排程</a>
      <a href="Shipment.html">出貨單</a>
      <a href="TransplantingList.html">插秧單</a>
      <a href="harvest.html">割稻單</a>
      <a href="customer.html">客戶管理</a>
      <a href="workerManage.html">師傅管理</a>
      <a href="payment.html">收錢管理</a>
      <a href="profile.html">秧苗場個人檔案設定</a>
      <a href="#">登出</a>
    </div>
    <div id="sidebar-overlay" class="sidebar-overlay" onclick="toggleSidebar()"></div>
    <div class="main-content">
      <div class="toggle-buttons">
        <button onclick="showCalendar()" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">顯示月曆</button>
        <button onclick="showTable()" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">顯示製成表</button>
      </div>
      <div class="calendar-container" id="calendarContainer">
        <div class="flex justify-between items-center mb-6 hidden lg:flex px-4">
          <button onclick="changeMonth(-1)" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">◀ 上個月</button>
          <h2 id="monthTitle" class="text-2xl font-bold"></h2>
          <div>
            <button onclick="changeMonth(1)" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600 mr-2">下個月 ▶</button>
            <button onclick="printCalendar()" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">列印月曆</button>
          </div>
        </div>
        <div class="mobile-header lg:hidden">
          <button onclick="changeMonth(-1)" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">◀</button>
          <h2 id="monthTitleMobile" class="text-2xl font-bold"></h2>
          <div>
            <button onclick="changeMonth(1)" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600 mr-2">▶</button>
            <button onclick="printCalendar()" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">列印</button>
          </div>
        </div>
        <div id="shipmentCalendar" class="bg-white rounded-lg shadow overflow-hidden">
          <div class="grid grid-cols-7 bg-gray-100">
            <div class="py-2 text-center font-bold text-red-600">日</div>
            <div class="py-2 text-center font-bold">一</div>
            <div class="py-2 text-center font-bold">二</div>
            <div class="py-2 text-center font-bold">三</div>
            <div class="py-2 text-center font-bold">四</div>
            <div class="py-2 text-center font-bold">五</div>
            <div class="py-2 text-center font-bold text-red-600">六</div>
          </div>
          <div id="shipmentCalendarGrid" class="grid grid-cols-7 border-t"></div>
        </div>
      </div>
      <div class="table-container hidden" id="tableContainer">
        <div class="flex justify-between items-center mb-4 px-4">
          <h3 class="text-xl font-bold">秧苗製成記錄表</h3>
          <div>
            <button onclick="showAddSeedlingRecord()" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600 mr-2">新增記錄</button>
            <button onclick="printTable()" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">列印記錄</button>
          </div>
        </div>
        <div class="filter-container">
          <label for="yearSelect" class="mr-2">民國年：</label>
          <select id="yearSelect" onchange="filterRecords()" class="p-2 border rounded mr-4">
            <option value="">全部</option>
          </select>
          <label for="monthSelect" class="mr-2">月份：</label>
          <select id="monthSelect" onchange="filterRecords()" class="p-2 border rounded mr-4">
            <option value="">全部</option>
            <option value="1">一月</option>
            <option value="2">二月</option>
            <option value="3">三月</option>
            <option value="4">四月</option>
            <option value="5">五月</option>
            <option value="6">六月</option>
            <option value="7">七月</option>
            <option value="8">八月</option>
            <option value="9">九月</option>
            <option value="10">十月</option>
            <option value="11">十一月</option>
            <option value="12">十二月</option>
          </select>
        </div>
        <div class="seedling-table-container px-4">
          <table class="seedling-table">
            <thead>
              <tr>
                <th>日期</th>
                <th>稻種消毒</th>
                <th>離水</th>
                <th>製秧</th>
                <th>寄物種子用量 (台斤)</th>
                <th>秧苗顆數</th>
                <th>綠化</th>
                <th>綠化後天數</th>
                <th>備註</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="seedlingRecords"></tbody>
          </table>
        </div>
        <div id="printTableContainer" style="display: none;">
          <h2 id="printHeader">麥寮秧苗場 - 秧苗製成記錄表</h2>
          <table id="printTable">
            <thead>
              <tr>
                <th>批次</th>
                <th>日期</th>
                <th>稻種消毒</th>
                <th>離水</th>
                <th>製秧</th>
                <th>種子用量 (台斤)</th>
                <th>秧苗顆數</th>
                <th>綠化日期</th>
                <th>綠化後天數</th>
                <th>備註</th>
              </tr>
            </thead>
            <tbody id="printRecords"></tbody>
          </table>
        </div>
        <div id="printCalendarContainer" style="display: none;" class="calendar-container print-calendar">
          <h2 id="printCalendarHeader">麥寮秧苗場 - 出貨月曆</h2>
          <table id="printCalendar">
            <thead>
              <tr>
                <th>日</th>
                <th>一</th>
                <th>二</th>
                <th>三</th>
                <th>四</th>
                <th>五</th>
                <th>六</th>
              </tr>
            </thead>
            <tbody id="printCalendarGrid"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <div id="addSeedlingRecordModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
    <div class="bg-white p-6 rounded-lg modal-content">
      <h3 class="text-xl font-bold mb-4">新增秧苗製成記錄</h3>
      <form class="space-y-4">
        <div>
          <label for="seedlingDate">日期 <span class="text-red-500">*</span></label>
          <input type="date" id="seedlingDate" class="w-full p-2 border rounded mt-1" required>
        </div>
        <div>
          <label for="disinfection">稻種消毒 (可後補)</label>
          <input type="date" id="disinfection" class="w-full p-2 border rounded mt-1">
        </div>
        <div>
          <label for="soaking">離水 (可後補)</label>
          <input type="date" id="soaking" class="w-full p-2 border rounded mt-1">
        </div>
        <div>
          <label for="preparation">製秧 (可後補)</label>
          <input type="date" id="preparation" class="w-full p-2 border rounded mt-1">
        </div>
        <div>
          <label for="seedUsage">種子用量 (台斤，可後補)</label>
          <input type="number" id="seedUsage" class="w-full p-2 border rounded mt-1" step="0.1">
        </div>
        <div>
          <label for="seedlingQuantity">秧苗顆數 (可後補)</label>
          <input type="number" id="seedlingQuantity" class="w-full p-2 border rounded mt-1">
        </div>
        <div>
          <label for="greening">綠化 (可後補)</label>
          <input type="date" id="greening" class="w-full p-2 border rounded mt-1">
        </div>
        <div>
          <label for="greeningDays">綠化後天數 <span class="text-red-500">*</span></label>
          <input type="number" id="greeningDays" class="w-full p-2 border rounded mt-1" min="1" required>
        </div>
        <div>
          <label for="seedlingNotes">備註 (選填)</label>
          <textarea id="seedlingNotes" class="w-full p-2 border rounded mt-1"></textarea>
        </div>
        <div class="flex space-x-4">
          <button type="button" onclick="hideAddSeedlingRecord()" class="bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600 flex-1">取消</button>
          <button type="button" onclick="addSeedlingRecord()" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600 flex-1">確定</button>
        </div>
      </form>
    </div>
  </div>

  <div id="shipmentModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
    <div class="bg-white p-6 rounded-lg w-full max-w-md">
      <h3 id="shipmentModalTitle" class="text-xl font-bold mb-4"></h3>
      <div id="shipmentModalContent" class="space-y-2"></div>
      <button onclick="hideShipmentModal()" class="bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600 w-full mt-4">關閉</button>
    </div>
  </div>

  <script>
    const seedlingRecords = [
      {
        date: '2025-02-01',
        disinfection: '2025-02-02',
        soaking: '2025-02-03',
        preparation: '2025-02-04',
        seedUsage: 10.5,
        seedlingQuantity: 1000,
        greening: '2025-02-05',
        greeningDays: 5,
        notes: '第一批秧苗'
      },
      {
        date: '2025-02-10',
        disinfection: '2025-02-11',
        soaking: '2025-02-12',
        preparation: '2025-02-13',
        seedUsage: 15.0,
        seedlingQuantity: 1500,
        greening: '2025-02-14',
        greeningDays: 6,
        notes: '第二批秧苗'
      },
      {
        date: '2025-04-14',
        disinfection: '2025-04-15',
        soaking: '2025-04-16',
        preparation: '2025-04-17',
        seedUsage: 12.0,
        seedlingQuantity: 1200,
        greening: '2025-04-18',
        greeningDays: 5,
        notes: '春季秧苗'
      }
    ];
    const shipments = [
      { date: '2025-02-10', quantity: 800, actualQuantity: 750 },
      { date: '2025-02-20', quantity: 500, actualQuantity: 480 },
      { date: '2025-04-23', quantity: 600, actualQuantity: 580 }
    ];
    let currentMonth = new Date();
    const solarMonthNames = ["一月", "二月", "三月", "四月", "五月", "六月", "七月", "八月", "九月", "十月", "十一月", "十二月"];

    function toROCYear(year) {
      return year - 1911;
    }

    function toADYear(rocYear) {
      return parseInt(rocYear) + 1911;
    }

    function formatDateMMDD(dateStr) {
      if (!dateStr) return '-';
      const date = new Date(dateStr);
      const mm = date.getMonth() + 1;
      const dd = date.getDate();
      return `${mm}/${dd}`;
    }

    function formatDate(date) {
      const yyyy = date.getFullYear();
      const mm = String(date.getMonth() + 1).padStart(2, '0');
      const dd = String(date.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

    function calculateShipmentDate(greeningDate, greeningDays) {
      if (!greeningDate || !greeningDays) return null;
      const date = new Date(greeningDate);
      date.setDate(date.getDate() + parseInt(greeningDays));
      return formatDate(date);
    }

    function initializeYearSelector() {
      const yearSelect = document.getElementById('yearSelect');
      const currentADYear = new Date().getFullYear();
      const currentROCYear = toROCYear(currentADYear);
      for (let i = currentROCYear - 5; i <= currentROCYear + 5; i++) {
        const option = document.createElement('option');
        option.value = i;
        option.textContent = `民國${i}年`;
        if (i === toROCYear(currentADYear)) option.selected = true;
        yearSelect.appendChild(option);
      }
    }

    function updateMonthTitle() {
      const rocYear = toROCYear(currentMonth.getFullYear());
      document.getElementById('monthTitle').textContent = `民國${rocYear}年 ${solarMonthNames[currentMonth.getMonth()]}`;
      document.getElementById('monthTitleMobile').textContent = `民國${rocYear}年 ${solarMonthNames[currentMonth.getMonth()]}`;
    }

    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebar-overlay');
      sidebar.classList.toggle('open');
      overlay.classList.toggle('show');
    }

    function showCalendar() {
      document.getElementById('calendarContainer').classList.remove('hidden');
      document.getElementById('tableContainer').classList.add('hidden');
    }

    function showTable() {
      document.getElementById('calendarContainer').classList.add('hidden');
      document.getElementById('tableContainer').classList.remove('hidden');
      filterRecords();
    }

    function changeMonth(offset) {
      currentMonth.setMonth(currentMonth.getMonth() + offset);
      renderShipmentCalendar();
      updateMonthTitle();
    }

    function renderShipmentCalendar() {
      const calendar = document.getElementById('shipmentCalendarGrid');
      calendar.innerHTML = '';
      const year = currentMonth.getFullYear();
      const month = currentMonth.getMonth();
      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);
      const daysInMonth = lastDay.getDate();
      const firstDayOfWeek = firstDay.getDay();

      for (let i = 0; i < firstDayOfWeek; i++) {
        const emptyCell = document.createElement('div');
        emptyCell.classList.add('shipment-calendar-day', 'border-b', 'border-r', 'p-2', 'bg-gray-50');
        calendar.appendChild(emptyCell);
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const dayCell = document.createElement('div');
        dayCell.classList.add('shipment-calendar-day', 'border-b', 'border-r', 'p-2');
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        let readyToShip = 0;
        let estimatedShipped = 0;
        let actualShipped = 0;
        seedlingRecords.forEach(record => {
          const shipmentDate = calculateShipmentDate(record.greening, record.greeningDays);
          if (shipmentDate && shipmentDate === dateStr) {
            readyToShip += record.seedlingQuantity || 0;
          }
        });
        const shippedItems = shipments.filter(s => s.date === dateStr);
        estimatedShipped = shippedItems.reduce((sum, s) => sum + (s.quantity || 0), 0);
        actualShipped = shippedItems.reduce((sum, s) => sum + (s.actualQuantity || 0), 0);
        const remaining = readyToShip - actualShipped;
        dayCell.innerHTML = `
          <div class="date">${day}</div>
          <div class="details">
            <p>可出貨: ${readyToShip} 顆</p>
            <p>預估出貨: ${estimatedShipped} 顆</p>
            <p>實際出貨: ${actualShipped} 顆</p>
            <p style="color: ${remaining < 0 ? 'red' : 'black'}">剩餘: ${remaining} 顆</p>
          </div>
        `;
        dayCell.addEventListener('click', () => showShipmentModal(dateStr));
        calendar.appendChild(dayCell);
      }
    }

    function renderPrintCalendar() {
      const tbody = document.getElementById('printCalendarGrid');
      tbody.innerHTML = '';
      const year = currentMonth.getFullYear();
      const month = currentMonth.getMonth();
      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);
      const daysInMonth = lastDay.getDate();
      const firstDayOfWeek = firstDay.getDay();
      let currentRow = document.createElement('tr');
      for (let i = 0; i < firstDayOfWeek; i++) {
        const emptyCell = document.createElement('td');
        currentRow.appendChild(emptyCell);
      }
      for (let day = 1; day <= daysInMonth; day++) {
        const dayCell = document.createElement('td');
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        let readyToShip = 0;
        let estimatedShipped = 0;
        let actualShipped = 0;
        seedlingRecords.forEach(record => {
          const shipmentDate = calculateShipmentDate(record.greening, record.greeningDays);
          if (shipmentDate && shipmentDate === dateStr) {
            readyToShip += record.seedlingQuantity || 0;
          }
        });
        const shippedItems = shipments.filter(s => s.date === dateStr);
        estimatedShipped = shippedItems.reduce((sum, s) => sum + (s.quantity || 0), 0);
        actualShipped = shippedItems.reduce((sum, s) => sum + (s.actualQuantity || 0), 0);
        const remaining = readyToShip - actualShipped;
        dayCell.innerHTML = `
          <div style="font-weight: bold; margin-bottom: 8px;">${day}</div>
          <div style="font-size: 12pt; line-height: 1.5;">
            <p>可出貨: ${readyToShip} 顆</p>
            <p>預估出貨: ${estimatedShipped} 顆</p>
            <p>實際出貨: ${actualShipped} 顆</p>
            <p style="color: ${remaining < 0 ? 'red' : 'black'}">剩餘: ${remaining} 顆</p>
          </div>
        `;
        currentRow.appendChild(dayCell);
        if ((firstDayOfWeek + day) % 7 === 0 || day === daysInMonth) {
          tbody.appendChild(currentRow);
          currentRow = document.createElement('tr');
        }
      }
      document.getElementById('printCalendarHeader').textContent = `麥寮秧苗場 - 出貨月曆 (民國${toROCYear(year)}年 ${solarMonthNames[month]})`;
    }

    function filterRecords() {
      const yearSelect = document.getElementById('yearSelect').value;
      const monthSelect = document.getElementById('monthSelect').value;
      const filteredRecords = seedlingRecords.filter(record => {
        const recordDate = new Date(record.date);
        const recordYear = toROCYear(recordDate.getFullYear());
        const recordMonth = recordDate.getMonth() + 1;
        const yearMatch = yearSelect ? recordYear === parseInt(yearSelect) : true;
        const monthMatch = monthSelect ? recordMonth === parseInt(monthSelect) : true;
        return yearMatch && monthMatch;
      });
      renderSeedlingTable(filteredRecords);
      renderPrintTable(filteredRecords);
    }

    function showAddSeedlingRecord() {
      document.getElementById('seedlingDate').value = formatDate(new Date());
      document.getElementById('disinfection').value = '';
      document.getElementById('soaking').value = '';
      document.getElementById('preparation').value = '';
      document.getElementById('seedUsage').value = '';
      document.getElementById('seedlingQuantity').value = '';
      document.getElementById('greening').value = '';
      document.getElementById('greeningDays').value = '';
      document.getElementById('seedlingNotes').value = '';
      document.getElementById('addSeedlingRecordModal').classList.remove('hidden');
      addDateValidation();
    }

    function hideAddSeedlingRecord() {
      document.getElementById('addSeedlingRecordModal').classList.add('hidden');
      resetAddModal();
    }

    function addDateValidation() {
      const seedlingDateInput = document.getElementById('seedlingDate');
      const dateInputs = ['disinfection', 'soaking', 'preparation', 'greening'];
      seedlingDateInput.addEventListener('change', () => {
        const seedlingDate = new Date(seedlingDateInput.value);
        dateInputs.forEach(id => {
          const input = document.getElementById(id);
          input.min = formatDate(seedlingDate);
          if (input.value && new Date(input.value) < seedlingDate) {
            input.value = '';
            alert(`${input.previousElementSibling.textContent} 日期不能早於秧苗日期 (${formatDateMMDD(seedlingDateInput.value)})`);
          }
        });
      });
      dateInputs.forEach(id => {
        const input = document.getElementById(id);
        input.addEventListener('change', () => {
          const seedlingDate = new Date(seedlingDateInput.value);
          if (input.value && new Date(input.value) < seedlingDate) {
            input.value = '';
            alert(`${input.previousElementSibling.textContent} 日期不能早於秧苗日期 (${formatDateMMDD(seedlingDateInput.value)})`);
          }
        });
      });
    }

    function addSeedlingRecord() {
      const date = document.getElementById('seedlingDate').value;
      const greeningDays = document.getElementById('greeningDays').value;
      if (!date) {
        alert('請選擇日期！');
        return;
      }
      if (!greeningDays) {
        alert('請輸入綠化後天數！');
        return;
      }
      const disinfection = document.getElementById('disinfection').value || '';
      const soaking = document.getElementById('soaking').value || '';
      const preparation = document.getElementById('preparation').value || '';
      const seedUsage = parseFloat(document.getElementById('seedUsage').value) || 0;
      const seedlingQuantity = parseInt(document.getElementById('seedlingQuantity').value) || 0;
      const greening = document.getElementById('greening').value || '';
      const greeningDaysValue = parseInt(greeningDays) || 0;
      const notes = document.getElementById('seedlingNotes').value || '';
      const editIndex = document.getElementById('addSeedlingRecordModal').dataset.editIndex;
      if (editIndex !== undefined && editIndex !== '') {
        seedlingRecords[editIndex] = { date, disinfection, soaking, preparation, seedUsage, seedlingQuantity, greening, greeningDays: greeningDaysValue, notes };
      } else {
        seedlingRecords.push({ date, disinfection, soaking, preparation, seedUsage, seedlingQuantity, greening, greeningDays: greeningDaysValue, notes });
      }
      filterRecords();
      renderShipmentCalendar();
      hideAddSeedlingRecord();
    }

    function renderSeedlingTable(records = seedlingRecords) {
      const tbody = document.getElementById('seedlingRecords');
      tbody.innerHTML = '';
      records.forEach((record, index) => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${formatDateMMDD(record.date)}</td>
          <td>${formatDateMMDD(record.disinfection)}</td>
          <td>${formatDateMMDD(record.soaking)}</td>
          <td>${formatDateMMDD(record.preparation)}</td>
          <td><input type="number" value="${record.seedUsage}" step="0.1" onchange="updateSeedlingRecord(${index}, 'seedUsage', parseFloat(this.value) || 0)"></td>
          <td><input type="number" value="${record.seedlingQuantity}" onchange="updateSeedlingRecord(${index}, 'seedlingQuantity', parseInt(this.value) || 0)"></td>
          <td>${formatDateMMDD(record.greening)}</td>
          <td><input type="number" value="${record.greeningDays}" min="1" onchange="updateSeedlingRecord(${index}, 'greeningDays', parseInt(this.value) || 0)"></td>
          <td><textarea onchange="updateSeedlingRecord(${index}, 'notes', this.value)">${record.notes || ''}</textarea></td>
          <td class="action-buttons">
            <button onclick="editSeedlingRecord(${index})" class="bg-blue-500 text-white px-2 py-1 rounded hover:bg-blue-600">編輯</button>
            <button onclick="deleteSeedlingRecord(${index})" class="bg-red-500 text-white px-2 py-1 rounded hover:bg-red-600">刪除</button>
          </td>
        `;
        tbody.appendChild(row);
      });
    }

    function renderPrintTable(records = seedlingRecords) {
      const tbody = document.getElementById('printRecords');
      tbody.innerHTML = '';
      records.forEach((record, index) => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${index + 1}</td>
          <td>${formatDateMMDD(record.date)}</td>
          <td>${formatDateMMDD(record.disinfection)}</td>
          <td>${formatDateMMDD(record.soaking)}</td>
          <td>${formatDateMMDD(record.preparation)}</td>
          <td>${record.seedUsage || '-'}</td>
          <td>${record.seedlingQuantity || '-'}</td>
          <td>${formatDateMMDD(record.greening)}</td>
          <td>${record.greeningDays || '-'}</td>
          <td>${record.notes || '-'}</td>
        `;
        tbody.appendChild(row);
      });
    }

    function updateSeedlingRecord(index, field, value) {
      seedlingRecords[index][field] = value;
      filterRecords();
      renderShipmentCalendar();
    }

    function editSeedlingRecord(index) {
      const record = seedlingRecords[index];
      document.getElementById('seedlingDate').value = record.date;
      document.getElementById('disinfection').value = record.disinfection || '';
      document.getElementById('soaking').value = record.soaking || '';
      document.getElementById('preparation').value = record.preparation || '';
      document.getElementById('seedUsage').value = record.seedUsage || '';
      document.getElementById('seedlingQuantity').value = record.seedlingQuantity || '';
      document.getElementById('greening').value = record.greening || '';
      document.getElementById('greeningDays').value = record.greeningDays || '';
      document.getElementById('seedlingNotes').value = record.notes || '';
      document.getElementById('addSeedlingRecordModal').classList.remove('hidden');
      document.getElementById('addSeedlingRecordModal').dataset.editIndex = index;
      document.querySelector('#addSeedlingRecordModal button[onclick="addSeedlingRecord()"]').textContent = '更新';
      addDateValidation();
    }

    function deleteSeedlingRecord(index) {
      if (confirm('確定要刪除這筆記錄嗎？')) {
        seedlingRecords.splice(index, 1);
        filterRecords();
        renderShipmentCalendar();
      }
    }

    function resetAddModal() {
      document.getElementById('addSeedlingRecordModal').dataset.editIndex = '';
      document.querySelector('#addSeedlingRecordModal button[onclick="addSeedlingRecord()"]').textContent = '確定';
    }

    function showShipmentModal(dateStr) {
      const modalTitle = document.getElementById('shipmentModalTitle');
      const modalContent = document.getElementById('shipmentModalContent');
      const rocYear = toROCYear(new Date(dateStr).getFullYear());
      modalTitle.textContent = `出貨詳情 - 民國${rocYear}年 ${formatDateMMDD(dateStr)}`;
      modalContent.innerHTML = '';
      let readyToShip = 0;
      let estimatedShipped = 0;
      let actualShipped = 0;
      seedlingRecords.forEach(record => {
        const shipmentDate = calculateShipmentDate(record.greening, record.greeningDays);
        if (shipmentDate && shipmentDate === dateStr) {
          readyToShip += record.seedlingQuantity || 0;
        }
      });
      const shippedItems = shipments.filter(s => s.date === dateStr);
      estimatedShipped = shippedItems.reduce((sum, s) => sum + (s.quantity || 0), 0);
      actualShipped = shippedItems.reduce((sum, s) => sum + (s.actualQuantity || 0), 0);
      const remaining = readyToShip - actualShipped;
      modalContent.innerHTML = `
        <p>可出貨秧苗數: ${readyToShip} 顆</p>
        <p>預估出貨數: ${estimatedShipped} 顆</p>
        <div class="mt-2">
          <label for="shippedQuantity">調整預估出貨數:</label>
          <input type="number" id="shippedQuantity" value="${estimatedShipped}" min="0" class="w-full p-2 border rounded mt-1">
        </div>
        <p>實際出貨數: ${actualShipped} 顆</p>
        <div class="mt-2">
          <label for="actualShippedQuantity">調整實際出貨數 (考慮損壞):</label>
          <input type="number" id="actualShippedQuantity" value="${actualShipped}" min="0" class="w-full p-2 border rounded mt-1">
        </div>
        <p class="mt-2">剩餘顆數: <span id="remainingQuantity" style="color: ${remaining < 0 ? 'red' : 'black'}">${remaining}</span> 顆</p>
        <button onclick="updateShipment('${dateStr}', ${readyToShip})" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600 w-full mt-4">更新出貨數</button>
      `;
      const shippedInput = document.getElementById('shippedQuantity');
      const actualShippedInput = document.getElementById('actualShippedQuantity');
      const updateRemaining = () => {
        const newActualShipped = parseInt(actualShippedInput.value) || 0;
        const newRemaining = readyToShip - newActualShipped;
        document.getElementById('remainingQuantity').textContent = newRemaining;
        document.getElementById('remainingQuantity').style.color = newRemaining < 0 ? 'red' : 'black';
      };
      shippedInput.addEventListener('input', updateRemaining);
      actualShippedInput.addEventListener('input', updateRemaining);
      document.getElementById('shipmentModal').classList.remove('hidden');
    }

    function hideShipmentModal() {
      document.getElementById('shipmentModal').classList.add('hidden');
    }

    function updateShipment(dateStr, readyToShip) {
      const quantity = parseInt(document.getElementById('shippedQuantity').value) || 0;
      const actualQuantity = parseInt(document.getElementById('actualShippedQuantity').value) || 0;
      const remaining = readyToShip - actualQuantity;
      if (remaining < 0 && !confirm(`實際出貨數 (${actualQuantity} 顆) 將導致剩餘數量為負 (${remaining} 顆)。是否繼續？`)) {
        return;
      }
      const existingShipment = shipments.find(s => s.date === dateStr);
      if (existingShipment) {
        existingShipment.quantity = quantity;
        existingShipment.actualQuantity = actualQuantity;
      } else {
        shipments.push({ date: dateStr, quantity, actualQuantity });
      }
      renderShipmentCalendar();
      renderPrintCalendar();
      hideShipmentModal();
    }

    function printTable() {
      document.getElementById('printTableContainer').classList.add('print-active');
      document.getElementById('printCalendarContainer').classList.remove('print-active');
      filterRecords();
      window.print();
      document.getElementById('printTableContainer').classList.remove('print-active');
    }

    function printCalendar() {
      document.getElementById('printCalendarContainer').classList.add('print-active');
      document.getElementById('printTableContainer').classList.remove('print-active');
      renderPrintCalendar();
      window.print();
      document.getElementById('printCalendarContainer').classList.remove('print-active');
    }

    function initializeCalendar() {
      initializeYearSelector();
      renderShipmentCalendar();
      renderSeedlingTable();
      renderPrintTable();
      updateMonthTitle();
      showCalendar();
    }

    initializeCalendar();
  </script>
</body>
</html>
