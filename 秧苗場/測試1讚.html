<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>插秧與收割工人儀表板</title>
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDaN5_Va2EReS1HsZMG_gAyLYfzgQMV5Pg"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet" />
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(to right, #d4fc79, #96e6a1);
      margin: 0;
      padding: 20px;
      min-height: 100vh;
    }
    .container {
      width: 90%;
      max-width: 600px;
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
      margin: 0 auto 20px;
      position: relative;
    }
    h1, h2 {
      color: #2e7d32;
      text-align: center;
      margin-bottom: 20px;
    }
    .tabs {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .tab-btn {
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
    }
    .tab-btn.active {
      background: #4caf50;
      color: white;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      margin-bottom: 15px;
    }
    .input-group label {
      font-weight: bold;
      margin-bottom: 5px;
      font-size: 16px;
    }
    .input-group input, .input-group select {
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
    }
    .hidden { display: none; }
    .btn {
      padding: 14px;
      font-size: 18px;
      font-weight: bold;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.3s;
      width: 100%;
    }
    .btn.submit { background: linear-gradient(135deg, #4caf50, #2e7d32); }
    .btn.cancel { background: linear-gradient(135deg, #e53935, #c62828); }
    .btn:hover {
      transform: scale(1.05);
      box-shadow: 0 5px 12px rgba(0, 0, 0, 0.2);
    }
    .record-container {
      background: #f1f8e9;
      padding: 15px;
      border-radius: 10px;
      max-height: 400px;
      overflow-y: auto;
    }
    .record {
      background: white;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 10px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: white;
      padding: 20px;
      border-radius: 10px;
      max-width: 850px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
    }
    .receipt-container {
      border: 3px double #000;
      padding: 15px;
      margin-bottom: 15px;
      background: #fff;
    }
    .receipt-header {
      text-align: center;
      border-bottom: 2px solid #000;
      padding-bottom: 10px;
      margin-bottom: 15px;
    }
    .receipt-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .signature-img {
      max-width: 400px;
      max-height: 100px;
      margin: 10px auto;
      display: block;
    }
    #signature-modal.active {
      align-items: stretch;
    }
    .signature-modal-content {
      background: white;
      padding: 20px;
      border-radius: 10px;
      width: 90%;
      max-width: 800px;
      height: 60vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    @media (max-width: 768px) {
      .signature-modal-content {
        width: 100%;
        height: 100%;
        border-radius: 0;
        padding: 10px;
      }
      #signature-canvas {
        flex-grow: 1;
        width: 100%;
        height: auto;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>插秧與收割工人儀表板</h1>
    <div class="tabs">
      <button class="tab-btn active" onclick="showTab('planting')">插秧記錄</button>
      <button class="tab-btn" onclick="showTab('harvest')">收割記錄</button>
    </div>
    <form id="planting-form" class="tab-content">
      <div class="input-group">
        <label for="planting-farmer">農民名稱</label>
        <input type="text" id="planting-farmer" required placeholder="輸入農民名稱搜尋..." />
        <div id="farmer-suggestions" class="absolute bg-white w-full border rounded mt-1 max-h-40 overflow-y-auto hidden"></div>
      </div>
      <div class="input-group">
        <label for="planting-farm">田地 (可編輯位置)</label>
        <select id="planting-farm" required>
          <option value="">請選擇田地</option>
        </select>
        <input type="text" id="planting-address" placeholder="地址 (經緯度)" class="mt-2" />
        <button type="button" class="btn submit mt-2" onclick="getLocation('planting')">更新當前位置</button>
      </div>
      <div class="input-group">
        <label for="planting-area">面積</label>
        <input type="number" id="planting-area" step="0.01" required />
      </div>
      <div class="input-group">
        <label for="planting-unit">單位</label>
        <select id="planting-unit" required>
          <option value="分">分</option>
          <option value="甲">甲</option>
        </select>
      </div>
      <div class="input-group">
        <label for="planting-quantity">顆數</label>
        <input type="number" id="planting-quantity" required />
      </div>
      <div class="input-group">
        <label for="planting-remark">備註</label>
        <input type="text" id="planting-remark" placeholder="如：草區" />
      </div>
      <button type="submit" class="btn submit">提交插秧記錄</button>
    </form>
    <form id="harvest-form" class="tab-content hidden">
      <div class="input-group">
        <label for="harvest-customer">客戶姓名</label>
        <input type="text" id="harvest-customer" required />
      </div>
      <div class="input-group">
        <label for="harvest-area">面積</label>
        <input type="number" id="harvest-area" required />
      </div>
      <div class="input-group">
        <label for="harvest-unit">單位</label>
        <select id="harvest-unit" required>
          <option value="分">分</option>
          <option value="甲">甲</option>
        </select>
      </div>
      <div class="input-group">
        <label for="harvest-transport">是否代運</label>
        <select id="harvest-transport" required>
          <option value="true">是</option>
          <option value="false">否</option>
        </select>
      </div>
      <button type="submit" class="btn submit">提交收割記錄</button>
    </form>
  </div>

  <div class="container record-container">
    <h2>過去紀錄</h2>
    <div class="flex flex-col sm:flex-row gap-4 mb-4">
      <input type="text" id="search" placeholder="搜尋農民/客戶..." class="w-full p-2 border rounded" />
      <select id="type-filter" class="p-2 border rounded">
        <option value="">全部類型</option>
        <option value="planting">插秧</option>
        <option value="harvest">收割</option>
      </select>
      <input type="date" id="date-filter" class="p-2 border rounded" />
    </div>
    <div id="record-list"></div>
    <button class="btn submit mt-4" onclick="generateReceipt()">生成選取收據</button>
  </div>

  <div id="receipt-modal" class="modal">
    <div class="modal-content">
      <h2 class="text-center">麥寮秧苗場</h2>
      <div id="receipt-area"></div>
      <div class="flex justify-end mt-4 space-x-4">
        <button class="btn submit" onclick="downloadReceipt()">下載收據</button>
        <button class="btn cancel" onclick="closeModal()">關閉</button>
      </div>
    </div>
  </div>

  <div id="signature-modal" class="modal" style="background: rgba(0, 0, 0, 0.8);">
    <div class="signature-modal-content">
      <canvas id="signature-canvas" class="border"></canvas>
      <div class="mt-4 flex space-x-4 justify-center">
        <button class="btn submit" onclick="saveSignature()">儲存</button>
        <button class="btn cancel" onclick="clearSignature()">清除</button>
        <button class="btn cancel" onclick="closeSignatureModal()">取消</button>
      </div>
    </div>
  </div>

  <script>
    let records = [
      { type: "planting", date: "2025-03-30", farmer: "王大哥", phone: "0912345678", farm: "田區A", remark: "", area: 0.5, unit: "甲", address: "地址1 (23.5, 121.0)", quantity: 50, worker: "老李" },
      { type: "planting", date: "2025-03-30", farmer: "陳農", phone: "0987654321", farm: "田地A", remark: "平地", area: 0.3, unit: "甲", address: "地址2 (23.6, 121.2)", quantity: 60, worker: "小陳" },
      { type: "harvest", date: "2025-03-30", customer: "陳農", area: 15, unit: "分", transport: false }
    ];
    let currentReceiptId = '';
    let farmersData = {
      "王大哥": { 
        phone: "0912345678", 
        fields: [
          { name: "田區A", remark: "", area: 0.5, unit: "甲", address: "地址1 (23.5, 121.0)" },
          { name: "田區B", remark: "", area: 0.3, unit: "甲", address: "地址2 (23.6, 121.2)" }
        ]
      },
      "陳農": { phone: "0987654321", fields: [{ name: "田地A", remark: "平地", area: 0.3, unit: "甲", address: "地址2 (23.6, 121.2)" }] },
      "大農": { phone: "0912345678", fields: [{ name: "田地B", remark: "山坡", area: 0.8, unit: "甲", address: "地址3 (23.7, 121.3)" }] },
      "林子怡": { phone: "0927040169", fields: [{ name: "田地1", remark: "草區", area: 0.4, unit: "甲", address: "地址4 (23.8, 121.4)" }] },
      "張小明": { phone: "0976543210", fields: [{ name: "田地2", remark: "水區", area: 0.6, unit: "甲", address: "地址5 (23.9, 121.5)" }] }
    };

    function showTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(form => form.classList.add('hidden'));
      document.querySelector(`button[onclick="showTab('${tab}')"]`).classList.add('active');
      document.getElementById(`${tab}-form`).classList.remove('hidden');
    }

    function initializeFarmerAutocomplete() {
      const input = document.getElementById('planting-farmer');
      const suggestions = document.getElementById('farmer-suggestions');
      
      input.addEventListener('input', () => {
        const value = input.value.toLowerCase();
        suggestions.innerHTML = '';
        if (!value) {
          suggestions.classList.add('hidden');
          return;
        }
        
        const matches = Object.keys(farmersData).filter(farmer => 
          farmer.toLowerCase().includes(value) || 
          farmersData[farmer].phone.includes(value)
        );
        
        matches.forEach(farmer => {
          const div = document.createElement('div');
          div.className = 'p-2 hover:bg-gray-100 cursor-pointer';
          div.textContent = `${farmer} (${farmersData[farmer].phone})`;
          div.onclick = () => {
            input.value = farmer;
            loadFields(farmer);
            suggestions.classList.add('hidden');
          };
          suggestions.appendChild(div);
        });
        
        suggestions.classList.toggle('hidden', !matches.length);
      });
      
      document.addEventListener('click', e => {
        if (!suggestions.contains(e.target) && e.target !== input) {
          suggestions.classList.add('hidden');
        }
      });
    }

    function loadFields(farmer) {
      const farmSelect = document.getElementById('planting-farm');
      farmSelect.innerHTML = '<option value="">請選擇田地</option>';
      
      if (farmer && farmersData[farmer]) {
        farmersData[farmer].fields.forEach(field => {
          const option = document.createElement('option');
          option.value = field.name;
          option.textContent = `${field.name} (${field.remark || '無備註'}) - ${field.address}`;
          farmSelect.appendChild(option);
        });

        farmSelect.onchange = () => {
          const selectedField = farmersData[farmer].fields.find(f => f.name === farmSelect.value);
          if (selectedField) {
            document.getElementById('planting-area').value = selectedField.area || '';
            document.getElementById('planting-unit').value = selectedField.unit || '分';
            document.getElementById('planting-address').value = selectedField.address || '';
            document.getElementById('planting-remark').value = selectedField.remark || '';
          }
        };
      }
    }

    function getLocation(type) {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(position => {
          let lat = position.coords.latitude;
          let lng = position.coords.longitude;
          fetch(`https://maps.googleapis.com/maps/api/geocode/json?latlng=${lat},${lng}&key=AIzaSyDaN5_Va2EReS1HsZMG_gAyLYfzgQMV5Pg`)
            .then(response => response.json())
            .then(data => {
              if (data.status === "OK") {
                const addressInput = document.getElementById(`${type}-address`);
                const newValue = `${data.results[0].formatted_address} (${lat}, ${lng})`;
                if (addressInput.value && addressInput.value !== newValue) {
                  if (confirm(`確定更改地標資料？\n舊資料：${addressInput.value}\n新資料：${newValue}`)) {
                    addressInput.value = newValue;
                  }
                } else {
                  addressInput.value = newValue;
                }
              }
            });
        }, () => alert("獲取位置失敗！"));
      } else {
        alert("瀏覽器不支援地理定位！");
      }
    }

    function renderRecords() {
      const query = document.getElementById('search').value.toLowerCase();
      const typeFilter = document.getElementById('type-filter').value;
      const dateFilter = document.getElementById('date-filter').value;
      const list = document.getElementById('record-list');
      list.innerHTML = '';

      let filteredRecords = records.filter(r => {
        const matchesSearch = (r.farmer && r.farmer.toLowerCase().includes(query)) || 
                              (r.customer && r.customer.toLowerCase().includes(query));
        const matchesType = !typeFilter || r.type === typeFilter;
        const matchesDate = !dateFilter || (r.date && r.date === dateFilter);
        return matchesSearch && matchesType && matchesDate;
      });

      filteredRecords.forEach((r, i) => {
        const div = document.createElement('div');
        div.className = 'record';
        const dateStr = r.date || new Date().toLocaleDateString('zh-TW');
        div.innerHTML = r.type === 'planting' 
          ? `${dateStr} 👤 ${r.farmer} (${r.phone}) - 📍 ${r.farm} - 📏 ${r.area}${r.unit} - 🌱 ${r.quantity}顆 <input type="checkbox" data-index="${i}">`
          : `${dateStr} 👤 ${r.customer} - 📏 ${r.area}${r.unit} - 🚚 ${r.transport ? '是' : '否'} <input type="checkbox" data-index="${i}">`;
        list.appendChild(div);
      });
    }

    document.getElementById('planting-form').addEventListener('submit', e => {
      e.preventDefault();
      const farmer = document.getElementById('planting-farmer').value;
      const farm = document.getElementById('planting-farm').value;
      const address = document.getElementById('planting-address').value;
      const area = parseFloat(document.getElementById('planting-area').value);
      const unit = document.getElementById('planting-unit').value;
      const quantity = parseInt(document.getElementById('planting-quantity').value);
      const remark = document.getElementById('planting-remark').value;
      const phone = farmersData[farmer]?.phone || '';
      const worker = "老李";
      const date = new Date().toISOString().split('T')[0];

      const record = { type: 'planting', date, farmer, phone, farm, remark, area, unit, address, quantity, worker };
      records.push(record);
      document.getElementById('planting-form').reset();
      renderRecords();
      generateSingleReceipt(record);
    });

    document.getElementById('harvest-form').addEventListener('submit', e => {
      e.preventDefault();
      const customer = document.getElementById('harvest-customer').value;
      const area = parseFloat(document.getElementById('harvest-area').value);
      const unit = document.getElementById('harvest-unit').value;
      const transport = document.getElementById('harvest-transport').value === 'true';
      const date = new Date().toISOString().split('T')[0];
      const record = { type: 'harvest', date, customer, area, unit, transport };
      records.push(record);
      document.getElementById('harvest-form').reset();
      renderRecords();
      generateSingleReceipt(record);
    });

    function generateSingleReceipt(record) {
      const areaElem = document.getElementById('receipt-area');
      areaElem.innerHTML = '';
      const date = new Date().toLocaleDateString('zh-TW');
      const id = `receipt_${Date.now()}`;
      const div = document.createElement('div');
      div.className = 'receipt-container';

      if (record.type === 'planting') {
        div.innerHTML = `
          <div class="receipt-header"><h1>插秧單存根</h1><p>開立日期: ${date}</p></div>
          <div class="receipt-row"><label>日期:</label><div>${record.date}</div></div>
          <div class="receipt-row"><label>姓名:</label><div>${record.farmer}</div></div>
          <div class="receipt-row"><label>電話:</label><div>${record.phone}</div></div>
          <div class="receipt-row"><label>代插工人:</label><div>${record.worker}</div></div>
          <div class="receipt-row"><label>田區:</label><div>${record.farm} (${record.remark || '無備註'})</div></div>
          <div class="receipt-row"><label>面積:</label><div>${record.area} ${record.unit}</div></div>
          <div class="receipt-row"><label>顆數:</label><div>${record.quantity}</div></div>
          <div class="text-center"><p class="font-bold">簽名:</p>
              <button class="bg-blue-500 text-white px-4 py-2 rounded" onclick="openSignatureModal('${id}')">簽名</button>
              <img id="signature-${id}" class="signature-img" src="" style="display: none;"></div>
        `;
      } else {
        div.innerHTML = `
          <div class="receipt-header"><h1>收割單存根</h1><p>開立日期: ${date}</p></div>
          <div class="receipt-row"><label>日期:</label><div>${record.date}</div></div>
          <div class="receipt-row"><label>姓名:</label><div>${record.customer}</div></div>
          <div class="receipt-row"><label>面積:</label><div>${record.area} ${record.unit}</div></div>
          <div class="receipt-row"><label>是否代運:</label><div>${record.transport ? '是' : '否'}</div></div>
          <div class="text-center"><p class="font-bold">簽名:</p>
              <button class="bg-blue-500 text-white px-4 py-2 rounded" onclick="openSignatureModal('${id}')">簽名</button>
              <img id="signature-${id}" class="signature-img" src="" style="display: none;"></div>
        `;
      }
      areaElem.appendChild(div);
      document.getElementById('receipt-modal').classList.add('active');
    }

    function generateReceipt() {
      const checkboxes = document.querySelectorAll('#record-list input[data-index]:checked');
      if (!checkboxes.length) return alert('請選擇至少一筆記錄');
      const selected = Array.from(checkboxes).map(cb => records[cb.dataset.index]);
      const planting = selected.filter(r => r.type === 'planting');
      const harvest = selected.filter(r => r.type === 'harvest');
      const areaElem = document.getElementById('receipt-area');
      areaElem.innerHTML = '';
      const date = new Date().toLocaleDateString('zh-TW');

      if (planting.length) {
        planting.forEach(r => {
          const id = `receipt_${Date.now()}_${Math.random()}`;
          const div = document.createElement('div');
          div.className = 'receipt-container';
          div.innerHTML = `
            <div class="receipt-header"><h1>插秧單存根</h1><p>開立日期: ${date}</p></div>
            <div class="receipt-row"><label>日期:</label><div>${r.date}</div></div>
            <div class="receipt-row"><label>姓名:</label><div>${r.farmer}</div></div>
            <div class="receipt-row"><label>電話:</label><div>${r.phone}</div></div>
            <div class="receipt-row"><label>代插工人:</label><div>${r.worker}</div></div>
            <div class="receipt-row"><label>田區:</label><div>${r.farm} (${r.remark || '無備註'})</div></div>
            <div class="receipt-row"><label>面積:</label><div>${r.area} ${r.unit}</div></div>
            <div class="receipt-row"><label>顆數:</label><div>${r.quantity}</div></div>
            <div class="text-center"><p class="font-bold">簽名:</p>
                <button class="bg-blue-500 text-white px-4 py-2 rounded" onclick="openSignatureModal('${id}')">簽名</button>
                <img id="signature-${id}" class="signature-img" src="" style="display: none;"></div>
          `;
          areaElem.appendChild(div);
        });
      }

      if (harvest.length) {
        const customer = harvest[0].customer;
        if (harvest.some(r => r.customer !== customer)) return alert('收割單需為同一客戶');
        let totalArea = harvest.reduce((sum, r) => sum + r.area, 0);
        let transportCount = harvest.filter(r => r.transport).length;
        const id = `receipt_${Date.now()}`;
        const div = document.createElement('div');
        div.className = 'receipt-container';
        div.innerHTML = `
          <div class="receipt-header"><h1>收割單存根</h1><p>開立日期: ${date}</p></div>
          <div class="receipt-row"><label>日期:</label><div>${harvest[0].date}</div></div>
          <div class="receipt-row"><label>姓名:</label><div>${customer}</div></div>
          <div class="receipt-row"><label>總面積:</label><div>${totalArea} ${harvest[0].unit}</div></div>
          <div class="receipt-row"><label>代運次數:</label><div>${transportCount}</div></div>
          <div class="text-center"><p class="font-bold">簽名:</p>
              <button class="bg-blue-500 text-white px-4 py-2 rounded" onclick="openSignatureModal('${id}')">簽名</button>
              <img id="signature-${id}" class="signature-img" src="" style="display: none;"></div>
        `;
        areaElem.appendChild(div);
      }
      document.getElementById('receipt-modal').classList.add('active');
    }

    function closeModal() { 
      document.getElementById('receipt-modal').classList.remove('active'); 
    }

    async function downloadReceipt() {
      const { jsPDF } = window.jspdf;
      const areaElem = document.getElementById('receipt-area');
      const canvas = await html2canvas(areaElem, { scale: 2, useCORS: true });
      const imgData = canvas.toDataURL('image/png');
      const pdf = new jsPDF('p', 'mm', 'a4');
      const width = 210;
      const height = (canvas.height * width) / canvas.width;
      pdf.addImage(imgData, 'PNG', 0, 0, width, height);
      pdf.save('record_receipt.pdf');
      closeModal();
    }

    // 新增：旋轉 canvas 的 function（將畫布順時針旋轉 90°）
    function rotateCanvas(originalCanvas) {
      const rotatedCanvas = document.createElement('canvas');
      // 交換寬高
      rotatedCanvas.width = originalCanvas.height;
      rotatedCanvas.height = originalCanvas.width;
      const ctx = rotatedCanvas.getContext('2d');
      // 平移到旋轉後的原點，並旋轉 90° (Math.PI/2)
      ctx.translate(rotatedCanvas.width, 0);
      ctx.rotate(Math.PI / 2);
      ctx.drawImage(originalCanvas, 0, 0);
      return rotatedCanvas;
    }

    // 修改：儲存簽名時如果是手機則旋轉簽名
    function saveSignature() {
      const canvas = document.getElementById('signature-canvas');
      let finalCanvas = canvas;
      const isMobile = window.innerWidth <= 768;
      if (isMobile) {
        finalCanvas = rotateCanvas(canvas);
      }
      const img = document.getElementById(`signature-${currentReceiptId}`);
      img.src = finalCanvas.toDataURL();
      img.style.display = 'block';
      img.previousElementSibling.style.display = 'none';
      closeSignatureModal();
    }

    function clearSignature() {
      const canvas = document.getElementById('signature-canvas');
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    function initializeSignatureCanvas() {
      const canvas = document.getElementById('signature-canvas');
      const ctx = canvas.getContext('2d');
      let drawing = false;
      let lastX, lastY;

      function getPosition(e) {
        const rect = canvas.getBoundingClientRect();
        if (e.type.includes('touch')) {
          return {
            x: e.touches[0].clientX - rect.left,
            y: e.touches[0].clientY - rect.top
          };
        }
        return {
          x: e.clientX - rect.left,
          y: e.clientY - rect.top
        };
      }

      function startDrawing(e) {
        e.preventDefault();
        drawing = true;
        const pos = getPosition(e);
        lastX = pos.x;
        lastY = pos.y;
        ctx.beginPath();
        ctx.moveTo(lastX, lastY);
      }

      function draw(e) {
        e.preventDefault();
        if (!drawing) return;
        const pos = getPosition(e);
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
        lastX = pos.x;
        lastY = pos.y;
      }

      function stopDrawing() {
        drawing = false;
      }

      canvas.addEventListener('mousedown', startDrawing);
      canvas.addEventListener('mousemove', draw);
      canvas.addEventListener('mouseup', stopDrawing);
      canvas.addEventListener('mouseout', stopDrawing);

      canvas.addEventListener('touchstart', startDrawing);
      canvas.addEventListener('touchmove', draw);
      canvas.addEventListener('touchend', stopDrawing);
      canvas.addEventListener('touchcancel', stopDrawing);

      ctx.strokeStyle = '#000';
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
    }

    function openSignatureModal(id) {
      currentReceiptId = id;
      const canvas = document.getElementById('signature-canvas');
      const isMobile = window.innerWidth <= 768;
      
      if (isMobile) {
        canvas.width = window.innerWidth - 20; // 減去 padding
        canvas.height = window.innerHeight - 100; // 留空間給按鈕
      } else {
        canvas.width = 760; // 桌面寬度
        canvas.height = 400; // 桌面高度
      }
      
      document.getElementById('signature-modal').classList.add('active');
      initializeSignatureCanvas();
    }

    function closeSignatureModal() { 
      document.getElementById('signature-modal').classList.remove('active');
      clearSignature(); // 關閉時清除畫布
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderRecords();
      initializeFarmerAutocomplete();
      document.getElementById('search').addEventListener('input', renderRecords);
      document.getElementById('type-filter').addEventListener('change', renderRecords);
      document.getElementById('date-filter').addEventListener('change', renderRecords);
    });
  </script>
</body>
