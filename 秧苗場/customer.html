<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>插秧排程</title>
  <!-- Tailwind CSS -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet" />
  <!-- Hammer.js 用於觸控滑動 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>
  <style>
    /* CSS 保持不變 */
    .sidebar {
      width: 250px;
      height: 100vh;
      background-color: #34D399;
      color: white;
      position: fixed;
      left: 0;
      top: 0;
      transition: transform 0.3s ease-in-out;
      z-index: 50;
    }
    .sidebar a {
      display: block;
      padding: 1rem 1.25rem;
      color: white;
      text-decoration: none;
      font-size: 1rem;
      transition: background-color 0.3s;
    }
    .sidebar a:hover { background-color: #059669; }
    .sidebar .active { background-color: #059669; }
    .sidebar-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 40;
      display: none;
    }
    .sidebar-overlay.show { display: block; }
    @media (max-width:768px){
      .sidebar { transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); }
    }
    select, input[type="date"], input[type="text"] {
      -webkit-appearance: none; -moz-appearance: none; appearance: none;
      background-color: #fff; border: 1px solid #ccc; padding: 10px;
      border-radius: 4px; font-family: inherit;
    }
    html, body, div, span, applet, object, iframe,
    h1, h2, h3, h4, h5, h6, p, blockquote, pre,
    a, abbr, acronym, address, big, cite, code,
    del, dfn, em, img, ins, kbd, q, s, samp,
    small, strike, strong, sub, sup, tt, var,
    b, u, i, center,
    dl, dt, dd, ol, ul, li,
    fieldset, form, label, legend,
    table, caption, tbody, tfoot, thead, tr, th, td,
    article, aside, canvas, details, embed,
    figure, figcaption, footer, header, hgroup,
    menu, nav, output, ruby, section, summary,
    time, mark, audio, video {
      margin:0; padding:0; border:0; font-size:100%;
      font:inherit; vertical-align:baseline;
    }
    article,aside,details,figcaption,figure,footer,header,hgroup,menu,nav,section { display:block; }
    body { line-height:1; -webkit-text-size-adjust:100%; -ms-text-size-adjust:100%; }
    ol,ul { list-style:none; }
    table { border-collapse:collapse; border-spacing:0; }
    button { height:40px; }
    .calendar-day { min-height:120px; transition:all 0.3s; padding:0.5rem; }
    .calendar-day:hover { background-color:#f0f9ff; }
    .schedule-item { font-size:0.75rem; padding:0.25rem 0.5rem; margin:0.125rem 0; border-radius:0.25rem; background-color:#93c5fd; color:#1e40af; }
    .over-limit { background-color:#fca5a5; color:white; }
    .calendar-container {
      flex-grow:1; padding:1.25rem; background-color:#f9fafb;
      min-height:100vh; margin-left:250px; transition:margin-left 0.3s ease-in-out;
      width:calc(100% - 250px);
    }
    #desktopCalendar {
      background-color:#ffffff; border-radius:0.5rem;
      box-shadow:0 0.625rem 1.25rem rgba(0,0,0,0.1); overflow:hidden;
      margin-bottom:1.25rem;
    }
    .daily-limit-desktop { margin-bottom:1.5rem; }
    @media (max-width:768px){
      .calendar-container { margin-left:0; width:100%; }
      #desktopCalendar { display:none; }
      #mobileCardContainer { display:block; }
      .mobile-month-view #desktopCalendar { display:block; }
      .mobile-month-view #mobileCardContainer { display:none; }
      .mobile-header {
        display:flex; justify-content:center; align-items:center; gap:1rem;
        margin-bottom:1rem; overflow-x:auto; white-space:nowrap; padding:0.5rem 0;
      }
      .mobile-header h2 { font-size:clamp(1.25rem,4vw,1.5rem); font-weight:bold; flex-shrink:0; }
      .mobile-header button { font-size:clamp(0.75rem,2.5vw,1rem); padding:0.5rem 1rem; flex-shrink:0; min-width:100px; }
      .mobile-button-group { display:flex; flex-direction:column; gap:0.5rem; margin-bottom:1rem; }
      .mobile-button-group button { width:100%; text-align:center; }
      .mobile-month-buttons { display:none; flex-direction:column; gap:0.5rem; margin-top:1rem; }
      .mobile-month-view .mobile-month-buttons { display:flex; }
    }
    .input-group { display:flex; flex-direction:column; margin-bottom:1rem; }
    .input-group label { font-weight:bold; margin-bottom:0.25rem; font-size:1rem; }
    .input-group input, .input-group textarea {
      padding:0.75rem; border:1px solid #ccc; border-radius:0.5rem; font-size:1rem; transition:0.3s;
    }
    #farmer_suggestions { max-height:200px; overflow-y:auto; z-index:100; }
    #mobileCardContainer { display:none; }
    @media (max-width:768px){ #mobileCardContainer { display:block; position:relative; min-height:400px; overflow-y:visible; } }
    #mobileCard {
      position:absolute; top:0; left:0; width:100%;
      background:linear-gradient(135deg, #93c5fd, #c7d2fe); border-radius:0.5rem;
      box-shadow:0 10px 15px rgba(0,0,0,0.1); padding:2.5rem; display:flex;
      flex-direction:column; justify-content:center; align-items:center;
      overflow-y:auto; transition:transform 0.7s ease-in-out;
    }
    #mobileCard:hover { transform:scale(1.02); }
  </style>
</head>
<body class="bg-gray-50">
  <div class="flex">
    <button onclick="toggleSidebar()" class="sidebar-toggle fixed top-4 left-4 bg-green-500 text-white p-2 rounded lg:hidden z-50">☰</button>
    <div class="sidebar" id="sidebar">
      <div class="text-center py-6 font-bold text-2xl">秧苗場管理</div>
      <a href="calender.html" class="active">插秧排程</a>
      <a href="workerManage.html">插秧工人管理</a>
      <a href="TransplantingList.html">插秧單</a>
      <a href="Shipment.html">出貨單</a>
      <a href="harvest.html">割稻管理</a>
      <a href="customer.html">客戶管理</a>
      <a href="profile.html">秧苗場個人檔案設定</a>
      <a href="payment.html">收錢管理</a>
      <a href="seedling.html">秧苗製成與管理</a>
      <a href="#">登出</a>
    </div>
    <div id="sidebar-overlay" class="sidebar-overlay" onclick="toggleSidebar()"></div>
    <div class="calendar-container">
      <div class="flex justify-between items-center mb-6 lg:flex hidden">
        <div class="flex items-center space-x-4">
          <button onclick="changeMonth(-1)" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">◀ 上個月</button>
          <h2 id="monthTitle" class="text-2xl font-bold">2025年 2月</h2>
          <button onclick="changeMonth(1)" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">下個月 ▶</button>
        </div>
        <div class="flex space-x-4">
          <button onclick="showAddSchedule()" class="bg-green-500 text-white px-6 py-2 rounded hover:bg-green-600" id="addSchedule">新增排程</button>
        </div>
      </div>
      <div class="mobile-header lg:hidden">
        <h2 id="monthTitleMobile" class="text-2xl font-bold">2025年 2月</h2>
        <button onclick="showAddSchedule()" class="bg-green-500 text-white rounded hover:bg-green-600">新增排程</button>
      </div>
      <div class="daily-limit-desktop mb-6 hidden lg:block">
        <label for="dailyLimit" class="block text-sm font-medium mb-1">每日排程上限 (甲):</label>
        <input type="number" id="dailyLimit" class="w-full p-2 border rounded" value="10" onchange="updateDailyLimit()" />
      </div>
      <div id="desktopCalendar" class="bg-white rounded-lg shadow overflow-hidden">
        <div class="grid grid-cols-7 bg-gray-100">
          <div class="py-2 text-center font-bold text-red-600">日</div>
          <div class="py-2 text-center font-bold">一</div>
          <div class="py-2 text-center font-bold">二</div>
          <div class="py-2 text-center font-bold">三</div>
          <div class="py-2 text-center font-bold">四</div>
          <div class="py-2 text-center font-bold">五</div>
          <div class="py-2 text-center font-bold text-red-600">六</div>
        </div>
        <div id="calendar" class="grid grid-cols-7 border-t"></div>
      </div>
      <div class="mobile-date-picker mb-6 lg:hidden">
        <div class="mobile-button-group">
          <button onclick="toggleMobileView()" class="bg-purple-500 text-white px-4 py-2 rounded hover:bg-purple-600">切換月曆/滑動</button>
        </div>
        <label for="mobileDate" class="block text-sm font-medium mb-1">選擇日期:</label>
        <input type="date" id="mobileDate" class="w-full p-2 border rounded" onchange="onMobileDateChange()" />
        <div class="mobile-month-buttons">
          <button onclick="changeMonth(-1)" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">◀ 上個月</button>
          <button onclick="changeMonth(1)" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">下個月 ▶</button>
        </div>
      </div>
      <div class="mb-4 lg:hidden">
        <label for="mobileDailyLimit" class="block text-sm font-medium mb-1">每日排程上限 (甲):</label>
        <input type="number" id="mobileDailyLimit" class="w-full p-2 border rounded" value="10" onchange="updateDailyLimitMobile()" />
      </div>
      <div id="mobileCardContainer" class="lg:hidden mt-6"></div>
    </div>
  </div>

  <!-- Modals -->
  <div id="addScheduleModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center">
    <div class="bg-white p-6 rounded-lg w-96">
      <h3 class="text-xl font-bold mb-4">新增插秧排程</h3>
      <form class="space-y-4">
        <div class="input-group">
          <label for="scheduleDate">日期</label>
          <input type="date" id="scheduleDate" class="w-full p-2 border rounded">
        </div>
        <div class="input-group relative">
          <label for="farmer_name">農民名稱或電話</label>
          <input type="text" id="farmer_name" class="w-full p-2 border rounded" oninput="searchFarmer(this.value)" placeholder="輸入名稱或電話搜尋">
          <div id="farmer_suggestions" class="absolute w-full bg-white border rounded shadow-lg hidden"></div>
        </div>
        <div class="input-group">
          <label>選擇地塊</label>
          <button type="button" onclick="showFarmModal()" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">選擇地塊</button>
          <div id="selectedFarms" class="mt-2"></div>
        </div>
        <div class="input-group">
          <label for="notes">備註 (選填)</label>
          <textarea id="notes" class="w-full p-2 border rounded"></textarea>
        </div>
        <div class="flex space-x-4">
          <button type="button" onclick="hideAddSchedule()" class="bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600 w-1/2">取消</button>
          <button type="button" onclick="addSchedule()" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600 w-1/2">確定</button>
        </div>
      </form>
    </div>
  </div>

  <div id="farmModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center">
    <div class="bg-white p-6 rounded-lg w-96">
      <h3 class="text-xl font-bold mb-4">選擇地塊</h3>
      <div id="farm_checkboxes" class="space-y-2 mb-4"></div>
      <div class="flex space-x-4">
        <button type="button" onclick="hideFarmModal()" class="bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600 w-1/2">取消</button>
        <button type="button" onclick="confirmFarms()" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600 w-1/2">確定</button>
      </div>
    </div>
  </div>

  <div id="dailyScheduleModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center">
    <div class="bg-white p-6 rounded-lg w-96">
      <h3 id="dailyScheduleTitle" class="text-xl font-bold mb-4"></h3>
      <div id="dailyScheduleContent" class="space-y-2"></div>
      <div class="flex space-x-2 mt-4">
        <button onclick="hideDailySchedule()" class="bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600 flex-1">關閉</button>
        <button onclick="printDailySchedule()" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600 flex-1">列印</button>
      </div>
    </div>
  </div>

  <script>
    /********************
     * 全域變數與查詢表
     ********************/
    const areaLookup = {
      "李農": { "地點A": 5, "地點B": 6, "未知": 4 },
      "陳農": { "地點A": 7, "地點B": 8, "未知": 6 },
      "大農": { "地點A": 9, "地點B": 10, "未知": 8 }
    };
    const customers = [
      { name: "李農", phone: "0912345678", farms: ["地點A", "地點B"] },
      { name: "陳農", phone: "0923456789", farms: ["地點A", "地點B"] },
      { name: "大農", phone: "0934567890", farms: ["地點A", "地點B"] }
    ];
    const schedules = [
      { date: '2025-02-05', farmer: '李農', farm: '地點A', area: 5, notes: '備註1' },
      { date: '2025-02-05', farmer: '李農', farm: '地點B', area: 6, notes: '備註1' },
      { date: '2025-02-10', farmer: '陳農', farm: '地點A', area: 7, notes: '備註2' },
      { date: '2025-02-15', farmer: '大農', farm: '地點A', area: 9, notes: '備註3' }
    ];
    
    // 初始設定：預設使用國曆 2025 年 2 月
    let currentMonth = new Date(2025, 1);
    let mobileCurrentDate = new Date();
    let dailyLimit = 10;
    let isMobileMonthView = false;
    const solarMonthNames = ["一月","二月","三月","四月","五月","六月","七月","八月","九月","十月","十一月","十二月"];
    let isSliding = false;
    let selectedFarms = [];
    
    /********************
     * 輔助函式
     ********************/
    function formatDate(date) {
      const yyyy = date.getFullYear();
      const mm = String(date.getMonth()+1).padStart(2,'0');
      const dd = String(date.getDate()).padStart(2,'0');
      return `${yyyy}-${mm}-${dd}`;
    }
    
    /********************
     * 側邊欄功能
     ********************/
    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebar-overlay');
      sidebar.classList.toggle('open');
      overlay.classList.toggle('show');
      const toggleButtons = document.querySelectorAll('.sidebar-toggle');
      if(sidebar.classList.contains('open')) {
        toggleButtons.forEach(btn => { btn.style.display = 'none'; });
      } else {
        toggleButtons.forEach(btn => { btn.style.display = 'block'; });
      }
    }
    
    /********************
     * 日曆切換功能
     ********************/
    function changeMonth(offset) {
      currentMonth.setMonth(currentMonth.getMonth() + offset);
      renderCalendar();
      if(window.innerWidth < 768) {
        document.getElementById('monthTitleMobile').textContent = document.getElementById('monthTitle').textContent;
      }
    }
    
    function renderCalendar() {
      const calendar = document.getElementById('calendar');
      const monthTitle = document.getElementById('monthTitle');
      calendar.innerHTML = '';
    
      const year = currentMonth.getFullYear();
      const month = currentMonth.getMonth();
      monthTitle.textContent = `${year}年 ${solarMonthNames[month]}`;
      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month+1, 0);
      const daysInMonth = lastDay.getDate();
      const firstDayOfWeek = firstDay.getDay();
    
      for(let i=0; i<firstDayOfWeek; i++){
        const emptyCell = document.createElement('div');
        emptyCell.classList.add('calendar-day','border-b','border-r','p-2','bg-gray-50');
        calendar.appendChild(emptyCell);
      }
    
      for(let day=1; day<=daysInMonth; day++){
        const dayCell = document.createElement('div');
        dayCell.classList.add('calendar-day','border-b','border-r','p-2');
        dayCell.innerHTML = `<div class="text-center font-medium">${day}</div>`;
        const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
        const scheduledItems = schedules.filter(s => s.date === dateStr);
        const farmers = {};
        scheduledItems.forEach(s => {
          if(!farmers[s.farmer]) farmers[s.farmer] = { farms: [], area: 0 };
          farmers[s.farmer].farms.push(s.farm);
          farmers[s.farmer].area += s.area;
        });
        let totalArea = 0;
        Object.entries(farmers).forEach(([farmer, data], index) => {
          if(index < 4) {
            const div = document.createElement('div');
            div.classList.add('schedule-item');
            div.textContent = `${farmer} (${data.farms.join(', ')}) - ${data.area}甲`;
            dayCell.appendChild(div);
          }
          totalArea += data.area;
        });
        if(totalArea >= dailyLimit) { dayCell.classList.add('over-limit'); }
        dayCell.addEventListener('click', () => showDailySchedule(dateStr));
        calendar.appendChild(dayCell);
      }
      if(window.innerWidth < 768) {
        document.getElementById('monthTitleMobile').textContent = monthTitle.textContent;
      }
    }
    
    /********************
     * 手機功能
     ********************/
    function toggleMobileView() {
      isMobileMonthView = !isMobileMonthView;
      const container = document.querySelector('.calendar-container');
      container.classList.toggle('mobile-month-view', isMobileMonthView);
      if(isMobileMonthView) { renderCalendar(); }
      else { renderMobileCard(mobileCurrentDate); }
    }
    
    function createMobileCardElement(date) {
      const dateStr = formatDate(date);
      const card = document.createElement('div');
      card.id = 'mobileCard';
      card.className = "min-h-[300px] bg-gradient-to-r from-blue-200 to-blue-400 rounded-2xl p-6 flex flex-col justify-center items-center";
      card.style.position = "absolute"; card.style.top = "0"; card.style.left = "0"; card.style.width = "100%";
      card.style.transition = "transform 0.7s ease-in-out";
      let html = `<h2 class="text-3xl font-bold mb-4">${dateStr}</h2>`;
      const daySchedules = schedules.filter(s => s.date === formatDate(date));
      const farmers = {};
      daySchedules.forEach(s => {
        if(!farmers[s.farmer]) farmers[s.farmer] = { farms: [], area: 0, notes: s.notes };
        farmers[s.farmer].farms.push(s.farm);
        farmers[s.farmer].area += s.area;
      });
      let totalArea = 0;
      if(Object.keys(farmers).length === 0) {
        html += `<p class="text-xl text-gray-700">當日無排程</p>`;
      } else {
        Object.entries(farmers).forEach(([farmer,data]) => {
          html += `<div class="bg-white rounded-lg p-4 mb-4 w-full shadow">
                    <p class="text-2xl font-semibold">${farmer}</p>
                    <p class="mt-2 text-lg">地塊：${data.farms.join(', ')}</p>
                    <p class="mt-2 text-lg">面積：${data.area} 甲</p>
                    <p class="mt-2 text-lg">備註：${data.notes}</p>
                  </div>`;
          totalArea += data.area;
        });
        html += `<p class="text-xl font-bold">總面積：${totalArea} 甲</p>`;
      }
      if(totalArea >= dailyLimit) {
        html += `<div class="bg-red-100 text-red-700 rounded p-2 mt-2">當日排程已達上限 (最多 ${dailyLimit} 甲)</div>`;
      }
      card.innerHTML = html;
      return card;
    }
    
    function renderMobileCard(date) {
      const container = document.getElementById('mobileCardContainer');
      container.innerHTML = "";
      const card = createMobileCardElement(date);
      card.style.transform = "translateX(0)";
      container.appendChild(card);
      document.getElementById('mobileDate').value = formatDate(date);
    }
    
    function slideMobileCard(direction) {
      if(isSliding) return;
      isSliding = true;
      const container = document.getElementById('mobileCardContainer');
      const currentCard = document.getElementById('mobileCard');
      const newDate = new Date(mobileCurrentDate);
      if(direction === 'left') { newDate.setDate(newDate.getDate()+1); }
      else { newDate.setDate(newDate.getDate()-1); }
      const newCard = createMobileCardElement(newDate);
      newCard.style.transform = (direction==='left') ? "translateX(150%)" : "translateX(-150%)";
      container.appendChild(newCard);
      newCard.offsetWidth;
      currentCard.style.transform = (direction==='left') ? "translateX(-150%)" : "translateX(150%)";
      newCard.style.transform = "translateX(0)";
      newCard.addEventListener('transitionend', function handler(e) {
        if(e.propertyName !== "transform") return;
        newCard.removeEventListener('transitionend',handler);
        container.removeChild(currentCard);
        mobileCurrentDate = newDate;
        isSliding = false;
      });
    }
    
    function onMobileDateChange() {
      const newDate = new Date(document.getElementById('mobileDate').value);
      if(!isNaN(newDate)) {
        mobileCurrentDate = newDate;
        renderMobileCard(mobileCurrentDate);
      }
    }
    
    /********************
     * 排程管理功能
     ********************/
    function showDailySchedule(dateStr) {
      const scheduledItems = schedules.filter(s => s.date === dateStr);
      const dailyScheduleTitle = document.getElementById('dailyScheduleTitle');
      const dailyScheduleContent = document.getElementById('dailyScheduleContent');
      dailyScheduleTitle.textContent = `日期: ${dateStr}`;
      dailyScheduleContent.innerHTML = '';
      const farmers = {};
      scheduledItems.forEach(s => {
        if(!farmers[s.farmer]) farmers[s.farmer] = { farms: [], area: 0, notes: s.notes };
        farmers[s.farmer].farms.push(s.farm);
        farmers[s.farmer].area += s.area;
      });
      let totalArea = 0;
      if(Object.keys(farmers).length === 0) {
        dailyScheduleContent.innerHTML = '<p>當日無排程</p>';
      } else {
        Object.entries(farmers).forEach(([farmer, data]) => {
          const div = document.createElement('div');
          div.classList.add('schedule-item');
          div.textContent = `${farmer} (${data.farms.join(', ')}) - ${data.area}甲 - ${data.notes}`;
          dailyScheduleContent.appendChild(div);
          totalArea += data.area;
        });
        dailyScheduleContent.innerHTML += `<p class="font-bold mt-2">總面積：${totalArea} 甲</p>`;
      }
      document.getElementById('dailyScheduleModal').classList.remove('hidden');
    }
    
    function hideDailySchedule() {
      document.getElementById('dailyScheduleModal').classList.add('hidden');
    }
    
    function showAddSchedule() {
      document.getElementById('scheduleDate').value = formatDate(new Date());
      document.getElementById('farmer_name').value = '';
      document.getElementById('selectedFarms').innerHTML = '';
      selectedFarms = [];
      document.getElementById('addScheduleModal').classList.remove('hidden');
    }
    
    function hideAddSchedule() {
      document.getElementById('addScheduleModal').classList.add('hidden');
    }
    
    function searchFarmer(query) {
      const suggestions = document.getElementById('farmer_suggestions');
      suggestions.innerHTML = '';
      if(query.length < 1) { suggestions.classList.add('hidden'); return; }
      const matches = customers.filter(c => c.name.includes(query) || c.phone.includes(query));
      if(matches.length > 0) {
        matches.forEach(c => {
          const div = document.createElement('div');
          div.classList.add('p-2','hover:bg-gray-100','cursor-pointer');
          div.textContent = `${c.name} (${c.phone})`;
          div.onclick = () => { document.getElementById('farmer_name').value = c.name; suggestions.classList.add('hidden'); };
          suggestions.appendChild(div);
        });
        suggestions.classList.remove('hidden');
      } else { suggestions.classList.add('hidden'); }
    }
    
    function showFarmModal() {
      const farmer = document.getElementById('farmer_name').value;
      if(!farmer) { alert('請先選擇農民'); return; }
      const farmContainer = document.getElementById('farm_checkboxes');
      farmContainer.innerHTML = '';
      const farmerData = customers.find(c => c.name === farmer);
      const farms = farmerData ? farmerData.farms : ["地點A","地點B","未知"];
      farms.forEach(farm => {
        const div = document.createElement('div');
        div.innerHTML = `<input type="checkbox" name="farm" value="${farm}" id="farm_${farm}" ${selectedFarms.includes(farm) ? 'checked' : ''}>
                         <label for="farm_${farm}">${farm} (${areaLookup[farmer]?.[farm] || 0}甲)</label>`;
        farmContainer.appendChild(div);
      });
      document.getElementById('farmModal').classList.remove('hidden');
    }
    
    function hideFarmModal() {
      document.getElementById('farmModal').classList.add('hidden');
    }
    
    function confirmFarms() {
      selectedFarms = Array.from(document.querySelectorAll('input[name="farm"]:checked')).map(cb => cb.value);
      const selectedFarmsDiv = document.getElementById('selectedFarms');
      selectedFarmsDiv.innerHTML = selectedFarms.length > 0 ? `已選擇地塊：${selectedFarms.join(', ')}` : '未選擇地塊';
      hideFarmModal();
    }
    
    function addSchedule() {
      const date = document.getElementById('scheduleDate').value;
      const farmer = document.getElementById('farmer_name').value;
      const notes = document.getElementById('notes').value;
    
      if(!date || !farmer || selectedFarms.length === 0) {
        alert('請填寫日期、農民名稱與至少選擇一個地塊');
        return;
      }
    
      let totalArea = 0;
      selectedFarms.forEach(farm => { totalArea += areaLookup[farmer]?.[farm] || 0; });
    
      const daySchedules = schedules.filter(s => s.date === date);
      const dayTotalArea = daySchedules.reduce((sum,s) => sum + s.area, 0);
      if(dayTotalArea + totalArea > dailyLimit) {
        alert(`當日排程已達上限，每天最多只能排 ${dailyLimit} 甲`);
        return;
      }
    
      selectedFarms.forEach(farm => {
        schedules.push({ date, farmer, farm, area: areaLookup[farmer]?.[farm] || 0, notes });
      });
      renderCalendar();
      if(window.innerWidth < 768 && !isMobileMonthView) { renderMobileCard(mobileCurrentDate); }
      hideAddSchedule();
    }
    
    function updateDailyLimit() {
      dailyLimit = parseFloat(document.getElementById('dailyLimit').value);
      renderCalendar();
      document.getElementById('mobileDailyLimit').value = dailyLimit;
      if(window.innerWidth < 768 && !isMobileMonthView) { renderMobileCard(mobileCurrentDate); }
    }
    
    function updateDailyLimitMobile() {
      dailyLimit = parseFloat(document.getElementById('mobileDailyLimit').value);
      renderCalendar();
      renderMobileCard(mobileCurrentDate);
    }
    
    /********************
     * 滑動與事件監聽（僅手機）
     ********************/
    if(window.innerWidth < 768) {
      document.addEventListener('keydown', function(e) {
        if(!isMobileMonthView) {
          if(e.key==='ArrowRight') slideMobileCard('left');
          else if(e.key==='ArrowLeft') slideMobileCard('right');
        }
      });
      const mobileCardElem = document.getElementById('mobileCardContainer');
      const hammerMobile = new Hammer(mobileCardElem);
      hammerMobile.on('swipeleft', () => !isMobileMonthView && slideMobileCard('left'));
      hammerMobile.on('swiperight', () => !isMobileMonthView && slideMobileCard('right'));
    }
    
    /********************
     * 列印功能
     ********************/
    function printDailySchedule() {
      const titleText = document.getElementById("dailyScheduleTitle").textContent;
      const printDate = titleText.split(":")[1].trim();
      const dateStr = printDate;
      const daySchedules = schedules.filter(s => s.date === dateStr);
      if(daySchedules.length === 0) {
        alert("當日沒有行程，無法列印！");
        return;
      }
      const farmers = {};
      daySchedules.forEach(s => {
        if(!farmers[s.farmer]) farmers[s.farmer] = { farms: [], area: 0, notes: s.notes };
        farmers[s.farmer].farms.push(s.farm);
        farmers[s.farmer].area += s.area;
      });
      let totalArea = 0;
      let tableRows = "";
      Object.entries(farmers).forEach(([farmer, data]) => {
        totalArea += data.area;
        tableRows += 
          `<tr>
            <td style="border: 1px solid #ccc; padding: 10px;">${printDate}</td>
            <td style="border: 1px solid #ccc; padding: 10px;">${farmer}</td>
            <td style="border: 1px solid #ccc; padding: 10px; text-align: center;">${data.area} 甲</td>
            <td style="border: 1px solid #ccc; padding: 10px;">${data.notes}</td>
          </tr>`;
      });
      tableRows += `<tr>
        <td colspan="2" style="border: 1px solid #ccc; padding: 10px; text-align: right;"><strong>總面積:</strong></td>
        <td style="border: 1px solid #ccc; padding: 10px; text-align: center;"><strong>${totalArea} 甲</strong></td>
        <td style="border: 1px solid #ccc; padding: 10px;"></td>
      </tr>`;
      if(totalArea > dailyLimit) {
        tableRows += `<tr>
          <td colspan="4" style="border: 1px solid #ccc; padding: 10px; text-align: center; color: red;"><strong>警告：當日排程已超過上限 (${dailyLimit} 甲)！</strong></td>
        </tr>`;
      }
      document.body.innerHTML = 
        `<div style="text-align: center; padding: 20px;">
          <h1 style="font-size: 22px; margin-bottom: 20px;">${printDate} - 插秧行程表</h1>
          <table style="width: 100%; border-collapse: collapse;">
            <thead>
              <tr>
                <th style="background: #34D399; color: white; padding: 10px; border: 1px solid #ccc;">日期</th>
                <th style="background: #34D399; color: white; padding: 10px; border: 1px solid #ccc;">農民姓名</th>
                <th style="background: #34D399; color: white; padding: 10px; border: 1px solid #ccc;">面積（甲）</th>
                <th style="background: #34D399; color: white; padding: 10px; border: 1px solid #ccc;">備註</th>
              </tr>
            </thead>
            <tbody>${tableRows}</tbody>
          </table>
        </div>`;
      window.print();
      location.reload();
    }
    
    /********************
     * 初始化
     ********************/
    function initializeCalendar() {
      renderCalendar();
      if(window.innerWidth < 768) { renderMobileCard(mobileCurrentDate); }
    }
    
    // 初始化
    initializeCalendar();
  </script>
</body>
</html>
