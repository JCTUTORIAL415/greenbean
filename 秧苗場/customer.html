<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>客戶管理</title>
  <style>
    /* 原始全局 CSS */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: Arial, sans-serif;
      display: flex;
    }
    /* 側邊欄 */
    .sidebar {
      width: 250px;
      height: 100vh;
      background-color: #34d399;
      color: white;
      position: fixed;
      left: 0;
      top: 0;
      display: flex;
      flex-direction: column;
      font-size: 16px;
      transition: transform 0.3s ease-in-out;
      z-index: 110; /* 提高 z-index，確保側邊欄不被遮罩蓋住 */
    }
    .sidebar a {
      display: block;
      padding: 0.8rem 1.25rem;
      color: white;
      text-decoration: none;
      font-size: 1rem;
      transition: background-color 0.3s;
    }
    .sidebar a:hover,
    .sidebar .active {
      background-color: #059669;
    }
    #title-text {
      text-align: center;
      margin-bottom: 22px;
      font-weight: bold;
      padding-top: 23px;
      font-size: 24px;
    }
    /* 內容區域 */
    .content {
      margin-left: 250px;
      padding: 20px;
      width: 100%;
    }
    h1 {
      font-size: 28px;
      margin-bottom: 20px;
      color: #2f4f4f;
    }
    h2 {
      font-size: 22px;
      margin-bottom: 15px;
      color: #2f4f4f;
    }
    /* 表格樣式 */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
    }
    th, td {
      padding: 10px 15px;
      border: 1px solid #ddd;
      text-align: left;
    }
    th {
      background-color: #34d399;
      color: white;
    }
    /* 按鈕樣式 */
    .action-button {
      background-color: #3b82f6;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      margin-right: 8px;
      margin-top: 4px;
      text-align: center; /* 文字置中 */
    }
    .action-button.edit {
      background-color: #fbbf24;
    }
    .action-button.delete {
      background-color: #ef4444;
    }
    .action-button.add-field {
      background-color: #8b5cf6;
    }
    .action-button.view-field {
      background-color: #10b981;
    }
    .action-button:hover {
      opacity: 0.85;
    }
    /* 客戶列表操作按鈕容器 */
    .action-button-container {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    /* Modal 共用樣式 */
    .modal {
      display: none; 
      position: fixed; 
      z-index: 100; 
      left: 0;
      top: 0;
      width: 100%; 
      height: 100%; 
      overflow: auto; 
      background-color: rgba(0,0,0,0.5);
    }
    .modal-content {
      background-color: #fff;
      margin: 10% auto; /* 預設上邊距 10% */
      padding: 20px;
      border-radius: 8px;
      width: 90%;
      max-width: 400px;
      position: relative;
      box-shadow: 0 0 10px rgba(0,0,0,0.3); /* 陰影效果 */
      max-height: 90vh; /* 限制最大高度 */
      overflow-y: auto; /* 超出高度時垂直滾動 */
    }
    .modal-content input,
    .modal-content select {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 8px;
      border: 1px solid #ddd;
      font-size: 16px;
    }
    .modal-content button {
      width: 100%;
      padding: 12px;
      background-color: #34d399;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 8px;
    }
    .modal-content button:hover {
      background-color: #059669;
    }
    .close {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
    }
    
    /* 響應式調整 */
    @media (max-width: 768px) {
      /* 手機版側邊欄預設隱藏 */
      .sidebar {
        transform: translateX(-100%);
      }
      .sidebar.open {
        transform: translateX(0);
      }
      /* 內容區塊不預留側邊欄 */
      .content {
        margin-left: 0;
        padding: 10px;
      }
      /* 手機版側邊欄 Toggle 按鈕 */
      .sidebar-toggle {
        display: block;
        position: fixed;
        top: 10px;
        left: 10px;
        background-color: rgba(16, 185, 129);
        color: white;
        padding: 8px 12px;
        border-radius: 4px;
        z-index: 120;
        cursor: pointer;
      }
      /* 側邊欄遮罩 */
      #sidebar-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.5);
        z-index: 90;
      }
      /* 手機版客戶列表操作按鈕調整 - 移除固定高度 */
      .action-button {
        padding: 6px 8px;
        font-size: 14px;
        margin: 2px;
        height: 40px;
        /* 移除固定 height 以讓內容自適應 */
      }
      .action-button-container {
        gap: 4px;
      }
      /* 手機版調整 Modal 使其下移且居中 */
      .modal-content {
        margin: 20% auto; /* 上邊距改為 20% */
      }
      .title{
        margin-left: 50px;
      }
    }
  </style>
  <!-- 載入 Google Maps API (請替換成你的 API key) -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDaN5_Va2EReS1HsZMG_gAyLYfzgQMV5Pg"></script>
</head>
<body>
  <!-- 手機側邊欄 Toggle 按鈕 (僅手機版出現) -->
  <div class="sidebar-toggle" onclick="toggleSidebar()">☰</div>
  <!-- 側邊欄 -->
  <div class="sidebar" id="sidebar">
    <div id="title-text">秧苗場管理</div>
    <a href="calender.html">插秧排程</a>
    <a href="workerManage.html">插秧工人管理</a>
    <a href="TransplantingList.html">插秧單</a>
    <a href="Shipment.html">出貨單</a>
    <a href="harvest.html">割稻管理</a>
    <a href="customer.html" class="active">客戶管理</a>
    <a href="profile.html">秧苗場個人檔案設定</a>
    <a href="Payment.html">收錢管理</a>
    <a href="#">登出</a>
  </div>
  <!-- 側邊欄遮罩 (手機版用) -->
  <div id="sidebar-overlay" onclick="toggleSidebar()"></div>
  
  <!-- 內容區域 -->
  <div class="content">
    <h1 class="title">客戶管理</h1>
    <!-- 新增客戶按鈕 -->
    <button class="action-button" style="margin-bottom:20px;" onclick="openCustomerModal()">新增客戶</button>
    <h2>客戶列表</h2>
    <table id="customerTable">
      <thead>
        <tr>
          <th>姓名</th>
          <th>電話</th>
          <th>地點</th>
          <th>田區數</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody>
        <!-- 客戶資料動態載入 -->
      </tbody>
    </table>
  </div>

  <!-- 客戶 Modal (新增/編輯) -->
  <div id="customerModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeCustomerModal()">&times;</span>
      <h2 id="customerModalTitle">新增客戶</h2>
      <input type="text" id="customerName" placeholder="客戶姓名" />
      <input type="text" id="customerPhone" placeholder="電話" />
      <input type="text" id="customerAddress" placeholder="地點" />
      <button id="customerModalSubmit" onclick="submitCustomer()">新增客戶</button>
    </div>
  </div>

  <!-- 田區 Modal (新增/編輯) -->
  <div id="fieldModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeFieldModal()">&times;</span>
      <h2 id="fieldModalTitle">新增田區</h2>
      <input type="text" id="fieldName" placeholder="田區名稱" />
      <input type="text" id="fieldLocation" placeholder="地點 (可空)" />
      <button type="button" onclick="getCurrentLocation('fieldLocation')">取得當前地點</button>
      <input type="number" id="fieldAreaValue" placeholder="面積" />
      <select id="fieldUnit">
        <option value="分">分</option>
        <option value="甲">甲</option>
      </select>
      <button id="fieldModalSubmit" onclick="submitField()">新增田區</button>
    </div>
  </div>

  <!-- 查看田區 Modal -->
  <div id="viewFieldsModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeViewFieldsModal()">&times;</span>
      <h2>田區資料</h2>
      <div id="fieldsContainer">
        <!-- 田區資料表格 -->
      </div>
    </div>
  </div>

  <script>
    // 資料存放區
    let customers = [];
    let editingIndex = null;                 // 客戶編輯時用
    let currentCustomerIndexForField = null;   // 田區所屬客戶記錄
    let editingFieldIndex = null;              // 田區編輯時用

    /* 客戶 Modal 相關 */
    function openCustomerModal() {
      document.getElementById("customerModal").style.display = "block";
    }
    function closeCustomerModal() {
      document.getElementById("customerModal").style.display = "none";
      clearCustomerForm();
      editingIndex = null;
      document.getElementById("customerModalTitle").textContent = "新增客戶";
      document.getElementById("customerModalSubmit").textContent = "新增客戶";
    }
    function clearCustomerForm() {
      document.getElementById("customerName").value = "";
      document.getElementById("customerPhone").value = "";
      document.getElementById("customerAddress").value = "";
    }
    function submitCustomer() {
      const name = document.getElementById("customerName").value.trim();
      const phone = document.getElementById("customerPhone").value.trim();
      const address = document.getElementById("customerAddress").value.trim();
      if (!name || !phone || !address) {
        alert("欄位不能漏喔～");
        return;
      }
      if (editingIndex === null) {
        const newCustomer = { name, phone, address, fields: [] };
        customers.push(newCustomer);
      } else {
        customers[editingIndex].name = name;
        customers[editingIndex].phone = phone;
        customers[editingIndex].address = address;
      }
      renderCustomerTable();
      closeCustomerModal();
    }
    function editCustomer(index) {
      const customer = customers[index];
      editingIndex = index;
      document.getElementById("customerName").value = customer.name;
      document.getElementById("customerPhone").value = customer.phone;
      document.getElementById("customerAddress").value = customer.address;
      document.getElementById("customerModalTitle").textContent = "編輯客戶";
      document.getElementById("customerModalSubmit").textContent = "更新客戶";
      openCustomerModal();
    }
    function confirmDelete(index) {
      if (confirm("確定要刪除該客戶嗎？此操作無法恢復喔！")) {
        customers.splice(index, 1);
        renderCustomerTable();
      }
    }
    
    /* 田區 Modal 相關 */
    function openFieldModal(index) {
      currentCustomerIndexForField = index;
      editingFieldIndex = null;
      document.getElementById("fieldModalTitle").textContent = "新增田區";
      document.getElementById("fieldModalSubmit").textContent = "新增田區";
      clearFieldForm();
      document.getElementById("fieldModal").style.display = "block";
    }
    function closeFieldModal() {
      document.getElementById("fieldModal").style.display = "none";
      clearFieldForm();
      editingFieldIndex = null;
    }
    function clearFieldForm() {
      document.getElementById("fieldName").value = "";
      document.getElementById("fieldLocation").value = "";
      document.getElementById("fieldAreaValue").value = "";
      document.getElementById("fieldUnit").value = "分";
    }
    function submitField() {
      const fieldName = document.getElementById("fieldName").value.trim();
      const fieldLocation = document.getElementById("fieldLocation").value.trim();
      const fieldAreaValue = document.getElementById("fieldAreaValue").value.trim();
      const fieldUnit = document.getElementById("fieldUnit").value;
      if (!fieldName || !fieldAreaValue) {
        alert("請填寫必填欄位：田區名稱與面積！");
        return;
      }
      const newField = { fieldName, fieldLocation, fieldArea: fieldAreaValue + fieldUnit };
      if (editingFieldIndex === null) {
        customers[currentCustomerIndexForField].fields.push(newField);
        alert("田區新增成功！");
      } else {
        customers[currentCustomerIndexForField].fields[editingFieldIndex] = newField;
        alert("田區更新成功！");
        editingFieldIndex = null;
      }
      renderCustomerTable();
      closeFieldModal();
    }
    function editField(customerIndex, fieldIndex) {
      closeViewFieldsModal();
      currentCustomerIndexForField = customerIndex;
      editingFieldIndex = fieldIndex;
      const field = customers[customerIndex].fields[fieldIndex];
      document.getElementById("fieldName").value = field.fieldName;
      document.getElementById("fieldLocation").value = field.fieldLocation;
      const match = field.fieldArea.match(/^(\d+(?:\.\d+)?)(.*)$/);
      if (match) {
        document.getElementById("fieldAreaValue").value = match[1];
        document.getElementById("fieldUnit").value = match[2] || "分";
      } else {
        document.getElementById("fieldAreaValue").value = "";
        document.getElementById("fieldUnit").value = "分";
      }
      document.getElementById("fieldModalTitle").textContent = "編輯田區";
      document.getElementById("fieldModalSubmit").textContent = "更新田區";
      document.getElementById("fieldModal").style.display = "block";
    }
    
    /* 查看田區 Modal 相關 */
    function openViewFieldsModal(index) {
      const customer = customers[index];
      let html = '<div class="overflow-x-auto"><table style="width:100%; border-collapse: collapse;">';
      html += '<thead><tr style="background-color: #34d399; color: white;">' +
              '<th style="padding: 10px 15px; border: 1px solid #ddd;">田區名稱</th>' +
              '<th style="padding: 10px 15px; border: 1px solid #ddd;">地點</th>' +
              '<th style="padding: 10px 15px; border: 1px solid #ddd;">面積</th>' +
              '<th style="padding: 10px 15px; border: 1px solid #ddd;">操作</th>' +
              '</tr></thead><tbody>';
      if (customer.fields.length > 0) {
        customer.fields.forEach((field, fieldIndex) => {
          html += `<tr>
                    <td style="padding: 10px 15px; border: 1px solid #ddd;">${field.fieldName}</td>
                    <td style="padding: 10px 15px; border: 1px solid #ddd;">${field.fieldLocation}</td>
                    <td style="padding: 10px 15px; border: 1px solid #ddd;">${field.fieldArea}</td>
                    <td style="padding: 10px 15px; border: 1px solid #ddd;">
                      <button class="action-button edit" onclick="editField(${index}, ${fieldIndex})">編輯</button>
                    </td>
                   </tr>`;
        });
      } else {
        html += '<tr><td colspan="4" style="padding: 10px 15px; border: 1px solid #ddd; text-align: center;">目前沒有田區資料</td></tr>';
      }
      html += '</tbody></table></div>';
      document.getElementById("fieldsContainer").innerHTML = html;
      document.getElementById("viewFieldsModal").style.display = "block";
    }
    function closeViewFieldsModal() {
      document.getElementById("viewFieldsModal").style.display = "none";
    }
    
    /* 利用 Geolocation API 取得當前地點，並用 Google Maps Geocoder 轉換地址 */
    function getCurrentLocation(inputId) {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          function(position) {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            const latlng = new google.maps.LatLng(lat, lng);
            const geocoder = new google.maps.Geocoder();
            geocoder.geocode({ 'location': latlng }, function(results, status) {
              if (status === google.maps.GeocoderStatus.OK) {
                if (results[0]) {
                  document.getElementById(inputId).value = `${results[0].formatted_address} (${lat.toFixed(6)},${lng.toFixed(6)})`;
                } else {
                  document.getElementById(inputId).value = `沒有找到地址,${lat.toFixed(6)},${lng.toFixed(6)}`;
                }
              } else {
                document.getElementById(inputId).value = "Geocoder 失敗: " + status;
              }
            });
          },
          function(error) {
            alert("無法取得地點: " + error.message);
          }
        );
      } else {
        alert("您的瀏覽器不支援地理定位");
      }
    }
    
    /* 渲染客戶列表 */
    function renderCustomerTable() {
      const tbody = document.getElementById("customerTable").getElementsByTagName("tbody")[0];
      tbody.innerHTML = "";
      customers.forEach((customer, index) => {
        const row = tbody.insertRow();
        row.innerHTML = `
          <td>${customer.name}</td>
          <td>${customer.phone}</td>
          <td>${customer.address}</td>
          <td>${customer.fields.length}</td>
          <td>
            <div class="action-button-container">
              <button class="action-button edit" onclick="editCustomer(${index})">編輯</button>
              <button class="action-button delete" onclick="confirmDelete(${index})">刪除</button>
              <button class="action-button add-field" onclick="openFieldModal(${index})">新增田區</button>
              <button class="action-button view-field" onclick="openViewFieldsModal(${index})">查看田區</button>
            </div>
          </td>
        `;
      });
    }
    
    /* 側邊欄 Toggle (僅手機版) */
    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebar-overlay');
      const toggleBtn = document.querySelector('.sidebar-toggle');
      if (sidebar.classList.contains('open')) {
        sidebar.classList.remove('open');
        overlay.style.display = "none";
        toggleBtn.style.display = "block";
      } else {
        sidebar.classList.add('open');
        overlay.style.display = "block";
        toggleBtn.style.display = "none";
      }
    }
  </script>
</body>
</html>
