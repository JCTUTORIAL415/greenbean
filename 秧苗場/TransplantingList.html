<script>

// Land data with coordinates
const lands = [
      { name: '田地A', coordinates: '24.123456,120.654321', area: 50, remarks: '無備註' },
      { name: '田地B', coordinates: '24.234567,120.765432', area: 30, remarks: '無備註' },

      { name: '田地D', coordinates: '24.456789,120.987654', area: 60, remarks: '無備註' }

// Order data
let orders = [
      { date: '2025-02-13', name: '王大哥', phone: '0912345678', planter: '老李', land: '田地A', coordinates: '24.123456,120.654321', area: 50, remarks: '無備註', singleBuy: 100, quantity: 50, selfTransport: false },
      { date: '2025-02-14', name: '陳小妹', phone: '0987654321', planter: '阿明', land: '田地B', coordinates: '24.234567,120.765432', area: 30, remarks: '無備註', singleBuy: 50, quantity: 40, selfTransport: true },
      { date: '2025-02-15', name: '張老闆', phone: '0923456789', planter: '小張', land: '田地A', coordinates: '24.123456,120.654321', area: 70, remarks: '無備註', singleBuy: 200, quantity: 80, selfTransport: false },
      { date: '2025-02-16', name: '李阿姨', phone: '0976543210', planter: '老李', land: '田地B', coordinates: '24.234567,120.765432', area: 40, remarks: '無備註', singleBuy: 80, quantity: 60, selfTransport: true },
      { date: '2025-02-17', name: '王大哥', phone: '0912345678', planter: '阿明', land: '田地A', coordinates: '24.123456,120.654321', area: 60, remarks: '無備註', singleBuy: 150, quantity: 70, selfTransport: false },
      { date: '2025-02-18', name: '陳小妹', phone: '0987654321', planter: '小張', land: '田地B', coordinates: '24.234567,120.765432', area: 20, remarks: '無備註', singleBuy: 30, quantity: 25, selfTransport: true },
      { date: '2025-02-19', name: '張老闆', phone: '0923456789', planter: '老李', land: '田地C', coordinates: '24.345678,120.876543', area: 90, remarks: '無備註', singleBuy: 250, quantity: 100, selfTransport: false },
      { date: '2025-02-20', name: '陳農', phone: '0988888888', planter: '老李', land: '田地D', coordinates: '24.456789,120.987654', area: 60, remarks: '無備註', singleBuy: 120, quantity: 55, selfTransport: true }
];
 
let currentReceiptId = '';
 
// Populate farmer filter dropdown
function populateFarmerFilter() {
const select = document.getElementById('farmerFilter');
if (!select) return;
select.innerHTML = '<option value="">全部</option>';
customers.forEach(customer => {
const option = document.createElement('option');
option.value = customer.name;
option.textContent = customer.name;
select.appendChild(option);
      });
    }
 
// Populate land options
function populateLandOptions(selectId) {
const select = document.getElementById(selectId);
if (!select) return;
select.innerHTML = selectId === 'addLand' ? '<option value="臨時田地">臨時田地</option>' : '<option value="">請選擇田地</option>';
lands.forEach(land => {
const option = document.createElement('option');
option.value = land.name;
option.textContent = land.name;
select.appendChild(option);
      });
    }
 
// Toggle temporary land input
function toggleTempLandInput() {
const select = document.getElementById('addLand');
const tempInput = document.getElementById('addTempLand');
const tempRemarks = document.getElementById('addTempLandRemarks');
const tempArea = document.getElementById('addTempLandArea');
if (!select || !tempInput || !tempRemarks || !tempArea) return;
if (select.value === '臨時田地') {
tempInput.style.display = 'block';
tempRemarks.style.display = 'block';
tempArea.style.display = 'block';
      } else {
tempInput.style.display = 'none';
tempRemarks.style.display = 'none';
tempArea.style.display = 'none';
tempInput.value = '';

async function downloadSummaryReceipt() {
if (!window.html2canvas || !window.jspdf) {
alert('無法載入必要的腳本，請檢查網絡連接並重試。');
return;
      }
const { jsPDF } = window.jspdf;
const summaryElement = document.getElementById('summaryPrintArea');
if (!summaryElement) return;
const copies = parseInt(document.getElementById('printCopies')?.value) || 1;
const originalHeight = summaryElement.style.height;
const originalMaxHeight = summaryElement.style.maxHeight;
const originalOverflow = summaryElement.style.overflow;
summaryElement.style.height = 'auto';
summaryElement.style.maxHeight = 'none';
summaryElement.style.overflow = 'visible';
try {
const canvas = await html2canvas(summaryElement, { scale: 2, useCORS: true, scrollX: 0, scrollY: 0, height: summaryElement.scrollHeight });
const imgData = canvas.toDataURL('image/png');
const pdf = new jsPDF('p', 'mm', 'a4');
const pdfWidth = 210;
const pdfHeight = (canvas.height * pdfWidth) / canvas.width;
const pageHeight = 297;
for (let i = 0; i < copies; i++) {
let heightLeft = pdfHeight;
let position = 0;
pdf.addImage(imgData, 'PNG', 0, position, pdfWidth, pdfHeight);
heightLeft -= pageHeight;
while (heightLeft > 0) {
position -= pageHeight;
pdf.addPage();
pdf.addImage(imgData, 'PNG', 0, position, pdfWidth, pdfHeight);
heightLeft -= pageHeight;
          }
if (i < copies - 1) pdf.addPage();
        }
pdf.save('transplanting-receipt.pdf');
      } catch (error) {
console.error('生成PDF失敗:', error);
alert('生成收據失敗，請稍後重試。');
      }
summaryElement.style.height = originalHeight;
summaryElement.style.maxHeight = originalMaxHeight;
summaryElement.style.overflow = originalOverflow;
const row = document.querySelector(`#orderTable tr[data-date="${document.getElementById('summaryPrintArea')?.querySelector('.receipt-row:first-child .receipt-field')?.innerText}"]`);
if (row) {
row.setAttribute('data-processed', 'true');
row.style.backgroundColor = '#e6ffe6';
      }
const signatureImg = document.getElementById(`signature-${currentReceiptId}`);
if (signatureImg) {
signatureImg.src = '';
signatureImg.style.display = 'none';
signatureImg.previousElementSibling.style.display = 'block';
      }

sortOrderTable();
    }

function loadWageTable() {

function calculateWageReceipt() {
const checkboxes = document.querySelectorAll('.wage-checkbox:checked');
if (checkboxes.length === 0) {
alert('請先勾選至少一筆資料');
return;
      }
const wageRate = 200;
const selfTransportDiscount = 5;
const wageReceiptsContainer = document.getElementById('wageReceiptsContainer');
if (!wageReceiptsContainer) return;
wageReceiptsContainer.innerHTML = '';
const currentDate = new Date().toLocaleDateString('zh-TW');
let workerGroups = {};
checkboxes.forEach(cb => {
const row = cb.closest('tr');
const worker = row.cells[3].innerText.trim();
const quantity = parseFloat(row.cells[8].innerText) || 0;
const area = parseFloat(row.cells[5].innerText) || 0;
const selfTransport = row.cells[9].innerText === '是';
if (!workerGroups[worker]) {
workerGroups[worker] = { count: 0, totalQty: 0, totalArea: 0, totalWage: 0 };
        }
workerGroups[worker].count++;
workerGroups[worker].totalQty += quantity;
workerGroups[worker].totalArea += area;
workerGroups[worker].totalWage += quantity * (wageRate - (selfTransport ? selfTransportDiscount : 0));
      });
let index = 0;
for (const worker in workerGroups) {
const { count, totalQty, totalArea, totalWage } = workerGroups[worker];
const receiptId = `wage${index++}`;

          <div class="receipt-row"><label>插秧總粒數：</label><div class="receipt-field">${totalQty}</div></div>
          <div class="receipt-row"><label>總計工資：</label><div class="receipt-field">${totalWage} 元</div></div>
          <div class="mt-4 text-center">
            <p class="font-bold mb-2">簽名：</p>
            <button class="bg-blue-500 text-white px-4 py-2 rounded" onclick="openSignatureModal('${receiptId}')">簽名</button>
            <img id="signature-${receiptId}" class="signature-img" src="" style="display: none;">

        `;

    }

if (modal) modal.classList.remove('active');
    }
function saveSignature() {
const canvas = document.getElementById('signatureCanvas');
if (!canvas) return;
const ctx = canvas.getContext('2d');
const tempCanvas = document.createElement('canvas');
tempCanvas.width = canvas.height;
tempCanvas.height = canvas.width;
const tempCtx = tempCanvas.getContext('2d');
tempCtx.translate(0, canvas.width);
tempCtx.rotate(-Math.PI / 2);
tempCtx.drawImage(canvas, 0, 0);
const signatureData = tempCanvas.toDataURL();
const signatureImg = document.getElementById(`signature-${currentReceiptId}`);
if (signatureImg) {
signatureImg.src = signatureData;
signatureImg.style.display = 'block';
signatureImg.previousElementSibling.style.display = 'none';
      }
closeSignatureModal();
    }
function clearSignature() {
const canvas = document.getElementById('signatureCanvas');
if (!canvas) return;
const ctx = canvas.getContext('2d');
ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
function initializeSignatureCanvas(canvasId) {
const canvas = document.getElementById(canvasId);
if (!canvas) {
console.error(`Cannot find Canvas ID: ${canvasId}`);
return;
      }
const ctx = canvas.getContext('2d');
let isDrawing = false;
let lastX = 0;
let lastY = 0;
function getPosition(e) {
const rect = canvas.getBoundingClientRect();
if (e.type.includes('touch')) {
return { x: e.touches[0].clientX - rect.left, y: e.touches[0].clientY - rect.top };
        }
return { x: e.clientX - rect.left, y: e.clientY - rect.top };
      }
function startDrawing(e) {
e.preventDefault();
isDrawing = true;
const pos = getPosition(e);
lastX = pos.x;
lastY = pos.y;
ctx.beginPath();
ctx.moveTo(lastX, lastY);
      }
function draw(e) {
if (!isDrawing) return;
e.preventDefault();
const pos = getPosition(e);
ctx.lineTo(pos.x, pos.y);
ctx.strokeStyle = '#000';
ctx.lineWidth = 2;
ctx.lineCap = 'round';
ctx.stroke();
lastX = pos.x;
lastY = pos.y;
      }
function stopDrawing() {
isDrawing = false;
ctx.closePath();
      }
// Remove existing listeners to prevent duplicates
canvas.removeEventListener('mousedown', startDrawing);
canvas.removeEventListener('mousemove', draw);
canvas.removeEventListener('mouseup', stopDrawing);
canvas.removeEventListener('touchstart', startDrawing);
canvas.removeEventListener('touchmove', draw);
canvas.removeEventListener('touchend', stopDrawing);
// Add new listeners
canvas.addEventListener('mousedown', startDrawing);
canvas.addEventListener('mousemove', draw);
canvas.addEventListener('mouseup', stopDrawing);
canvas.addEventListener('touchstart', startDrawing);
canvas.addEventListener('touchmove', draw);
canvas.addEventListener('touchend', stopDrawing);
    }
document.addEventListener('DOMContentLoaded', () => {
populateFarmerFilter();
initializeOrderTable();
showOrderManagement();
    });
